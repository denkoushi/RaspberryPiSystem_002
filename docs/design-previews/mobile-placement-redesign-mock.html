<title>配膳スマホ 新画面</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-portrait route ticket — three stubs (移動票 / 現品票 / 棚) stacked on a seam, one thumb button at the bottom drives the next scan. */
:root{
  color-scheme:dark;
  --bg:#0d0f0e;          /* factory-floor black, faint green bias */
  --panel:#171a19;
  --panel-2:#1f2321;
  --line:#2c312e;
  --ink:#f2f4f1;
  --ink-2:#a3aaa5;
  --ink-3:#6c736e;
  --slip:#38bdf8;        /* 移動票 */
  --actual:#c4b5fd;      /* 現品票 */
  --shelf:#fbbf24;       /* 棚 */
  --ok:#34d399;
  --ng:#f87171;
  --font-body:"Zen Kaku Gothic New",system-ui,"Hiragino Sans",sans-serif;
  --font-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* mock controls (outside the phone) */
.demo{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:13px;color:var(--ink-2)}
.demo button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.demo button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

/* phone */
.phone{position:relative;width:min(390px,100%);height:min(844px,calc(100dvh - 90px));min-height:640px;
  background:var(--bg);border:1px solid var(--line);border-radius:34px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 30px 80px -30px #000}
@media (max-width:460px){body{padding-left:0;padding-right:0;padding-block:0}.demo{padding:8px 16px 0}.phone{border:0;border-radius:0;height:calc(100dvh - 52px);width:100%}}

.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;height:52px;flex-shrink:0}
.top h1{margin:0;font-family:var(--font-body);font-weight:900;font-size:19px;letter-spacing:.12em}
.progress{display:flex;gap:4px;margin-left:auto}
.progress i{width:18px;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.progress i.on{background:var(--ink)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

/* stubs */
.route{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:6px 14px 0;position:relative}
.stub{position:relative;border-radius:16px;background:var(--panel);border:1px solid var(--line);
  padding:12px 14px 12px 18px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;
  min-height:96px;transition:border-color .25s,background .25s,opacity .25s;text-align:left;width:100%}
.stub::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.stub.slip{--c:var(--slip)} .stub.actual{--c:var(--actual)} .stub.shelf{--c:var(--shelf)}
.stub.next{border-color:var(--c);background:var(--panel-2)}
.stub.locked{opacity:.38}
.stub .tag{grid-column:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--c);letter-spacing:.06em}
.stub .val{grid-column:1;font-family:var(--font-num);font-weight:700;font-size:26px;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stub .val.empty{font-family:var(--font-body);font-size:17px;font-weight:700;color:var(--ink-3);letter-spacing:0}
.stub .sub{grid-column:1;font-size:14px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.stub .sub b{color:var(--ink);font-weight:700}
.stub .side{grid-column:2;grid-row:1/span 3;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mini{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.mini svg{width:18px;height:18px}
.shelf .val.big{font-family:var(--font-display);font-weight:400;font-size:40px;color:var(--shelf);letter-spacing:.04em}

/* match seal between 移動票 and 現品票 */
.seal{position:absolute;right:28px;z-index:3;width:64px;height:64px;border-radius:50%;
  display:grid;place-items:center;text-align:center;pointer-events:none;
  border:3px solid var(--s);color:var(--s);background:color-mix(in srgb,var(--bg) 82%,var(--s));
  font-family:var(--font-body);font-weight:900;line-height:1;transform:rotate(-12deg) scale(.4);opacity:0;transition:transform .32s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.seal.show{transform:rotate(-12deg) scale(1);opacity:1}
.seal.ok{--s:var(--ok)} .seal.ng{--s:var(--ng)}
.seal .k{font-size:26px} .seal .w{font-size:11px;font-family:var(--font-body);font-weight:900;letter-spacing:.1em;margin-top:2px}
@media (prefers-reduced-motion:reduce){.seal{transition:none}}

/* 分配 row */
.branch{display:flex;align-items:center;gap:8px;padding:2px 2px 0;min-height:44px}
.branch .lbl{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;flex-shrink:0}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{border-color:var(--shelf);background:color-mix(in srgb,var(--panel) 70%,var(--shelf));color:var(--ink)}
.seg button .n{font-size:11px;color:var(--ink-2);margin-left:4px;font-weight:500}

/* thumb zone */
.dock{flex-shrink:0;padding:10px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:stretch}
.primary{flex:1;height:64px;border:0;border-radius:18px;background:var(--pc,var(--ink));color:#0d0f0e;
  display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;font-weight:900;letter-spacing:.04em;transition:background .25s,transform .08s}
.primary:active{transform:scale(.98)}
.primary svg{width:26px;height:26px}
.primary .to{font-family:var(--font-num);font-weight:700;font-size:21px;letter-spacing:.02em}
.alt{width:64px;height:64px;border-radius:18px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-2)}
.alt svg{width:24px;height:24px;color:var(--ink)}

/* scan overlay */
.cam{position:absolute;inset:0;z-index:10;background:#050605;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.cam .frame{position:relative;width:78%;height:140px;border-radius:14px;
  background:repeating-linear-gradient(90deg,#1c201e 0 3px,#0b0d0c 3px 5px,#1c201e 5px 6px,#0b0d0c 6px 10px);opacity:.9}
.cam .frame::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:2px;background:var(--cc);box-shadow:0 0 14px var(--cc);animation:sweep 1s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-48px)}to{transform:translateY(48px)}}
@media (prefers-reduced-motion:reduce){.cam .frame::after{animation:none}}
.cam .what{font-size:22px;font-weight:900;color:var(--cc);display:flex;align-items:center;gap:10px}
.cam .close{position:absolute;top:16px;right:16px}

/* shelf sheet */
.scrim{position:absolute;inset:0;z-index:8;background:#000a}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.axis{display:grid;grid-template-columns:repeat(3,1fr) 12px repeat(3,1fr);gap:6px}
.axis button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:900}
.axis button[aria-pressed="true"]{border-color:var(--shelf);color:var(--shelf)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chips button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-family:var(--font-display);font-size:22px;color:var(--ink)}
.chips button .p{display:block;font-family:var(--font-body);font-size:11px;color:var(--ink-3);font-weight:700}

/* toast */
.done{position:absolute;inset:0;z-index:12;background:color-mix(in srgb,var(--bg) 88%,var(--ok));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.done .big{font-family:var(--font-display);font-size:52px;color:var(--shelf)}
.done .msg{font-size:20px;font-weight:900}
.done svg{width:64px;height:64px;color:var(--ok)}

.note{max-width:390px;font-size:13px;color:var(--ink-3);line-height:1.6;text-align:center;margin:0}

/* ---------- sub screens ---------- */
:root{--teal:#2dd4bf;--lime:#a3e635}
.view{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.top .ttl-sub{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.04em}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 10px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.toast{position:absolute;left:14px;right:14px;bottom:96px;z-index:7;background:var(--ink);color:var(--bg);border-radius:14px;padding:13px 16px;font-weight:900;font-size:15px;display:flex;gap:10px;align-items:center;animation:pop .22s ease-out;box-shadow:0 12px 30px -10px #000}
.toast svg{width:20px;height:20px;color:#047857}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.seg2{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.seg2 button{flex:1;height:40px;padding:0 14px;border:0;background:transparent;font-size:14px;font-weight:900;color:var(--ink-3);white-space:nowrap}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.empty-state{margin:auto;text-align:center;color:var(--ink-3);font-size:15px;font-weight:700;display:grid;gap:10px;justify-items:center;padding:24px 0}
.empty-state svg{width:44px;height:44px;opacity:.7}
.ghost{height:64px;padding:0 16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;flex:1}
.ghost svg{width:22px;height:22px}
.ghost.danger{color:var(--ng);border-color:color-mix(in srgb,var(--ng) 45%,var(--line))}

/* menu */
.menu{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu .grab{grid-column:1/-1;width:40px;height:4px;border-radius:2px;background:var(--line);justify-self:center;margin-bottom:4px}
.tile{height:88px;border-radius:16px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px 14px;font-size:16px;font-weight:900;text-align:left}
.tile svg{width:26px;height:26px;color:var(--tc)}
.tile small{display:block;font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.02em;margin-top:2px}

/* 部品を探す */
.qbox{margin:2px 14px 0;display:flex;align-items:center;gap:10px;height:58px;border-radius:16px;border:1.5px solid var(--shelf);background:var(--panel-2);padding:0 8px 0 14px;flex-shrink:0}
.qbox>svg{width:22px;height:22px;color:var(--shelf);flex-shrink:0}
.qtext{flex:1;font-size:23px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtext.empty{color:var(--ink-3);font-size:17px;font-weight:700}
.qcaret{width:2px;height:24px;background:var(--shelf);animation:blink 1s steps(1) infinite;flex-shrink:0;margin-left:-8px}
@keyframes blink{50%{opacity:0}}
.filters{display:flex;gap:6px;padding:8px 14px 6px;align-items:center;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.count{margin-left:auto;font-size:13px;color:var(--ink-3);font-weight:700;white-space:nowrap;padding-left:6px}
.hit{display:grid;grid-template-columns:auto 1fr;gap:1px 14px;align-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:10px 12px;text-align:left;width:100%;flex-shrink:0}
.hit .code{grid-row:1/span 2;font-family:var(--font-num);font-weight:700;font-size:20px;color:var(--shelf);min-width:116px}
.hit .nm{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit .meta{font-size:12px;color:var(--ink-2);font-family:var(--font-num)}
.hit[aria-pressed="true"]{border-color:var(--shelf);background:var(--panel-2)}
.hit .more{grid-column:1/-1;display:none;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;gap:4px 14px;flex-wrap:wrap;font-family:var(--font-num)}
.hit .more b{color:var(--ink);font-weight:700}
.hit[aria-pressed="true"] .more{display:flex}
.hit mark{background:none;color:var(--shelf)}
.kb{flex-shrink:0;border-top:1px solid var(--line);background:var(--panel);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:7px}
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.presets button{height:38px;padding:0 13px;border-radius:10px;border:1px solid color-mix(in srgb,var(--shelf) 40%,var(--line));background:var(--bg);color:var(--shelf);font-weight:900;font-size:15px;white-space:nowrap;flex-shrink:0}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;height:146px;overflow-y:auto;scrollbar-width:none;align-content:start}
.keys button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:19px;font-weight:900}
.keys button:active,.presets button:active{background:var(--panel-2)}
.keys .none{grid-column:1/-1;align-self:center;text-align:center;font-size:13px;color:var(--ink-3);font-weight:700;padding-top:46px}
.kbrow{display:flex;gap:6px}
.kbrow .seg2 button{height:42px}
.kbrow .del{margin-left:auto;height:42px;padding:0 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--ng) 45%,var(--line));background:var(--bg);color:var(--ng);display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px}
.kbrow .del svg{width:20px;height:20px}

/* 棚マスタ */
.modebar{padding:0 14px 8px;flex-shrink:0}
.fmap{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:0 14px 6px}
.zone{border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:9px;display:flex;flex-direction:column;gap:7px;text-align:left;min-height:0}
.zone .zn{font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.zone .zn small{font-size:11px;color:var(--ink-3);font-weight:700;white-space:nowrap}
.mm{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:3px;min-height:0}
.mm i{border-radius:3px;background:var(--panel-2)}
.mm i.S{background:var(--shelf)} .mm i.M{background:var(--teal)} .mm i.A{background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 4px)} .mm i.E{background:transparent;border:1px dashed var(--line)}
.zone.has-from{border-color:var(--shelf)}
.axes{display:flex;justify-content:space-between;padding:0 18px 4px;font-size:11px;color:var(--ink-3);font-weight:900;letter-spacing:.1em;flex-shrink:0}
.zgrid{flex:1;min-height:0;display:grid;grid-template-columns:30px repeat(4,1fr) 30px;grid-template-rows:30px repeat(4,1fr) 30px;gap:6px;padding:0 10px 6px}
.edge{border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12px;font-weight:900;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:4px;padding:0}
.edge.v{writing-mode:vertical-rl;letter-spacing:.1em}
.edge.v .ar{display:inline-block;writing-mode:horizontal-tb;margin-bottom:4px}
.edge.n{grid-column:2/6;grid-row:1} .edge.s{grid-column:2/6;grid-row:6} .edge.w{grid-column:1;grid-row:2/6} .edge.e{grid-column:6;grid-row:2/6}
.cell{border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:900;position:relative;background:var(--panel);min-height:0;padding:0}
.cell.S{border-color:color-mix(in srgb,var(--shelf) 50%,var(--line));color:var(--shelf)}
.cell .no{font-family:var(--font-num);font-size:26px;line-height:1}
.cell .pre{font-size:10px;color:var(--ink-3);font-weight:700}
.cell.M{background:color-mix(in srgb,var(--panel) 72%,var(--teal));border-color:transparent;color:var(--ink);font-size:12px;font-family:var(--font-num)}
.cell.M .k{font-size:10px;color:var(--teal);font-family:var(--font-body)}
.cell.A{background:repeating-linear-gradient(135deg,var(--panel) 0 7px,var(--bg) 7px 14px);color:var(--ink-3);font-size:11px}
.cell.E{background:transparent;border-style:dashed;color:var(--ink-3);font-size:11px}
.cell.drop{border:1.5px solid var(--ok);color:var(--ok);background:color-mix(in srgb,var(--bg) 88%,var(--ok))}
.cell.from{outline:3px solid var(--shelf);outline-offset:2px;animation:pulse .7s ease-in-out infinite alternate}
.cell.sel{outline:3px solid var(--ink);outline-offset:2px}
.cell .z2{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--slip);box-shadow:0 0 0 2px var(--panel)}
@keyframes pulse{to{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.cell.from,.qcaret{animation:none}}
.mstatus{flex-shrink:0;padding:6px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sline{min-height:56px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;font-size:16px;font-weight:900}
.sline .dot{width:10px;height:10px;border-radius:50%;background:var(--sc,var(--ink-3));flex-shrink:0}
.sline .code{font-family:var(--font-num);color:var(--shelf)}
.sline .mini{margin-left:auto}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.types button{height:54px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.types button i{width:16px;height:10px;border-radius:3px;display:block}
.legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--ink-3);font-weight:700}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.row2{display:flex;gap:8px}
.row2 .ghost{height:52px;font-size:15px}
.row2 .primary{height:52px;font-size:16px}

/* パレット */
.machines{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none;flex-shrink:0}
.machines .chip{height:40px;font-size:14px;font-family:var(--font-num);font-weight:700}
.machines .chip[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);background:color-mix(in srgb,var(--panel) 82%,var(--teal))}
.pallets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 14px 10px;flex-shrink:0}
.pal{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.pal b{font-family:var(--font-num);font-size:24px;line-height:1}
.pal .dots{display:flex;gap:3px;height:6px}
.pal .dots i{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.pal .dots i.more{width:auto;height:auto;background:none;font-size:10px;line-height:6px;color:var(--teal);font-style:normal;font-weight:900}
.pal[aria-pressed="true"]{border-color:var(--teal);background:color-mix(in srgb,var(--panel) 70%,var(--teal))}
.pal[aria-pressed="true"] .dots i{background:var(--ink)} .pal[aria-pressed="true"] .dots i.more{color:var(--ink);background:none}
.palhead{display:flex;align-items:center;gap:10px;padding:2px 14px 8px;flex-shrink:0;border-top:1px solid var(--line);padding-top:10px}
.palhead .pn{font-family:var(--font-num);font-size:26px;font-weight:700;color:var(--teal);line-height:1}
.palhead .pl{font-size:13px;color:var(--ink-2);font-weight:700}
.palhead .clear{margin-left:auto;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ng);font-size:13px;font-weight:900}
.palhead .clear.arm{background:var(--ng);color:var(--bg);border-color:var(--ng)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:10px 14px;text-align:left;width:100%;flex-shrink:0}
.item .nm{font-size:16px;font-weight:900}
.item .meta{font-size:12px;color:var(--ink-2);font-family:var(--font-num)}
.item .qty{grid-column:2;grid-row:1/span 2;font-family:var(--font-num);font-size:24px;font-weight:700;color:var(--teal)}
.item .qty small{font-size:12px;color:var(--ink-3);margin-right:1px}
.item[aria-pressed="true"]{border-color:var(--ink);background:var(--panel-2)}

/* 購買照会 */
.ponum{margin:2px 14px 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);padding:14px 16px 14px 20px;position:relative;flex-shrink:0}
.ponum::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--lime)}
.ponum .lbl{font-size:13px;font-weight:700;color:var(--lime);letter-spacing:.06em;display:flex;justify-content:space-between}
.ponum .lbl span{color:var(--ink-2)}
.digits{font-family:var(--font-num);font-size:36px;font-weight:700;letter-spacing:.04em;line-height:1.2;margin-top:2px}
.digits .g{color:var(--line)}
.porow{border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 10px;flex-shrink:0}
.porow .mc{font-size:24px;font-weight:900;font-family:var(--font-num);line-height:1.1}
.porow .qty{grid-column:2;grid-row:1;font-family:var(--font-num);font-size:28px;font-weight:700;color:var(--lime);line-height:1.1}
.porow .qty small{font-size:13px;color:var(--ink-3);font-family:var(--font-body);margin-left:2px}
.porow dl{grid-column:1/-1;margin:0;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 10px;font-size:15px;align-items:baseline}
.porow dt{color:var(--ink-3);font-weight:700;font-size:12px}
.porow dd{margin:0;font-weight:700;font-family:var(--font-num)}
.porow dd.jp{font-family:var(--font-body);font-weight:900}
.porow .diff{grid-column:1/-1;font-size:12px;color:var(--shelf);font-weight:700}

/* Zero2W */
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:700;margin-left:auto;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.2}}
.zrow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);flex-shrink:0}
.zrow .code{grid-row:1/span 2;white-space:nowrap;letter-spacing:-.02em;font-family:var(--font-num);font-weight:700;font-size:16px;color:var(--shelf)}
.zrow .code small{display:block;font-size:11px;color:var(--ink-3);font-family:var(--font-body);font-weight:700}
.zrow .nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zrow .meta{font-size:12px;color:var(--ink-2);font-family:var(--font-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zrow .t{font-size:12px;color:var(--ink-3);font-weight:700;text-align:right;white-space:nowrap}
.pill{font-size:11px;font-weight:900;padding:3px 8px;border-radius:999px;border:1px solid;white-space:nowrap;justify-self:end}
.pill.ok{color:var(--ok)} .pill.wait{color:var(--shelf)}
.zrow.fresh{animation:flash 1.2s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--panel) 60%,var(--ok))}}
</style>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DATA = {
    slip: { order: '0002178005', seiban: 'BA1S2201', name: 'ブラケット取付板' },
    actualOk: { po: '4501238876' },
    actualNg: { po: '4501240113', seiban: 'BA1S2310' },
  };
  const ICON = {
    scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M10 9v6M13 9v6M17 9v6"/></svg>',
    qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h3v-3"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M4 12.5l5 5L20 6.5"/></svg>',
    redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>',
  };
  let scenario = 'ok';
  let s;
  const reset = () => { s = { slip: null, actual: null, match: null, shelf: null, branch: 'new' }; render(); };

  function step() {
    if (!s.slip) return 'slip';
    if (!s.actual || s.match === 'ng') return 'actual';
    if (!s.shelf) return 'shelf';
    return 'confirm';
  }

  function render() {
    const st = step();
    // stubs
    const slip = $('st-slip'), actual = $('st-actual'), shelf = $('st-shelf');
    [slip, actual, shelf].forEach((el) => el.classList.remove('next', 'locked'));
    ({ slip, actual, shelf })[st]?.classList.add('next');
    if (!s.slip) { actual.classList.add('locked'); shelf.classList.add('locked'); }
    else if (s.match !== 'ok') shelf.classList.add('locked');

    setVal('slip', s.slip ? s.slip.order : '製造order を読む', !s.slip,
      s.slip ? `製番 <b>${s.slip.seiban}</b><span>${s.slip.name}</span>` : '');
    $('x-slip').innerHTML = s.slip ? `<span class="mini" aria-hidden="true">${ICON.redo}</span>` : '';
    setVal('actual', s.actual ? s.actual.po : '注文番号 を読む', !s.actual,
      s.actual ? (s.match === 'ok' ? `製番 <b>${s.slip.seiban}</b><span>同じ品番</span>` : `製番 <b style="color:var(--ng)">${s.actual.seiban}</b><span>品番も違う</span>`) : '');
    setVal('shelf', s.shelf ? s.shelf : '棚の QR を読む', !s.shelf, s.shelf ? '前回もこの棚' : '');
    $('v-shelf').classList.toggle('big', !!s.shelf);
    $('x-shelf').innerHTML = s.shelf ? `<span class="mini" aria-hidden="true">${ICON.redo}</span>` : '';

    // seal sits on the seam between 現品票 and 棚
    const seal = $('seal');
    seal.className = 'seal' + (s.match ? ' show ' + s.match : '');
    $('seal-k').textContent = s.match === 'ng' ? '違' : '合';
    $('seal-w').textContent = s.match === 'ng' ? '不一致' : '一致';
    seal.style.top = (actual.offsetTop + (actual.offsetHeight - 64) / 2) + 'px';
    $('photo').hidden = !!s.actual;

    $('branch').hidden = !s.shelf;
    document.querySelectorAll('.progress i').forEach((i, n) => i.classList.toggle('on', n < ['slip', 'actual', 'shelf', 'confirm'].indexOf(st) || st === 'confirm'));

    // dock
    const p = $('primary');
    const ngRetry = s.match === 'ng';
    const cfg = {
      slip: { c: 'var(--slip)', h: `${ICON.scan}移動票を読む` },
      actual: { c: ngRetry ? 'var(--ng)' : 'var(--actual)', h: `${ICON.scan}${ngRetry ? '現品票を読み直す' : '現品票を読む'}` },
      shelf: { c: 'var(--shelf)', h: `${ICON.qr}棚を読む` },
      confirm: { c: 'var(--ok)', h: `${ICON.check}<span class="to">${s.shelf}</span>に置く` },
    }[st];
    p.style.setProperty('--pc', cfg.c);
    p.innerHTML = cfg.h;
    $('alt').hidden = st !== 'shelf';
  }

  function setVal(k, text, empty, sub) {
    const v = $('v-' + k);
    v.textContent = text; v.classList.toggle('empty', empty);
    $('s-' + k).innerHTML = sub;

  function rPallet() {

    $('p-mach').innerHTML = PM.map((m) => `<button class="chip" data-m="${m}" aria-pressed="${m === pm}">${m}</button>`).join('');
    $('p-grid').innerHTML = Object.entries(PB[pm]).map(([n, it]) => `<button class="pal" data-n="${n}" aria-pressed="${+n === pn}" aria-label="パレット${n} ${it.length}件"><b>${n}</b><span class="dots">${it.slice(0, 3).map(() => '<i></i>').join('')}${it.length > 3 ? `<i class="more">+${it.length - 3}</i>` : ''}</span></button>`).join('');
    $('p-no').textContent = `No.${pn}`;
    $('p-label').textContent = items.length ? `${items.length}件` : '空';
    $('p-clear').hidden = !items.length;
    $('p-clear').classList.toggle('arm', parm);
    $('p-clear').textContent = parm ? 'もう一度で全部外す' : '全部外す';
    $('p-list').innerHTML = items.length ? items.map((x) => `<button class="item" data-id="${x.id}" aria-pressed="${psel === x.id}">
      <span class="nm">${x.name}</span><span class="qty"><small>×</small>${x.qty}</span>
      <span class="meta">${x.seiban} · ${x.code} · 着手 ${x.start}</span></button>`).join('')
      : `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 15h18M5 15v4M12 15v4M19 15v4"/></svg>まだ何も載っていません</div>`;
    $('p-dock').innerHTML = psel != null
      ? `<button class="ghost" id="p-swap">${ICON.scan}入れ替え</button><button class="ghost danger" id="p-del">外す</button><button class="alt" id="p-unsel" aria-label="選択をやめる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>やめる</button>`
      : `<button class="primary" id="p-add" style="--pc:var(--teal)">${ICON.scan}読んで<span class="to">No.${pn}</span>に載せる</button>`;
  }
  $('p-mach').onclick = (e) => { const b = e.target.closest('[data-m]'); if (!b) return; pm = b.dataset.m; psel = null; parm = false; rPallet(); };
  $('p-grid').onclick = (e) => { const b = e.target.closest('[data-n]'); if (!b) return; pn = +b.dataset.n; psel = null; parm = false; rPallet(); };
  $('p-list').onclick = (e) => { const b = e.target.closest('[data-id]'); if (!b) return; psel = psel === +b.dataset.id ? null : +b.dataset.id; parm = false; rPallet(); };
  $('p-clear').onclick = () => { if (!parm) { parm = true; rPallet(); setTimeout(() => { parm = false; if (!$('v-pallet').hidden) rPallet(); }, 2500); return; } PB[pm][pn] = []; parm = false; psel = null; toast(`No.${pn} を空にしました`); rPallet(); };
  $('p-dock').onclick = (e) => {
    if (e.target.closest('#p-add')) fakeScan('製造order', 'var(--teal)', ICON.scan, () => { const x = mk(ppool++); PB[pm][pn].push(x); toast(`${x.name} を No.${pn} に載せました`); rPallet(); });
    if (e.target.closest('#p-swap')) fakeScan('入れ替える製造order', 'var(--teal)', ICON.scan, () => { const a = PB[pm][pn]; const i = a.findIndex((x) => x.id === psel); const x = mk(ppool++); a[i] = x; psel = null; toast(`${x.name} に入れ替えました`); rPallet(); });
    if (e.target.closest('#p-del')) { PB[pm][pn] = PB[pm][pn].filter((x) => x.id !== psel); psel = null; toast('外しました'); rPallet(); }
    if (e.target.closest('#p-unsel')) { psel = null; rPallet(); }
  };

  // ---------- 購買照会 ----------
  const POS = [
    { no: '4501238876', rows: [
      { mc: 'DAD3350', seiban: 'BA1S2201', start: '10/18', name: 'ブラケット取付板', code: 'MD00413390', qty: 2 },
      { mc: 'DAD3350', seiban: 'BA1S2202', start: '10/25', name: 'ブラケット取付板', code: 'MD00413390', qty: 2 },
    ] },
    { no: '4501240113', rows: [{ mc: 'MH-X', seiban: 'BE1', start: '—', name: 'ナット', code: 'FH-01', qty: 3, db: 'ナット M12' }] },
  ];
  let poI = -1;
  function rPo() {
    const po = POS[poI];
    $('po-digits').innerHTML = po ? po.no : '<span class="g">0000000000</span>';
    $('po-st').textContent = po ? `${po.rows.length}件` : '';
    $('po-list').innerHTML = po ? po.rows.map((r) => `<div class="porow"><span class="mc">${r.mc}</span><span class="qty">${r.qty}<small>個</small></span>
      <dl><dt>製番</dt><dd>${r.seiban}</dd><dt>着手</dt><dd>${r.start}</dd><dt>品名</dt><dd class="jp">${r.name}</dd><dt>品番</dt><dd>${r.code}</dd></dl>
      ${r.db ? `<span class="diff">部品マスタでは「${r.db}」</span>` : ''}</div>`).join('')
      : `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M10 9v6M13 9v6M17 9v6"/></svg>現品票のバーコードを読む</div>`;
    $('po-scan').innerHTML = `${ICON.scan}${po ? '次の注文番号を読む' : '注文番号を読む'}`;
  }
  $('po-scan').onclick = () => fakeScan('注文番号', 'var(--lime)', ICON.scan, () => { poI = (poI + 1) % POS.length; rPo(); });

  // ---------- Zero2W 配膳 ----------
  const ZROWS = [
    { code: '西-北-02', dev: 'zero2w-01', order: '0002178005', seiban: 'BA1S2201', name: 'ブラケット取付板', t: '2分前', ok: true, br: 2 },
    { code: '東-南-05', dev: 'zero2w-04', order: '0002178101', seiban: 'BA1S2310', name: '脚カバー', t: '6分前', ok: true },
    { code: '中央-北-03', dev: 'zero2w-02', order: '0002178033', seiban: 'BA1S2201', name: 'アジャスタボルト', t: '11分前', ok: false },
    { code: '西-中央-07', dev: 'zero2w-03', order: '0002179012', seiban: 'BE1', name: 'ナット M12', t: '18分前', ok: true },
    { code: '東-北-04', dev: 'zero2w-05', order: '0002178120', seiban: 'BA1S2310', name: 'サドル', t: '25分前', ok: false },
    { code: '中央-南-01', dev: 'zero2w-06', order: '0002178040', seiban: 'BA1S2201', name: 'ベースプレート', t: '9:42', ok: true, br: 1 },
    { code: '中央-中央-06', dev: 'zero2w-02', order: '0002179020', seiban: 'BE1', name: 'ベアリングホルダ', t: '9:30', ok: true },
    { code: '東-中央-02', dev: 'zero2w-05', order: '0002178133', seiban: 'BA1S2310', name: 'モータ取付台', t: '9:12', ok: false },
    { code: '西-南-08', dev: 'zero2w-03', order: '0002179031', seiban: 'BE1', name: 'カラー φ20', t: '8:55', ok: true },
  ];
  let zf = 'all', zfresh = false;
  function rZero() {
    const nWait = ZROWS.filter((r) => !r.ok).length;
    $('z-filter').innerHTML = `<button class="chip" data-f="all" aria-pressed="${zf === 'all'}">すべて ${ZROWS.length}</button><button class="chip" data-f="wait" aria-pressed="${zf === 'wait'}" style="${nWait ? 'color:var(--shelf)' : ''}">未照合 ${nWait}</button><span class="count">新しい順</span>`;
    const rows = ZROWS.filter((r) => zf === 'all' || !r.ok);
    $('z-list').innerHTML = rows.map((r, i) => `<div class="zrow${zfresh && i === 0 ? ' fresh' : ''}"><span class="code">${r.code}<small>${r.dev}</small></span>
      <span class="nm">${r.name}</span><span class="t">${r.t}</span>
      <span class="meta">${r.order} · ${r.seiban}${r.br ? ` · 分配${r.br}` : ''}</span><span class="pill ${r.ok ? 'ok' : 'wait'}">${r.ok ? '日程一致' : '未照合'}</span></div>`).join('');
    zfresh = false;
  }
  $('z-filter').onclick = (e) => { const b = e.target.closest('[data-f]'); if (!b) return; zf = b.dataset.f; rZero(); };
  $('z-refresh').onclick = () => { ZROWS.unshift({ code: '西-北-03', dev: 'zero2w-01', order: '0002178006', seiban: 'BA1S2201', name: '脚（右）', t: 'たった今', ok: true }); ZROWS.pop(); zfresh = true; rZero(); };

  window.addEventListener('resize', () => { if (!$('v-main').hidden) render(); });
  reset();
})();
</script>
