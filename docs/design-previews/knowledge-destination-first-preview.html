<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge Destination First Preview</title>
  <!-- Static preview: pick the subject first, then one of its topics, then post. All content is fictional. -->
  <style>
    :root { --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --soft:#f8fafc; --accent:#1d4ed8; --accent-soft:#dbeafe; --ok:#15803d; --ok-soft:#dcfce7; --ai:#7c3aed; --ai-soft:#ede9fe; --warn:#b45309; --warn-soft:#fef3c7; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",sans-serif; color:var(--ink); background:#334155; }
    .bar { display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px; background:#0f172a; color:#fff; font-size:13px; align-items:center; }
    .bar button { border:1px solid #94a3b8; background:transparent; color:#fff; border-radius:6px; padding:5px 9px; font-size:13px; cursor:pointer; }
    .bar button[aria-pressed="true"] { background:#fff; color:#0f172a; }
    .kiosk { position:relative; height:calc(100dvh - 48px); min-height:640px; background:repeating-linear-gradient(0deg,#e2e8f0 0 38px,#f1f5f9 38px 76px); }
    .chat { position:absolute; right:16px; bottom:16px; width:min(380px,calc(100vw - 24px)); max-height:calc(100% - 32px); background:#fff; border-radius:12px; box-shadow:0 12px 32px rgba(15,23,42,.35); display:flex; flex-direction:column; overflow:hidden; }
    .chat-head { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--line); font-size:15px; }
    .modes { display:flex; gap:4px; padding:8px 12px; border-bottom:1px solid var(--line); }
    .modes span { border:1px solid #cbd5e1; border-radius:999px; padding:3px 10px; font-size:13px; }
    .modes span.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .body { overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .chip { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 10px; font-size:13px; background:var(--soft); border:1px solid var(--line); }
    .chip.who { background:var(--ok-soft); border-color:#86efac; color:var(--ok); }
    .chip.dest { background:var(--accent-soft); border-color:#93c5fd; color:var(--accent); font-weight:600; }
    .chip.ai { background:var(--ai-soft); border-color:#c4b5fd; color:var(--ai); cursor:pointer; }
    .chip button { border:0; background:transparent; color:inherit; font-size:14px; cursor:pointer; padding:0 2px; }
    button.btn { height:44px; border:1px solid #94a3b8; background:#fff; border-radius:8px; padding:0 14px; font-size:14px; cursor:pointer; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .pick { display:flex; flex-wrap:wrap; gap:6px; }
    .pick button { height:44px; padding:0 12px; border-radius:10px; border:1px solid #cbd5e1; background:#fff; font-size:14px; cursor:pointer; }
    .pick button small { color:var(--muted); font-size:11px; margin-left:4px; }
    .pick button.new { border-style:dashed; color:var(--accent); border-color:#93c5fd; }
    .pick button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .row { display:flex; gap:8px; align-items:center; }
    input[type=text] { height:44px; border:1px solid #cbd5e1; border-radius:8px; padding:0 8px; font:inherit; font-size:14px; }
    .hd { font-size:12px; color:var(--muted); }
    .composer { border-top:1px solid var(--line); padding:10px 12px; display:flex; gap:8px; align-items:flex-end; }
    .composer textarea { flex:1; min-height:56px; border:1px solid #cbd5e1; border-radius:8px; padding:8px; font:inherit; font-size:14px; resize:none; }
    .done { border:1px solid #86efac; background:var(--ok-soft); color:var(--ok); border-radius:10px; padding:8px 10px; font-size:14px; }
    .tag { font-size:11px; border-radius:4px; padding:1px 6px; background:var(--warn-soft); color:var(--warn); }
    [data-view] { display:none; }
  </style>
</head>
<body>
  <div class="bar">
    <span>場面:</span>
    <button data-go="subject">1 何について?</button>
    <button data-go="topics">2 その対象の案件</button>
    <button data-go="new">3 新しい案件</button>
    <button data-go="compose">4 入力</button>
    <button data-go="sent">5 送信後</button>
  </div>
  <div class="kiosk">
    <div class="chat">
      <div class="chat-head"><strong>Hermes</strong><span>⤢ ×</span></div>
      <div class="modes"><span>検索</span><span class="on">ナレッジ</span><span>JEV記録</span></div>

      <div class="body" data-view="subject">
        <div class="chips"><span class="chip who">👤 山田 太郎</span><span class="chip">📖 手順書</span><span class="chip ai" data-go="compose-ai">おまかせ</span></div>
        <div class="row"><input type="text" placeholder="🔍 品番・設備・事柄" style="width:210px" /><button class="btn">▮▯ 読取</button></div>
        <span class="hd">この画面・最近</span>
        <div class="pick">
          <button data-go="topics">SAMPLE-0001 ブラケットA<small>3</small></button>
          <button data-go="topics">マシニング3号機<small>5</small></button>
          <button data-go="topics">技能検定<small>2</small></button>
          <button data-go="topics">有給申請<small>1</small></button>
          <button class="new" data-go="new">＋ 新しい対象</button>
        </div>
      </div>

      <div class="body" data-view="topics">
        <div class="chips"><span class="chip who">👤 山田 太郎</span><span class="chip dest">SAMPLE-0001 ブラケットA <button data-go="subject">✕</button></span></div>
        <div class="pick">
          <button data-go="compose">段取り</button>
          <button data-go="compose">切削条件</button>
          <button data-go="compose">検査・測定<small>内径</small></button>
          <button class="new" data-go="new">＋ 新しい案件</button>
        </div>
      </div>

      <div class="body" data-view="new">
        <div class="chips"><span class="chip who">👤 山田 太郎</span><span class="chip dest">SAMPLE-0001 ブラケットA <button data-go="subject">✕</button></span></div>
        <span class="hd">種類</span>
        <div class="pick">
          <button>段取り</button><button>切削条件</button><button>加工手順</button><button>検査・測定</button><button>組立</button><button class="on">治具・工具</button>
          <button>保全・点検</button><button>安全</button><button>申し込み・手続き</button><button>教育・技能</button><button>その他</button>
        </div>
        <div class="row"><input type="text" placeholder="補足(任意)" style="width:180px" /><button class="btn primary" data-go="compose">決定</button><span class="tag">承認が要る</span></div>
      </div>

      <div class="body" data-view="compose compose-ai sent">
        <div class="chips">
          <span class="chip who">👤 山田 太郎</span>
          <span class="chip dest" data-view="compose sent">📂 SAMPLE-0001 ブラケットA｜段取り <button data-go="subject">✕</button></span>
          <span class="chip ai" data-view="compose-ai">おまかせ <button data-go="subject">✕</button></span>
        </div>
        <div class="done" data-view="sent">✅ 追加しました</div>
      </div>
      <div class="composer" data-view="compose compose-ai sent">
        <button class="btn">📎</button><textarea placeholder="メモ・写真・PDF"></textarea><button class="btn primary" data-go="sent">送信</button>
      </div>
    </div>
  </div>
  <script>
    function go(view) {
      document.querySelectorAll('[data-view]').forEach(el => {
        const on = el.dataset.view.split(' ').includes(view);
        el.style.display = on ? (el.classList.contains('chip') ? 'inline-flex' : el.classList.contains('done') ? 'block' : 'flex') : 'none';
      });
      document.querySelectorAll('.bar button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.go === view)));
    }
    document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if (t) { e.stopPropagation(); go(t.dataset.go); } });
    go('subject');
  </script>
</body>
</html>
