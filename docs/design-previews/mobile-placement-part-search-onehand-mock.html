<title>部品さがし 片手モック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone frame; list on top, every control in the bottom thumb zone (filter → field → keys → tabs). */
:root{
  --bg:#0d0f0e;--panel:#171a19;--panel2:#1f2321;--line:#2c312e;
  --ink:#f2f4f1;--ink2:#a3aaa5;--ink3:#6c736e;
  --shelf:#fbbf24;--slip:#38bdf8;--teal:#2dd4bf;--ng:#f87171;--actual:#c4b5fd;
  --page:#050606;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--sans);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  display:flex;flex-direction:column;align-items:center;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.demo{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink3)}
.demo button{height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 10px;font-size:12px;color:var(--ink2)}
.demo button[aria-pressed=true]{color:var(--ink);border-color:var(--ink2)}
.phone{width:100%;max-width:390px;height:min(820px,calc(100% - 50px));min-height:640px;background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;min-height:28px}
.off{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--shelf) 45%,var(--line));color:var(--shelf);font-size:12px;font-weight:800}
.count{margin-left:auto;font-size:13px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.list{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 8px;display:flex;flex-direction:column;gap:8px}
.empty{margin:auto;color:var(--ink3);font-weight:800;font-size:15px;text-align:center}
.hit{border:1px solid var(--line);background:var(--panel);border-radius:14px}
.hit.sel{border-color:var(--shelf);background:var(--panel2)}
.hit>button.main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center;width:100%;padding:10px 12px;text-align:left;background:none;border:0}
.shelf{grid-row:span 2;min-width:92px;font-family:var(--mono);font-size:20px;font-weight:800;color:var(--shelf)}
.name{font-size:16px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.tag{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink2)}
.tag svg{width:14px;height:14px}
.tag.on{border-color:var(--ink);color:var(--ink)}
.more{display:flex;flex-wrap:wrap;gap:4px 14px;border-top:1px dashed var(--line);margin:0 12px;padding:8px 0;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.more b{color:var(--ink)}
.del{display:flex;gap:8px;padding:0 12px 10px}
.mini{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:800;color:var(--ink2)}
.mini.ng{color:var(--ng)} .mini.ngfill{background:var(--ng);border-color:var(--ng);color:var(--bg)}
mark{background:color-mix(in srgb,var(--shelf) 30%,transparent);color:inherit;border-radius:3px}
.dock{border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:7px;padding:8px 10px 0}
.facets{display:flex;gap:6px;overflow-x:auto;min-height:36px;scrollbar-width:none}
.facet{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:14px;font-weight:800;color:var(--ink)}
.facet svg{width:15px;height:15px;color:var(--ink3)}
.facet small{color:var(--ink3);font-size:12px}
.bar{display:flex;align-items:center;gap:6px;min-height:52px;border:1.5px solid var(--shelf);border-radius:16px;background:var(--panel2);padding:4px 6px 4px 10px}
.bar .fi{width:22px;height:22px;color:var(--shelf);flex:none}
.bar .flow{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tok{flex:none;display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 6px 0 9px;border-radius:10px;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:14px;font-weight:900;border:0}
.tok svg{width:14px;height:14px}
.typed{flex:none;font-size:22px;font-weight:900;white-space:pre}
.caret{display:inline-block;width:2px;height:24px;background:var(--shelf);vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
.ph{color:var(--ink3);font-size:16px;font-weight:800}
.ib{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink2)}
.ib svg{width:20px;height:20px}
.fields{flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:2px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.fields button{height:34px;padding:0;border:0;border-radius:11px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px;font-weight:900;color:var(--ink3)}
.fields button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.kb{display:flex;flex-direction:column;gap:6px}
.kb[hidden]{display:none}
.kbtop{display:flex;gap:6px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{height:36px;padding:0 13px;border:0;background:var(--bg);font-size:14px;font-weight:900;color:var(--ink3)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.presets{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
.presets button{flex:none;height:36px;padding:0 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--shelf) 40%,var(--line));background:var(--bg);font-size:15px;font-weight:900;color:var(--shelf)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;height:146px;overflow-y:auto;align-content:start}
.keys button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:19px;font-weight:900}
.keys button:disabled{opacity:.18;cursor:default}
.keys button.bs{color:var(--ng);font-size:13px;border-color:color-mix(in srgb,var(--ng) 45%,var(--line))}
.nav{display:flex;align-items:center;gap:6px;padding:8px 84px 18px 14px;position:relative}
.tabs{flex:1;display:flex;gap:2px;height:58px;border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:3px}
.tabs span{flex:1;display:grid;place-items:center;border-radius:12px;font-size:17px;font-weight:900;color:var(--ink2)}
.tabs span.on{background:var(--ink);color:var(--bg)}
.menu{width:44px;height:58px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink2);font-weight:900}
.hermes{position:absolute;right:22px;bottom:18px;width:58px;height:58px;border-radius:50%;border:1px dashed var(--line)}
.toast{position:absolute;left:14px;right:14px;bottom:96px;background:var(--ink);color:var(--bg);border-radius:14px;padding:13px 16px;font-weight:900;font-size:15px;z-index:5}
</style>

<div class="demo">
  <span>模擬:</span>
  <button id="wifi" type="button" aria-pressed="false">Wi-Fi 切</button>
  <button id="reset" type="button">はじめから</button>
</div>

<div class="phone" id="phone">
  <div class="top">
    <span class="off" id="off">圏外 10/28</span>
    <span class="count" id="count"></span>
  </div>
  <section class="list" id="list" aria-label="検索結果" aria-live="polite"></section>
  <div class="dock">
    <div class="facets" id="facets" aria-label="絞り込み候補"></div>
    <div class="bar" id="bar">
      <span class="fi" id="fieldIcon"></span>
      <div class="flow" id="flow"></div>
      <button class="ib" id="clear" type="button" aria-label="全部消す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="ib" id="kbToggle" type="button" aria-label="キーを出す"></button>
    </div>
    <div class="kbtop">
      <div class="seg" id="seg" role="group" aria-label="文字種"></div>
      <div class="fields" id="fields" role="group" aria-label="さがす項目"></div>
    </div>
    <div class="kb" id="kb">
      <div class="keys" id="keys" aria-label="文字キー"></div>
    </div>
  </div>
  <div class="nav">
    <div class="tabs"><span>照合</span><span>配膳</span><span>購買</span><span class="on">部品</span></div>
    <div class="menu">⋮</div>
    <span class="hermes" aria-hidden="true"></span>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
const ICON = {
  all:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  seiban:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3 15h16"/></svg>',
  hinban:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6v12M7.5 6v12M11 6v12M14 6v12M17 6v12M20 6v12" stroke-width="1.8"/></svg>',
  machine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M7 7V4h10v3M7 18v2M17 18v2"/><circle cx="15.5" cy="12.5" r="2"/></svg>',
  name:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
  kbUp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h1M11 10h2M16 10h1M8 14h8"/></svg>',
  kbDown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M7 7l10 10M17 7L7 17"/></svg>'
};
const FIELDS = [
  {k:'all',label:'全部'},{k:'seiban',label:'製番'},{k:'hinban',label:'品番'},{k:'machine',label:'機種'},{k:'name',label:'品名'}
];
const LABEL = Object.fromEntries(FIELDS.map(f=>[f.k,f.label]));

/* 例のデータ(置き場に登録済みの品物) */
const M = ['DAD3350','DAD3240','DFD6362','DGP8761','DFL7341'];
const NAMES = ['ベアリングホルダ','スピンドルカバー','チャックテーブル','ボールネジ','リニアガイド','ブラケット','カップリング','テーブルベース','ノズルブロック','サドル','カバープレート','モータブラケット','フランジ','ストッパー','シャフト','ベルトカバー'];
const ROWS = [];
(function seed(){
  let r = 7;
  const rnd = n => (r = (r*9301+49297)%233280, Math.floor(r/233280*n));
  for (let i=0;i<46;i++){
    const m = M[rnd(M.length)];
    const seiban = 'BE' + (24+rnd(3)) + 'N' + String(1000+rnd(8999));
    const name = NAMES[rnd(NAMES.length)];
    const hinban = m.slice(3) + '-' + String(100+rnd(899)) + '-' + String(1+rnd(9)).padStart(2,'0');
    const shelf = 'ABCDE'[rnd(5)] + String(1+rnd(12)).padStart(2,'0') + '-' + (1+rnd(4));
    ROWS.push({id:i,machine:m,seiban,hinban,name,shelf,order:'0'+String(31000000+rnd(999999)),branch:rnd(3)});
  }
  ROWS[3].name='ベアリングホルダ'; ROWS[3].machine='DAD3350';
  ROWS[9].name='ストッパー'; ROWS[9].machine='DAD3350';
})();

/* 表記ゆれ: 全角半角・ひらがなカタカナ・濁点半濁点・小さいッャュョ・長音・ハイフン・空白をそろえる(テーブル = てふる) */
function norm(s){
  return (s||'').normalize('NFKC').normalize('NFD').replace(/[゙゚]/g,'').normalize('NFC').toUpperCase()
    .replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60))
    .replace(/[ッャュョァィゥェォ]/g,c=>({ッ:'ツ',ャ:'ヤ',ュ:'ユ',ョ:'ヨ',ァ:'ア',ィ:'イ',ゥ:'ウ',ェ:'エ',ォ:'オ'})[c])
    .replace(/[\s\-ー‐]/g,'');
}
const fieldsOf = (row,k) => k==='all' ? ['seiban','hinban','machine','name'] : [k];

const KANA = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.split('');
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-'.split('');

const S = {field:'all',typed:'',filters:[],sel:null,kb:true,mode:'kana',confirm:false,offline:false};

function matches(row, filters, field, typed){
  for (const f of filters) if (norm(row[f.k]) !== norm(f.v) && !norm(row[f.k]).includes(norm(f.v))) return false;
  const t = norm(typed);
  if (!t) return true;
  return fieldsOf(row,field).some(k => norm(row[k]).includes(t));
}
const hits = () => ROWS.filter(r => matches(r,S.filters,S.field,S.typed));

function hl(text,k){
  const t = norm(S.typed);
  if (!t || !fieldsOf(null,S.field).includes(k)) return esc(text);
  // 正規化後の位置を元の文字列に戻す(1文字ずつ正規化して対応づけ)
  const map=[]; let n='';
  [...text].forEach((c,i)=>{const nc=norm(c); for(const _ of nc){map.push(i)} n+=nc;});
  const at = n.indexOf(t); if (at<0) return esc(text);
  const a = map[at], b = map[at+t.length-1]+1, chars=[...text];
  return esc(chars.slice(0,a).join(''))+'<mark>'+esc(chars.slice(a,b).join(''))+'</mark>'+esc(chars.slice(b).join(''));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c])}

function addFilter(k,v){
  S.filters = S.filters.filter(f=>f.k!==k).concat({k,v});
  S.typed=''; S.sel=null; S.confirm=false;
  if (S.field===k) S.field = nextField();
  render();
}
function nextField(){
  const used = new Set(S.filters.map(f=>f.k));
  return ['machine','seiban','name','hinban'].find(k=>!used.has(k)) || 'all';
}
function setField(k){
  S.field=k; S.typed=''; S.kb=true;
  S.mode = (k==='name') ? 'kana' : (k==='all' ? S.mode : 'abc');
  render();
}

function render(){
  const list = hits();
  document.getElementById('off').hidden = !S.offline;
  document.getElementById('count').textContent = list.length + '件';

  /* 結果 */
  const L = document.getElementById('list');
  if (!list.length) L.innerHTML = '<p class="empty">見つかりません</p>';
  else L.innerHTML = list.slice(0,40).map(r=>{
    const sel = S.sel===r.id;
    const tag = k => {
      const on = S.filters.some(f=>f.k===k);
      return `<button type="button" class="tag${on?' on':''}" data-add="${k}" data-v="${esc(r[k])}" aria-label="${LABEL[k]} ${esc(r[k])} でしぼる">${ICON[k]}${hl(r[k],k)}</button>`;
    };
    return `<div class="hit${sel?' sel':''}">
      <button type="button" class="main" data-sel="${r.id}" aria-expanded="${sel}">
        <span class="shelf">${r.shelf}</span>
        <span class="name">${hl(r.name,'name')}</span>
      </button>
      <div class="tags">${tag('machine')}${tag('seiban')}${tag('hinban')}</div>
      ${sel?`<div class="more"><span>製造order <b>${r.order}</b></span><span>分配 <b>${r.branch===0?'なし':r.branch}</b></span></div>
      <div class="del"><button type="button" class="mini ${S.confirm?'ngfill':'ng'}" data-del="${r.id}">${S.confirm?'本当に消す':'この品物を消す'}</button>${S.confirm?'<button type="button" class="mini" data-cancel>やめる</button>':''}</div>`:''}
    </div>`;
  }).join('');

  /* しぼり候補: いまの項目の値を件数の多い順 */
  const F = document.getElementById('facets');
  const fk = S.field==='all' ? (S.typed ? null : (S.filters.some(f=>f.k==='machine') ? 'seiban' : 'machine')) : S.field;
  let chips = [];
  if (fk){
    const c = new Map(); list.forEach(r=>c.set(r[fk],(c.get(r[fk])||0)+1));
    chips = [...c].sort((a,b)=>b[1]-a[1]).slice(0,12).map(([v,n])=>({k:fk,v,n}));
  } else {
    const t = norm(S.typed); const c = new Map();
    list.forEach(r=>['machine','seiban','hinban','name'].forEach(k=>{ if(norm(r[k]).includes(t)){const key=k+'\u0000'+r[k]; c.set(key,(c.get(key)||0)+1);} }));
    chips = [...c].sort((a,b)=>b[1]-a[1]).slice(0,12).map(([key,n])=>{const [k,v]=key.split('\u0000'); return {k,v,n};});
  }
  if (S.filters.some(f=>f.k===fk)) chips=[];
  F.innerHTML = chips.length>1 || (chips.length===1 && S.typed) ? chips.map(c=>`<button type="button" class="facet" data-add="${c.k}" data-v="${esc(c.v)}">${ICON[c.k]}${esc(c.v)}<small>${c.n}</small></button>`).join('') : '';

  /* 入力欄: しぼった条件 + 打ち中の文字 */
  document.getElementById('fieldIcon').innerHTML = ICON[S.field];
  const flow = S.filters.map((f,i)=>`<button type="button" class="tok" data-rm="${i}" aria-label="${LABEL[f.k]} ${esc(f.v)} を外す">${ICON[f.k]}${esc(f.v)}${ICON.x}</button>`).join('')
    + (S.typed ? `<span class="typed">${esc(S.typed)}</span>` : (S.filters.length?'':`<span class="ph">${S.field==='all'?'製番・品番・機種・品名':LABEL[S.field]}</span>`))
    + (S.kb?'<span class="caret"></span>':'');
  document.getElementById('flow').innerHTML = flow;
  document.getElementById('flow').scrollLeft = 9999;
  document.getElementById('clear').hidden = !S.typed && !S.filters.length;
  const kt = document.getElementById('kbToggle');
  kt.innerHTML = S.kb ? ICON.kbDown : ICON.kbUp; kt.setAttribute('aria-label', S.kb?'キーをしまう':'キーを出す');

  /* 項目 */
  document.getElementById('fields').innerHTML = FIELDS.map(f=>`<button type="button" data-field="${f.k}" aria-pressed="${S.field===f.k}">${f.label}</button>`).join('');

  /* キー: 押すと0件になる文字は薄くして押せない(位置は動かさない) */
  document.getElementById('kb').hidden = !S.kb;
  document.getElementById('seg').innerHTML = ['kana','abc'].map(m=>`<button type="button" data-mode="${m}" aria-pressed="${S.mode===m}">${m==='kana'?'かな':'英数'}</button>`).join('');
  const keys = S.mode==='kana' ? KANA : ABC;
  document.getElementById('keys').innerHTML = keys.map(k=>{
    const ok = list.some(r=>matches(r,[],S.field,S.typed+k));
    return `<button type="button" data-key="${k}" ${ok?'':'disabled'}>${k}</button>`;
  }).join('') + '<button type="button" class="bs" data-bs aria-label="1文字消す">1字消す</button>';
}

const phone = document.getElementById('phone');
phone.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if (d.add){ addFilter(d.add,d.v); return; }
  if (d.rm!==undefined){ const f=S.filters.splice(+d.rm,1)[0]; S.field=f.k; S.typed=''; S.sel=null; render(); return; }
  if (d.sel!==undefined){ const id=+d.sel; S.sel = S.sel===id?null:id; S.confirm=false; if(S.sel!==null) S.kb=false; render(); return; }
  if (d.del!==undefined){
    if(!S.confirm){S.confirm=true;render();return;}
    const r = ROWS.find(x=>x.id===+d.del); ROWS.splice(ROWS.indexOf(r),1); S.sel=null; S.confirm=false; render();
    toast(`✓ ${r.shelf} の ${r.name} を消しました`); return;
  }
  if (d.cancel!==undefined){S.confirm=false;render();return;}
  if (d.field){ setField(d.field); return; }
  if (d.mode){ S.mode=d.mode; render(); return; }
  if (d.key){ S.typed+=d.key; S.sel=null; render(); return; }
  if (d.bs!==undefined){ if(S.typed) S.typed=S.typed.slice(0,-1); else if(S.filters.length){const f=S.filters.pop(); S.field=f.k;} render(); return; }
  if (b.id==='clear'){ S.typed=''; S.filters=[]; S.field='all'; S.sel=null; render(); return; }
  if (b.id==='kbToggle'){ S.kb=!S.kb; render(); return; }
});
document.getElementById('bar').addEventListener('click', e=>{ if(!e.target.closest('button') && !S.kb){S.kb=true;render();} });
let lastTop=0;
document.getElementById('list').addEventListener('scroll', e=>{
  const t=e.target.scrollTop; if (S.kb && t>lastTop+24){S.kb=false;render();} lastTop=t;
});
let tt; function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1800);}
document.getElementById('wifi').addEventListener('click', e=>{ S.offline=!S.offline; e.target.setAttribute('aria-pressed',S.offline); e.target.textContent = S.offline?'Wi-Fi 入':'Wi-Fi 切'; render(); });
document.getElementById('reset').addEventListener('click', ()=>{ Object.assign(S,{field:'all',typed:'',filters:[],sel:null,kb:true,mode:'kana',confirm:false}); render(); });
render();
</script>
