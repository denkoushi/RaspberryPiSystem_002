<title>要領書 部品の付け直しモック</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* 配置: 上にモックの案内帯、下に 1920×1080 のキオスク画面を幅に合わせて縮小表示。色と寸法は現行の「作る・直す」画面に合わせる */
:root{
  color-scheme:dark;
  --bg:#0f1317; --panel:#161c22; --raised:#1f2730; --line:#27313b; --line2:#344252;
  --fg:#eef3f6; --mute:#9fadb9; --green:#3ba776; --amber:#f6b93b; --red:#e5484d; --blue:#7cc4ff;
  --sans:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
}
html,body{background:#090c0f;color:var(--fg);font-family:var(--sans)}
body{padding-inline:16px;padding-block:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.guide{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--mute)}
.guide b{color:var(--fg);font-weight:700}
.guide button{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-weight:700}
.guide .new{color:var(--amber)}
.fit{width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--bg);position:relative}
.stage{width:1920px;height:1080px;transform-origin:0 0;position:absolute;left:0;top:0;display:grid;grid-template-rows:64px minmax(0,1fr);background:var(--bg)}

.hd{display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.hd h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.1em}
.mode{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:#f6b93b29;color:var(--amber);font-size:19px;font-weight:700}
.hd .r{margin-left:auto;display:flex;gap:16px}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--raised);font-size:19px;font-weight:700}
.btn.sel{border-color:var(--blue);background:#7cc4ff24;color:var(--blue)}
.btn.go{border-color:var(--green);background:var(--green);color:#0b1a12}
.btn:disabled{opacity:.4;cursor:default}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;flex:none}

.body{display:grid;grid-template-columns:460px minmax(0,1fr);min-height:0}
.left{border-right:1px solid var(--line);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.left .row{display:flex;gap:8px;flex-wrap:wrap}
.cap{font-size:15px;color:var(--mute);letter-spacing:.08em}
.plist{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.pbtn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;text-align:left;min-height:60px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--raised)}
.pbtn.sel{border-color:var(--blue);background:#7cc4ff24}
.pbtn .n{font-size:20px;font-weight:700}
.pbtn .k{font-family:var(--mono);font-size:15px;color:var(--mute);grid-column:1}
.pbtn .c{grid-row:1/3;grid-column:2;font-family:var(--mono);font-size:17px;color:var(--mute)}
.pbtn .n.none{color:var(--amber);font-size:16px}

.main{padding:12px 16px;min-width:0;overflow:auto}
.bar{display:flex;align-items:center;gap:12px;min-height:52px;margin-bottom:6px}
.crumb{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700}
.crumb span{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:8px}
.crumb span.all{border-style:dashed;color:var(--mute)}
.crumb button{width:36px;height:44px;border:0;background:none;color:var(--mute);font-size:22px}
.count{font-family:var(--mono);font-size:18px;color:var(--mute)}
.tr{display:grid;align-items:center;gap:12px;height:56px;padding:0 10px;border-bottom:1px solid var(--line)}
.tr:hover{background:#1b222a}
.thumb{width:36px;height:46px;border-radius:3px;background:#dfe5ea;position:relative}
.thumb::after{content:"";position:absolute;inset:7px 6px auto;height:2px;background:#8b98a4;box-shadow:0 6px #8b98a4,0 12px #b6c0c9,0 18px #b6c0c9}
.nm{font-family:var(--mono);font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{font-family:var(--mono);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:999px;border:1px solid;font-size:16px;font-weight:700;white-space:nowrap}
.badge.pub{border-color:var(--green);color:var(--green)} .badge.dr{border-color:var(--amber);color:var(--amber)}
.use{font-size:15px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{font-family:var(--mono);font-size:16px;color:var(--mute);text-align:right}
.ops{display:flex;gap:4px}
.ic{position:relative;width:44px;height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid transparent;background:none;color:var(--mute)}
.ic.v{border-color:var(--line2);color:var(--fg)} .ic.f{border-color:var(--green);color:var(--green)}
.ic.p{border-color:var(--amber);color:var(--amber)}
.ic.p::after{content:"新";position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#201400;font-size:13px;font-weight:700;display:grid;place-items:center}
.ic[data-tip]:hover::before{content:attr(data-tip);position:absolute;bottom:54px;left:50%;transform:translateX(-50%);padding:6px 10px;border-radius:6px;background:#eef3f6;color:#0f1317;font-size:16px;font-weight:700;white-space:nowrap;z-index:3}
.dash{margin-top:10px;border-style:dashed;color:var(--mute);font-size:18px}
.empty{padding:16px;font-size:18px;color:var(--mute)}

.veil{position:absolute;inset:0;background:#05080bcc;display:grid;place-items:center;z-index:10}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px #000a}
.dlg h2{margin:0;font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.doc{display:flex;align-items:center;gap:12px}
.swap{display:flex;align-items:center;gap:14px;font-size:20px}
.chip{display:inline-flex;flex-direction:column;justify-content:center;min-height:60px;padding:6px 16px;border-radius:8px;border:1px solid var(--line2);min-width:230px}
.chip small{font-size:14px;color:var(--mute);letter-spacing:.08em}
.chip b{font-size:21px} .chip i{font-style:normal;font-family:var(--mono);font-size:15px;color:var(--mute)}
.chip.to{border-color:var(--green)} .chip.to.wait{border-style:dashed;border-color:var(--line2)} .chip.to.wait b{color:var(--mute);font-weight:500}
.pick{display:grid;grid-template-columns:auto 500px;gap:22px}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:8px}
.keys button{height:64px;border-radius:8px;border:1px solid var(--line2);background:var(--raised);font-family:var(--mono);font-size:26px;font-weight:700}
.digits{grid-column:1/-1;height:52px;border-radius:8px;border:1px solid var(--line2);background:#0b0f13;display:flex;align-items:center;padding:0 14px;font-family:var(--mono);font-size:26px;letter-spacing:.12em}
.digits:empty::before{content:"品番の数字";font-family:var(--sans);font-size:17px;letter-spacing:0;color:#5f6d7a}
.keys .scan{grid-column:1/-1;display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;border-radius:8px;background:#7cc4ff1f;color:var(--blue);font:700 18px var(--sans);border:0;justify-content:flex-start;white-space:nowrap}
.scan svg{width:30px;height:30px}
.cands{display:flex;flex-direction:column;gap:6px;height:388px;overflow:auto;padding-right:4px}
.cands .pbtn.sel{border-color:var(--green);background:#3ba77626}
.foot{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.chk{display:flex;align-items:center;gap:10px;font-size:18px;min-height:48px;cursor:pointer}
.chk input{width:26px;height:26px;accent-color:var(--green)}
.newname{font-family:var(--mono);font-size:16px;color:var(--mute);max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .sp{margin-left:auto;display:flex;gap:10px}
.alist{display:flex;flex-direction:column;gap:6px;width:820px;max-height:420px;overflow:auto}
.arow{display:grid;grid-template-columns:36px 1fr 110px 190px 96px;align-items:center;gap:12px;min-height:60px;padding:4px 10px;border-radius:8px;border:1px solid var(--line)}
.arow .btn{min-height:44px;font-size:17px}
.toast{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);padding:14px 22px;border-radius:10px;background:var(--green);color:#0b1a12;font-size:20px;font-weight:700;z-index:20}
</style>

<div class="guide">
  <b>モック（品名・品番は例）</b>
  <span>追加するのは 2 か所：</span>
  <button id="g1" type="button"><span class="new">①</span> 行の「部品を付け直す」</button>
  <button id="g2" type="button"><span class="new">②</span> 割り当てに下書きも出す</button>
  <button id="g0" type="button">最初に戻す</button>
</div>
<div class="fit" id="fit"><div class="stage" id="stage">
  <header class="hd">
    <h1>要領書</h1>
    <span class="mode"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>作る・直す</span>
    <div class="r">
      <span class="btn"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>素材 12</span>
      <span class="btn"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>動画 3</span>
      <span class="btn">組立へ戻る</span>
    </div>
  </header>
  <div class="body">
    <aside class="left">
      <div class="cap">工程</div>
      <div class="row"><span class="btn">全て</span><span class="btn">組立</span><span class="btn">検査</span><span class="btn">切削</span><span class="btn sel">研削</span></div>
      <div class="cap">部品</div>
      <div class="plist" id="plist"></div>
    </aside>
    <section class="main">
      <div class="bar">
        <div class="crumb" id="crumb"></div>
        <span class="count" id="count"></span>
        <span class="btn go" style="margin-left:auto"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>作る</span>
      </div>
      <div id="rows"></div>
      <button class="btn dash" id="assign" type="button">＋ 既存の要領書を割り当てる</button>
    </section>
  </div>
  <div id="layer"></div>
</div></div>

<script>
const PARTS=[
  {k:'4A12-0318-01',n:'スピンドルシャフト'},{k:'4A12-0320-00',n:'スリーブ'},{k:'4A12-0452-00',n:'ベアリングハウジング'},
  {k:'3C07-1120-02',n:'フランジ'},{k:'3C07-1188-01',n:'カラー'},{k:'5B21-0077-01',n:'テーブルベース'},
  {k:'5B21-0193-00',n:'ガイドレール'},{k:'2D33-0841-03',n:'チャックプレート'}];
const seed=()=>[
  {id:1,t:'DFD1_加工_研削',s:'draft',pg:3,parts:['DFD1']},
  {id:2,t:'研削 段取りメモ',s:'draft',pg:2,parts:['DAD3']},
  {id:3,t:'スピンドルシャフト_4A12-0318-01_加工_研削',s:'pub',rev:2,pg:6,parts:['4A12-0318-01']},
  {id:4,t:'フランジ_3C07-1120-02_加工_研削',s:'draft',pg:2,parts:['3C07-1120-02']},
  {id:5,t:'研削 共通 安全確認',s:'pub',rev:1,pg:1,parts:['4A12-0318-01','3C07-1120-02']},
  {id:6,t:'砥石ドレス手順',s:'draft',pg:4,parts:[]},
  {id:7,t:'円筒研削 芯出し',s:'draft',pg:5,parts:[]}];
let docs=seed(), sel='', dlg=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pname=k=>(PARTS.find(p=>p.k===k)||{}).n||'';
const svg=d=>`<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const I={eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/>',bin:'<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/>',off:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  scan:'<path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M17 9v6"/>'};
const badge=d=>d.s==='pub'?`<span class="badge pub">公開 第${d.rev}版</span>`:'<span class="badge dr">下書き</span>';
const partBtn=(k,extra,cls)=>`<button type="button" class="pbtn ${cls||''}" data-k="${esc(k)}"><span class="n ${pname(k)?'':'none'}">${esc(pname(k)||'品名なし（部品に未対応）')}</span><span class="k">${esc(k)}</span>${extra||''}</button>`;

function render(){
  const used=[...new Set(docs.flatMap(d=>d.parts))];
  $('plist').innerHTML=used.map(k=>partBtn(k,`<span class="c">${docs.filter(d=>d.parts.includes(k)).length}</span>`,k===sel?'sel':'')).join('');
  $('crumb').innerHTML=(sel?`<span>${esc(sel)}<button type="button" id="clr" aria-label="部品の絞り込みを外す">×</button></span>`:'<span class="all">全部品</span>')+' › <span>研削<button type="button" disabled aria-hidden="true" style="visibility:hidden;width:8px"></button></span>';
  const pairs=docs.flatMap(d=>d.parts.filter(k=>!sel||k===sel).map(k=>({d,k})));
  $('count').textContent=pairs.length+' 件';
  const cols=`36px minmax(220px,1fr) ${sel?'':'190px '}150px 220px 50px 236px`;
  $('rows').innerHTML=pairs.map(({d,k})=>`<div class="tr" style="grid-template-columns:${cols}">
    <div class="thumb"></div><div class="nm">${esc(d.t)}</div>${sel?'':`<div class="pc">${esc(k)}</div>`}
    <div>${badge(d)}</div><div class="use">${esc(d.parts.filter(x=>x!==k).map(x=>x+' · 研削').join('、')||'—')}</div><div class="pg">${d.pg}</div>
    <div class="ops"><span class="ic v" data-tip="見る">${svg(I.eye)}</span><span class="ic f" data-tip="直す">${svg(I.pen)}</span>
    ${d.s==='draft'?`<button type="button" class="ic p" data-tip="部品を付け直す" aria-label="部品を付け直す" data-doc="${d.id}" data-from="${esc(k)}">${svg(I.tag)}</button>`:''}
    <span class="ic" data-tip="${d.s==='draft'&&d.parts.length===1?'削除':'外す'}">${svg(d.s==='draft'&&d.parts.length===1?I.bin:I.off)}</span></div></div>`).join('')
    ||'<p class="empty">該当する要領書がありません</p>';
  $('assign').hidden=!sel;
  renderLayer();
}
function newName(k){return (pname(k)?pname(k)+'_':'')+k+'_加工_研削';}
function renderLayer(){
  const L=$('layer');
  if(!dlg){L.innerHTML='';return;}
  if(dlg.type==='move'){
    const d=docs.find(x=>x.id===dlg.doc), q=dlg.digits;
    const list=PARTS.filter(p=>p.k!==dlg.from&&p.k.replace(/\D/g,'').includes(q));
    L.innerHTML=`<div class="veil"><div class="dlg" role="dialog" aria-label="部品を付け直す">
      <h2>${svg(I.tag)}部品を付け直す</h2>
      <div class="doc"><div class="thumb"></div><div class="nm">${esc(d.t)}</div>${badge(d)}</div>
      <div class="swap"><div class="chip"><small>いま</small><b>${esc(pname(dlg.from)||dlg.from)}</b>${pname(dlg.from)?`<i>${esc(dlg.from)}</i>`:''}</div>→
        <div class="chip to ${dlg.pick?'':'wait'}"><small>つぎ</small><b>${esc(dlg.pick?pname(dlg.pick):'部品を選ぶ')}</b>${dlg.pick?`<i>${esc(dlg.pick)}</i>`:''}</div></div>
      <div class="pick"><div class="keys">
        <button type="button" class="scan" id="scan">${svg(I.scan)}移動票をスキャン</button>
        <div class="digits">${esc(q)}</div>
        ${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(x=>`<button type="button" data-key="${x}">${x}</button>`).join('')}</div>
        <div class="cands">${list.map(p=>partBtn(p.k,docs.some(x=>x.parts.includes(p.k))?`<span class="c">${docs.filter(x=>x.parts.includes(p.k)).length}</span>`:'',p.k===dlg.pick?'sel':'')).join('')||'<p class="empty">該当する部品がありません</p>'}</div></div>
      <div class="foot"><label class="chk" for="rn"><input type="checkbox" id="rn" ${dlg.rename?'checked':''}>名前も変える</label>
        <span class="newname">${dlg.pick&&dlg.rename?esc(newName(dlg.pick)):''}</span>
        <div class="sp"><button type="button" class="btn" id="cancel">やめる</button><button type="button" class="btn go" id="ok" ${dlg.pick?'':'disabled'}>付け直す</button></div></div>
    </div></div>`;
  }else{
    const list=docs.filter(d=>!d.parts.includes(sel));
    L.innerHTML=`<div class="veil"><div class="dlg" role="dialog" aria-label="既存の要領書を割り当てる">
      <h2>${esc(pname(sel)||sel)} › 研削 に割り当てる</h2>
      <div class="alist">${list.map(d=>`<div class="arow"><div class="thumb"></div><div class="nm">${esc(d.t)}</div><div>${badge(d)}</div>
        <div class="use">${esc(d.parts.join('、')||'未使用')}</div><button type="button" class="btn" data-add="${d.id}">追加</button></div>`).join('')}</div>
      <div class="foot"><span class="use">下書きも候補に出す（いまは公開済みだけ）</span><div class="sp"><button type="button" class="btn" id="cancel">閉じる</button></div></div>
    </div></div>`;
  }
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('stage').appendChild(t);setTimeout(()=>t.remove(),2200);}
$('stage').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='clr'){sel='';return render();}
  if(b.id==='assign'){dlg={type:'assign'};return render();}
  if(b.id==='cancel'){dlg=null;return render();}
  if(b.dataset.doc){dlg={type:'move',doc:+b.dataset.doc,from:b.dataset.from,digits:'',pick:'',rename:true};return render();}
  if(b.dataset.add){const d=docs.find(x=>x.id===+b.dataset.add);d.parts.push(sel);toast('割り当てました');return render();}
  if(dlg&&dlg.type==='move'){
    if(b.dataset.key!==undefined){const k=b.dataset.key;dlg.digits=k==='C'?'':k==='⌫'?dlg.digits.slice(0,-1):(dlg.digits+k).slice(0,10);return renderLayer();}
    if(b.id==='scan'){dlg.pick='4A12-0452-00';dlg.digits='';return renderLayer();}
    if(b.dataset.k&&b.closest('.cands')){dlg.pick=b.dataset.k;return renderLayer();}
    if(b.id==='ok'){const d=docs.find(x=>x.id===dlg.doc);d.parts=d.parts.map(k=>k===dlg.from?dlg.pick:k);if(dlg.rename)d.t=newName(dlg.pick);sel=dlg.pick;dlg=null;toast('付け直しました');return render();}
    return;
  }
  if(b.dataset.k){sel=sel===b.dataset.k?'':b.dataset.k;return render();}
});
$('stage').addEventListener('change',e=>{if(e.target.id==='rn'&&dlg){dlg.rename=e.target.checked;renderLayer();}});
$('g0').onclick=()=>{docs=seed();sel='';dlg=null;render();};
$('g1').onclick=()=>{docs=seed();sel='';dlg={type:'move',doc:1,from:'DFD1',digits:'',pick:'',rename:true};render();};
$('g2').onclick=()=>{docs=seed();sel='4A12-0452-00';docs[4].parts.push(sel);dlg={type:'assign'};render();};
function fit(){const w=$('fit').clientWidth;$('stage').style.transform='scale('+(w/1920)+')';}
addEventListener('resize',fit);fit();render();
