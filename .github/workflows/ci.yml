name: CI

permissions:
  contents: read

concurrency:
  # Supersede stale PR heads, but let every main/merge-queue/full-suite run finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-v2
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    # 02:30 JST is 17:30 UTC on the previous calendar day.
    - cron: '30 17 * * *'

jobs:
  change-classification:
    name: change-classification
    runs-on: ubuntu-latest
    outputs:
      repo_policy: ${{ steps.classify.outputs.repo_policy }}
      workspace_quality: ${{ steps.classify.outputs.workspace_quality }}
      api: ${{ steps.classify.outputs.api }}
      web: ${{ steps.classify.outputs.web }}
      db_infra: ${{ steps.classify.outputs.db_infra }}
      deploy_contract: ${{ steps.classify.outputs.deploy_contract }}
      client: ${{ steps.classify.outputs.client }}
      e2e: ${{ steps.classify.outputs.e2e }}
      kiosk_sop: ${{ steps.classify.outputs.kiosk_sop }}
      docker_security: ${{ steps.classify.outputs.docker_security }}
      signage_artifact: ${{ steps.classify.outputs.signage_artifact }}
      codeql: ${{ steps.classify.outputs.codeql }}
      docker_api: ${{ steps.classify.outputs.docker_api }}
      docker_web: ${{ steps.classify.outputs.docker_web }}
      release_pair: ${{ steps.classify.outputs.release_pair }}
      runtime_rehearsal: ${{ steps.classify.outputs.runtime_rehearsal }}
      docker_matrix: ${{ steps.classify.outputs.docker_matrix }}
      full_suite: ${{ steps.classify.outputs.full_suite }}
    steps:
      - name: Checkout code with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/classify_event_changes.py \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --format none \
            --github-output-file "$GITHUB_OUTPUT" \
            --markdown-file "$GITHUB_STEP_SUMMARY"

  repo-policy:
    name: repo-policy
    needs: change-classification
    if: ${{ needs.change-classification.outputs.repo_policy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Test classifier and workflow contracts
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py'

      - name: Validate dependency exception metadata
        run: python3 scripts/ci/validate_dependency_exceptions.py

      - name: Validate production secret structure
        run: python3 scripts/ci/validate_production_secret_structure.py

  # Fast feedback shared by API, Web, and shared-package changes.
  workspace-quality:
    name: workspace-quality
    needs: change-classification
    if: ${{ needs.change-classification.outputs.workspace_quality == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-monorepo

      - name: Run lint
        run: pnpm lint --max-warnings=0

      - name: Build shared packages
        run: |
          pnpm --filter @raspi-system/shared-types build
          pnpm --filter @raspi-system/kiosk-sop-core build
          pnpm --filter @raspi-system/part-search-core build
          pnpm --filter @raspi-system/shelf-layout-core build

      - name: Run part-search-core tests
        run: pnpm --filter @raspi-system/part-search-core test

      - name: Run shelf-layout-core tests
        run: pnpm --filter @raspi-system/shelf-layout-core test

      # pnpm 9 uses npm's retired audit endpoint. Keep the workspace toolchain
      # unchanged and isolate the bulk-advisory client after all Node 20 work.
      - name: Setup Node.js for bulk advisory audit
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Security scan (pnpm bulk audit)
        env:
          AUDIT_PNPM_VERSION: '11.4.0'
        run: node scripts/ci/run-pnpm-bulk-audit.mjs

  api:
    name: api (${{ matrix.shard }})
    needs: change-classification
    if: ${{ needs.change-classification.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"shard":"all","shard_id":"all","coverage":true,"build":true}]' || '[{"shard":"1/3","shard_id":"1-of-3","coverage":true,"build":true},{"shard":"2/3","shard_id":"2-of-3","coverage":true,"build":false},{"shard":"3/3","shard_id":"3-of-3","coverage":true,"build":false}]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-monorepo

      - name: Build shared packages
        run: |
          pnpm --filter @raspi-system/shared-types build
          pnpm --filter @raspi-system/kiosk-sop-core build
          pnpm --filter @raspi-system/part-search-core build
          pnpm --filter @raspi-system/shelf-layout-core build

      - name: Generate Prisma Client
        run: pnpm --filter @raspi-system/api exec prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return

      - name: Build API
        if: matrix.build
        run: pnpm --filter @raspi-system/api build

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres-test \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=borrow_return \
            -p 5432:5432 \
            --health-cmd="pg_isready -U postgres" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=5 \
            pgvector/pgvector:pg15

      - name: Wait for PostgreSQL
        run: |
          chmod +x scripts/ci/wait-for-postgres.sh
          scripts/ci/wait-for-postgres.sh postgres-test 60
          docker exec postgres-test psql -U postgres -d borrow_return -c "SELECT version();"

      - name: Run Prisma migrations
        run: pnpm --filter @raspi-system/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return

      - name: Run API tests (without coverage)
        if: ${{ !matrix.coverage }}
        run: |
          cd apps/api
          docker exec postgres-test psql -U postgres -d borrow_return -c "SELECT 1;"
          BACKUP_CONFIG_PATH=/tmp/test-backup.json PROJECT_ROOT=$(pwd) \
            pnpm test -- --fileParallelism=true --maxWorkers=1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return
          JWT_ACCESS_SECRET: test-access-secret-1234567890
          JWT_REFRESH_SECRET: test-refresh-secret-1234567890
          CAMERA_TYPE: mock
          FILE_STORAGE_ROOT: /tmp/test-file-storage
          PDF_STORAGE_DIR: /tmp/test-file-storage
          PHOTO_STORAGE_DIR: /tmp/test-file-storage
          BACKUP_STORAGE_DIR: /tmp/test-backups
          NODE_ENV: test
          PERF_RESPONSE_TIME_THRESHOLD_MS: '1800'

      - name: Run API tests (coverage shard)
        if: matrix.coverage
        run: |
          cd apps/api
          docker exec postgres-test psql -U postgres -d borrow_return -c "SELECT 1;"
          shard_args=()
          if [ "${{ matrix.shard }}" != "all" ]; then
            shard_args+=("--shard=${{ matrix.shard }}")
          fi
          BACKUP_CONFIG_PATH=/tmp/test-backup.json PROJECT_ROOT=$(pwd) \
            pnpm test:coverage "${shard_args[@]}" --fileParallelism=true --maxWorkers=1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return
          JWT_ACCESS_SECRET: test-access-secret-1234567890
          JWT_REFRESH_SECRET: test-refresh-secret-1234567890
          CAMERA_TYPE: mock
          FILE_STORAGE_ROOT: /tmp/test-file-storage
          PDF_STORAGE_DIR: /tmp/test-file-storage
          PHOTO_STORAGE_DIR: /tmp/test-file-storage
          BACKUP_STORAGE_DIR: /tmp/test-backups
          NODE_ENV: test
          PERF_RESPONSE_TIME_THRESHOLD_MS: '1800'
          COVERAGE_ENFORCE_THRESHOLDS: ${{ matrix.shard == 'all' && 'true' || 'false' }}

      - name: Upload API coverage artifact
        if: ${{ always() && matrix.coverage }}
        uses: actions/upload-artifact@v6
        with:
          name: api-coverage-${{ matrix.shard_id }}
          path: apps/api/coverage/
          retention-days: 7

      - name: Cleanup PostgreSQL
        if: always()
        run: docker stop postgres-test && docker rm postgres-test || true

  web:
    name: web
    needs: change-classification
    if: ${{ needs.change-classification.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-monorepo

      - name: Build shared packages
        run: |
          pnpm --filter @raspi-system/shared-types build
          pnpm --filter @raspi-system/kiosk-sop-core build
          pnpm --filter @raspi-system/part-search-core build
          pnpm --filter @raspi-system/shelf-layout-core build

      - name: Run Web tests with coverage floor
        run: pnpm --filter @raspi-system/web test:coverage

      - name: Build Web
        run: pnpm --filter @raspi-system/web build

  db-infra:
    name: db-infra
    needs: change-classification
    if: ${{ needs.change-classification.outputs.db_infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-monorepo

      - name: Build shared packages
        run: |
          pnpm --filter @raspi-system/shared-types build
          pnpm --filter @raspi-system/kiosk-sop-core build
          pnpm --filter @raspi-system/part-search-core build
          pnpm --filter @raspi-system/shelf-layout-core build

      - name: Generate Prisma Client
        run: pnpm --filter @raspi-system/api exec prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres-test \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=borrow_return \
            -p 5432:5432 \
            --health-cmd="pg_isready -U postgres" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=5 \
            pgvector/pgvector:pg15

      - name: Wait for PostgreSQL
        run: |
          chmod +x scripts/ci/wait-for-postgres.sh
          scripts/ci/wait-for-postgres.sh postgres-test 60

      - name: Run and verify Prisma migrations
        run: |
          pnpm --filter @raspi-system/api exec prisma migrate deploy
          pnpm --filter @raspi-system/api exec prisma migrate status
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return

      - name: Generate isolated production-mode database credentials
        run: |
          CI_APP_DB_PASSWORD="$(openssl rand -hex 24)"
          CI_MIGRATION_DB_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$CI_APP_DB_PASSWORD"
          echo "::add-mask::$CI_MIGRATION_DB_PASSWORD"
          echo "CI_APP_DB_PASSWORD=$CI_APP_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "CI_MIGRATION_DB_PASSWORD=$CI_MIGRATION_DB_PASSWORD" >> "$GITHUB_ENV"

      - name: Prepare least-privilege roles for production-mode API
        run: |
          docker exec -i postgres-test psql -U postgres -d borrow_return \
            -v migration_password="$CI_MIGRATION_DB_PASSWORD" \
            -v app_password="$CI_APP_DB_PASSWORD" \
            -f - < scripts/deploy/postgres-role-bootstrap.sql

      - name: Build API
        run: pnpm --filter @raspi-system/api build

      - name: Start API server for monitoring tests
        run: |
          cd apps/api
          DATABASE_URL="postgresql://raspi_app:${CI_APP_DB_PASSWORD}@localhost:5432/borrow_return" \
            NODE_ENV=production pnpm start > /tmp/api-server.log 2>&1 &
          API_PID=$!
          echo "API_PID=$API_PID" >> "$GITHUB_ENV"
          timeout=30
          elapsed=0
          until curl -s http://localhost:8080/api/system/health > /dev/null 2>&1; do
            if [ "$elapsed" -ge "$timeout" ]; then
              cat /tmp/api-server.log || true
              exit 1
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
        env:
          JWT_ACCESS_SECRET: ci-prod-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          JWT_REFRESH_SECRET: ci-prod-refresh-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          PORT: 8080
          HOST: 0.0.0.0

      - name: Test backup and restore scripts
        run: bash scripts/test/backup-restore.test.sh

      - name: Test monitoring scripts
        run: |
          API_URL=http://localhost:8080/api pnpm test:monitor || {
            cat /tmp/api-server.log || true
            exit 1
          }

      - name: Cleanup DB/infra services
        if: always()
        run: |
          if [ -n "${API_PID:-}" ]; then
            kill "$API_PID" || true
          fi
          docker stop postgres-test || true
          docker rm postgres-test || true

  deploy-contract:
    name: deploy-contract
    needs: change-classification
    if: ${{ needs.change-classification.outputs.deploy_contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with migration base
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-monorepo

      - name: Validate immutable candidate migrations before release tooling
        run: |
          git fetch --no-tags --depth=1 origin main
          bash scripts/deploy/validate-candidate-migrations.sh origin/main "$GITHUB_SHA"

      - name: Install Ansible
        run: |
          set -euo pipefail
          python3 -m pip install --user ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v ansible-playbook

      - name: Cache Ansible collections
        uses: actions/cache@v5
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-community-general-v1

      - name: Validate deploy contracts
        env:
          PRODUCTION_PATH_AUDIT_OUTPUT: ${{ runner.temp }}/production-path-audit-report.json
        run: bash scripts/ci/run-deploy-contracts-local.sh --install-collections

      - name: Upload production-path audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-path-audit-${{ github.sha }}
          path: ${{ runner.temp }}/production-path-audit-report.json
          if-no-files-found: error
          retention-days: 14

  container-runtime-rehearsal:
    name: container-runtime-rehearsal
    needs: change-classification
    if: >-
      ${{
        needs.change-classification.outputs.runtime_rehearsal == 'true' &&
        !(github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native production API and Web images
        env:
          API_IMAGE: raspi-runtime-audit-api:${{ github.sha }}
          WEB_IMAGE: raspi-runtime-audit-web:${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            --build-arg "BUILD_COMMIT=$GITHUB_SHA" \
            --build-arg BUILD_CONFIG_HASH=production-path-audit \
            --tag "$API_IMAGE" \
            --file infrastructure/docker/Dockerfile.api .
          docker buildx build --load --platform linux/amd64 \
            --build-arg "BUILD_COMMIT=$GITHUB_SHA" \
            --build-arg BUILD_CONFIG_HASH=production-path-audit \
            --build-arg "VITE_RELEASE_SHA=$GITHUB_SHA" \
            --tag "$WEB_IMAGE" \
            --file infrastructure/docker/Dockerfile.web .

      - name: Run isolated native runtime rehearsal
        env:
          API_IMAGE: raspi-runtime-audit-api:${{ github.sha }}
          WEB_IMAGE: raspi-runtime-audit-web:${{ github.sha }}
        run: >-
          bash scripts/ci/rehearse-release-runtime.sh
          --api-image "$API_IMAGE"
          --web-image "$WEB_IMAGE"
          --sha "$GITHUB_SHA"
          --platform linux/amd64
          --skip-pull
          --stable-seconds 10

  client:
    name: client
    needs: change-classification
    if: ${{ needs.change-classification.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install client test runner
        run: |
          python3 -m pip install --user \
            pytest==8.4.2 \
            fastapi==0.111.0 \
            httpx==0.27.0 \
            python-dotenv==1.0.1 \
            uvicorn==0.29.0

      - name: Setup torque-agent test environment
        run: |
          python3 -m pip install --user poetry==1.8.5
          cd clients/torque-agent
          poetry install --with dev --no-interaction

      - name: Validate client scripts and tests
        env:
          PYTHONPATH: clients/haizen-agent:clients/nfc-agent
        run: |
          bash -n scripts/client/setup-kiosk.sh
          bash -n scripts/client/setup-nfc-agent.sh
          bash -n scripts/client/setup-signage-lite.sh
          bash -n scripts/client/setup-signage.sh
          python3 -m pytest clients/haizen-agent/tests clients/nfc-agent/tests
          python3 -m unittest discover -s clients/status-agent/tests -p 'test_*.py'

      - name: Validate torque-agent
        run: |
          cd clients/torque-agent
          poetry run pytest tests
          poetry run ruff check torque_agent tests

  pi4-agent-image-contract:
    name: pi4-agent-image-contract (${{ matrix.service }}, ${{ matrix.platform }})
    needs: change-classification
    if: ${{ needs.change-classification.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: nfc-agent
            image: raspisys-nfc-agent-contract
            dockerfile: infrastructure/docker/Dockerfile.nfc-agent
            platform: linux/arm64
            platform_tag: linux-arm64
          - service: nfc-agent
            image: raspisys-nfc-agent-contract
            dockerfile: infrastructure/docker/Dockerfile.nfc-agent
            platform: linux/arm/v7
            platform_tag: linux-arm-v7
          - service: barcode-agent
            image: raspisys-barcode-agent-contract
            dockerfile: infrastructure/docker/Dockerfile.barcode-agent
            platform: linux/arm64
            platform_tag: linux-arm64
          - service: barcode-agent
            image: raspisys-barcode-agent-contract
            dockerfile: infrastructure/docker/Dockerfile.barcode-agent
            platform: linux/arm/v7
            platform_tag: linux-arm-v7
          - service: torque-agent
            image: raspisys-torque-agent-contract
            dockerfile: infrastructure/docker/Dockerfile.torque-agent
            platform: linux/arm64
            platform_tag: linux-arm64
          - service: torque-agent
            image: raspisys-torque-agent-contract
            dockerfile: infrastructure/docker/Dockerfile.torque-agent
            platform: linux/arm/v7
            platform_tag: linux-arm-v7
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v6

      - name: Set up QEMU for the selected Pi4 platform
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the Pi4 agent image contract
        run: |
          docker buildx build --load --platform "${{ matrix.platform }}" \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ matrix.image }}:${GITHUB_SHA}-${{ matrix.platform_tag }}" .

      - name: Scan the Pi4 agent image contract
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:${{ github.sha }}-${{ matrix.platform_tag }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln,secret
          trivyignores: .trivyignore

  signage-artifact-contract:
    name: signage-artifact-contract
    needs: change-classification
    if: ${{ needs.change-classification.outputs.signage_artifact == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v6

      - name: Install the exact Signage attestation verifier
        env:
          SIGNAGE_GH_VERSION: 2.96.0
          SIGNAGE_GH_ARCHIVE_SHA256: 83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_${SIGNAGE_GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/cli/cli/releases/download/v${SIGNAGE_GH_VERSION}/gh_${SIGNAGE_GH_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${SIGNAGE_GH_ARCHIVE_SHA256}  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          signage_gh="$RUNNER_TEMP/gh_${SIGNAGE_GH_VERSION}_linux_amd64/bin/gh"
          test "$("$signage_gh" --version | sed -n '1p')" = "gh version 2.96.0 (2026-07-02)"
          echo "SIGNAGE_GH=$signage_gh" >> "$GITHUB_ENV"

      - name: Run real Signage artifact contracts
        run: |
          python3 -m unittest scripts.deploy.tests.test_signage_distribution_artifact
          python3 -m unittest \
            scripts.deploy.tests.test_signage_artifact_stage.ProductionAttestationBoundary

      - name: Build twice and verify the exact candidate artifact
        run: |
          set -euo pipefail
          python3 scripts/deploy/signage-distribution-artifact.py build \
            --root . \
            --source-sha "$GITHUB_SHA" \
            --output signage-release.tar \
            --descriptor signage-release-descriptor.json
          python3 scripts/deploy/signage-distribution-artifact.py build \
            --root . \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/signage-release-second.tar" \
            --descriptor "$RUNNER_TEMP/signage-release-second.json"
          cmp signage-release.tar "$RUNNER_TEMP/signage-release-second.tar"
          cmp signage-release-descriptor.json "$RUNNER_TEMP/signage-release-second.json"
          python3 scripts/deploy/signage-distribution-artifact.py verify \
            --artifact signage-release.tar \
            --descriptor signage-release-descriptor.json \
            --expected-source-sha "$GITHUB_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build exact Signage artifact image without publication
        run: |
          set -euo pipefail
          artifact_sha="$(python3 -c 'import json; print(json.load(open("signage-release-descriptor.json"))["artifactSha256"])')"
          manifest_sha="$(python3 -c 'import json; print(json.load(open("signage-release-descriptor.json"))["manifestSha256"])')"
          docker buildx build --load --platform linux/amd64 \
            --file infrastructure/docker/Dockerfile.signage-release \
            --tag "raspisys-pi3-signage-contract:$GITHUB_SHA" \
            --build-arg "BUILD_COMMIT=$GITHUB_SHA" \
            --build-arg "ARTIFACT_SHA256=$artifact_sha" \
            --build-arg "MANIFEST_SHA256=$manifest_sha" .

      - name: Security scan exact Signage artifact image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'image'
          image-ref: raspisys-pi3-signage-contract:${{ github.sha }}
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          scanners: 'vuln,secret'
          trivyignores: '.trivyignore'

      - name: Upload the verified and scanned Signage artifact
        uses: actions/upload-artifact@v6
        with:
          name: pi3-signage-release-${{ github.sha }}
          path: |
            signage-release.tar
            signage-release-descriptor.json
          if-no-files-found: error
          retention-days: 7

  release-build-contract:
    name: release-build-contract
    needs: change-classification
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.change-classification.outputs.release_pair == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      config_hash: ${{ steps.contract.outputs.config_hash }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v6

      - name: Install Ansible renderer
        run: |
          set -euo pipefail
          python3 -m pip install --user ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render and seal non-secret production build inputs
        id: contract
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/release-build-contract.json"
          scripts/ci/render-release-build-contract.sh \
            --inventory infrastructure/ansible/inventory.yml \
            --sha "$GITHUB_SHA" \
            --output "$contract"
          config_hash="$(
            python3 scripts/deploy/release_build_contract.py hash \
              --release-sha "$GITHUB_SHA" <"$contract"
          )"
          echo "config_hash=$config_hash" >> "$GITHUB_OUTPUT"

      - name: Upload sealed build contract
        uses: actions/upload-artifact@v6
        with:
          name: release-build-contract-${{ github.sha }}
          path: ${{ runner.temp }}/release-build-contract.json
          if-no-files-found: error
          retention-days: 7

  release-api-image:
    name: release-api-image
    needs:
      - change-classification
      - release-build-contract
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.change-classification.outputs.release_pair == 'true'
      }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      repository: ${{ steps.identity.outputs.repository }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v6

      - name: Download sealed build contract
        uses: actions/download-artifact@v7
        with:
          name: release-build-contract-${{ github.sha }}
          path: ${{ runner.temp }}/release-contract

      - name: Define immutable API repository
        id: identity
        run: echo "repository=ghcr.io/denkoushi/raspisys-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for this job
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Security scan API source filesystem
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          scanners: 'vuln'
          skip-dirs: |
            **/certs
            **/alerts

      - name: Build and push exact ARM64 API image
        id: build
        env:
          IMAGE_REPOSITORY: ${{ steps.identity.outputs.repository }}
          CONFIG_HASH: ${{ needs.release-build-contract.outputs.config_hash }}
        run: |
          set -euo pipefail
          digest="$(
            python3 scripts/ci/build_release_image.py \
              --contract "$RUNNER_TEMP/release-contract/release-build-contract.json" \
              --service api \
              --sha "$GITHUB_SHA" \
              --config-hash "$CONFIG_HASH" \
              --repository "$IMAGE_REPOSITORY" \
              --metadata-file "$RUNNER_TEMP/release-api-metadata.json"
          )"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Pull exact ARM64 API digest for scanning
        env:
          IMAGE_REFERENCE: ${{ steps.identity.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: docker pull --platform linux/arm64 "$IMAGE_REFERENCE"

      - name: Select exact ARM64 API image manifest
        env:
          IMAGE_REFERENCE: ${{ steps.identity.outputs.repository }}@${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.identity.outputs.repository }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE_REFERENCE" \
            > "$RUNNER_TEMP/release-api-index.json"
          manifest_digest="$(
            python3 scripts/ci/validate_release_image_budget.py select-linux-arm64 \
              < "$RUNNER_TEMP/release-api-index.json"
          )"
          docker buildx imagetools inspect --raw "${IMAGE_REPOSITORY}@${manifest_digest}" \
            > "$RUNNER_TEMP/release-api-manifest.json"

      - name: Enforce compressed API image budget
        run: >-
          python3 scripts/ci/validate_release_image_budget.py validate-api
          < "$RUNNER_TEMP/release-api-manifest.json"

      - name: Security scan exact ARM64 API digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.identity.outputs.repository }}@${{ steps.build.outputs.digest }}
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          scanners: 'vuln'
          trivyignores: '.trivyignore'

  release-web-image:
    name: release-web-image
    needs:
      - change-classification
      - release-build-contract
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.change-classification.outputs.release_pair == 'true'
      }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      repository: ${{ steps.identity.outputs.repository }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v6

      - name: Download sealed build contract
        uses: actions/download-artifact@v7
        with:
          name: release-build-contract-${{ github.sha }}
          path: ${{ runner.temp }}/release-contract

      - name: Define immutable Web repository
        id: identity
        run: echo "repository=ghcr.io/denkoushi/raspisys-web" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for this job
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push exact ARM64 Web image
        id: build
        env:
          IMAGE_REPOSITORY: ${{ steps.identity.outputs.repository }}
          CONFIG_HASH: ${{ needs.release-build-contract.outputs.config_hash }}
        run: |
          set -euo pipefail
          digest="$(
            python3 scripts/ci/build_release_image.py \
              --contract "$RUNNER_TEMP/release-contract/release-build-contract.json" \
              --service web \
              --sha "$GITHUB_SHA" \
              --config-hash "$CONFIG_HASH" \
              --repository "$IMAGE_REPOSITORY" \
              --metadata-file "$RUNNER_TEMP/release-web-metadata.json"
          )"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Pull exact ARM64 Web digest for scanning
        env:
          IMAGE_REFERENCE: ${{ steps.identity.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: docker pull --platform linux/arm64 "$IMAGE_REFERENCE"

      - name: Security scan exact ARM64 Web digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.identity.outputs.repository }}@${{ steps.build.outputs.digest }}
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          scanners: 'vuln'
          trivyignores: '.trivyignore'

  release-runtime-rehearsal:
    name: release-runtime-rehearsal
    needs:
      - change-classification
      - release-api-image
      - release-web-image
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.change-classification.outputs.release_pair == 'true' &&
        needs['release-api-image'].result == 'success' &&
        needs['release-web-image'].result == 'success'
      }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v6

      - name: Log in to GHCR for exact digest rehearsal
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rehearse exact ARM64 release pair with fixed stability hold
        env:
          API_IMAGE: ${{ needs['release-api-image'].outputs.repository }}@${{ needs['release-api-image'].outputs.digest }}
          WEB_IMAGE: ${{ needs['release-web-image'].outputs.repository }}@${{ needs['release-web-image'].outputs.digest }}
        run: >-
          bash scripts/ci/rehearse-release-runtime.sh
          --api-image "$API_IMAGE"
          --web-image "$WEB_IMAGE"
          --sha "$GITHUB_SHA"

  docker-security:
    name: docker-security (${{ matrix.image }})
    needs: change-classification
    if: >-
      ${{
        needs.change-classification.outputs.docker_security == 'true' &&
        !(
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.change-classification.outputs.release_pair == 'true'
        )
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.change-classification.outputs.docker_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Security scan (Trivy fs)
        if: matrix.image == 'api'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          scanners: 'vuln'
          skip-dirs: |
            **/certs
            **/alerts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }} image (Buildx) and load
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          build-args: |
            BUILD_COMMIT=1111111111111111111111111111111111111111
            BUILD_CONFIG_HASH=2222222222222222222222222222222222222222222222222222222222222222
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Rebuild ${{ matrix.image }} with provenance-only changes
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.tag }}-provenance
          build-args: |
            BUILD_COMMIT=3333333333333333333333333333333333333333
            BUILD_CONFIG_HASH=4444444444444444444444444444444444444444444444444444444444444444
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Verify ${{ matrix.image }} provenance does not invalidate filesystem layers
        env:
          BASE_IMAGE: ${{ matrix.tag }}
          PROVENANCE_IMAGE: ${{ matrix.tag }}-provenance
        run: |
          set -euo pipefail
          base_layers="$(docker image inspect "$BASE_IMAGE" --format '{{json .RootFS.Layers}}')"
          provenance_layers="$(docker image inspect "$PROVENANCE_IMAGE" --format '{{json .RootFS.Layers}}')"
          test "$base_layers" = "$provenance_layers"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" \
            = 1111111111111111111111111111111111111111
          test "$(docker image inspect "$BASE_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.config-hash"}}')" \
            = 2222222222222222222222222222222222222222222222222222222222222222
          test "$(docker image inspect "$PROVENANCE_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" \
            = 3333333333333333333333333333333333333333
          test "$(docker image inspect "$PROVENANCE_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.config-hash"}}')" \
            = 4444444444444444444444444444444444444444444444444444444444444444

      - name: Security scan (Trivy image ${{ matrix.image }})
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'image'
          image-ref: ${{ matrix.tag }}
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          scanners: 'vuln'
          trivyignores: '.trivyignore'

  e2e-smoke:
    name: e2e-smoke
    needs: change-classification
    if: ${{ needs.change-classification.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-monorepo
        with:
          playwright-cache: 'true'

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start PostgreSQL (smoke)
        run: |
          docker run -d \
            --name postgres-e2e-smoke \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=borrow_return \
            -p 5432:5432 \
            --health-cmd="pg_isready -U postgres" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=5 \
            pgvector/pgvector:pg15

      - name: Wait for PostgreSQL (smoke)
        run: |
          chmod +x scripts/ci/wait-for-postgres.sh
          scripts/ci/wait-for-postgres.sh postgres-e2e-smoke 60

      - name: Generate Prisma Client (smoke)
        run: pnpm --filter @raspi-system/api exec prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return

      - name: Run Prisma migrations (smoke)
        run: pnpm --filter @raspi-system/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return

      - name: Configure synthetic E2E administrator (smoke)
        run: |
          echo "E2E_ADMIN_USERNAME=ci-e2e-admin" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Seed database (smoke)
        run: pnpm --filter @raspi-system/api exec prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return

      - name: Build shared packages (smoke)
        run: |
          pnpm --filter @raspi-system/shared-types build
          pnpm --filter @raspi-system/kiosk-sop-core build
          pnpm --filter @raspi-system/part-search-core build
          pnpm --filter @raspi-system/shelf-layout-core build

      - name: Run E2E smoke tests
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return
          VITE_KIOSK_DEFAULT_MODE: TAG
        run: pnpm test:e2e:smoke

      - name: Cleanup PostgreSQL (smoke)
        if: always()
        run: docker stop postgres-e2e-smoke && docker rm postgres-e2e-smoke || true

  kiosk-sop:
    name: kiosk-sop
    needs: change-classification
    if: ${{ needs.change-classification.outputs.kiosk_sop == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify semantic freshness, integrity, geometry, and visual contract
        env:
          KIOSK_SOP_DIAGNOSTICS_DIR: ${{ runner.temp }}/kiosk-sop-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ci/run-kiosk-sop-artifact-contract.sh

      - name: Upload generated candidate, visual report, and diff diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kiosk-sop-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kiosk-sop-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7

  e2e-tests:
    name: e2e-tests
    needs: change-classification
    if: ${{ needs.change-classification.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-monorepo
        with:
          playwright-cache: 'true'

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build shared packages
        run: |
          pnpm --filter @raspi-system/shared-types build
          pnpm --filter @raspi-system/kiosk-sop-core build
          pnpm --filter @raspi-system/part-search-core build
          pnpm --filter @raspi-system/shelf-layout-core build

      - name: Run kiosk runtime recovery browser contract
        run: pnpm test:e2e:runtime-recovery

      - name: Generate Prisma Client
        run: pnpm --filter @raspi-system/api exec prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres-e2e \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=borrow_return \
            -p 5432:5432 \
            --health-cmd="pg_isready -U postgres" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=5 \
            pgvector/pgvector:pg15

      - name: Wait for PostgreSQL
        run: |
          chmod +x scripts/ci/wait-for-postgres.sh
          scripts/ci/wait-for-postgres.sh postgres-e2e 60

      - name: Run Prisma migrations
        run: pnpm --filter @raspi-system/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return

      - name: Configure synthetic E2E administrator
        run: |
          echo "E2E_ADMIN_USERNAME=ci-e2e-admin" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Seed database
        run: pnpm --filter @raspi-system/api exec prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return

      - name: Run E2E tests
        env:
          CI: true
          PLAYWRIGHT_WORKERS: '2'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borrow_return
          JWT_ACCESS_SECRET: test-access-secret-1234567890
          JWT_REFRESH_SECRET: test-refresh-secret-1234567890
          BACKUP_CONFIG_PATH: /tmp/e2e-backup.json
          BACKUP_STORAGE_DIR: /tmp/e2e-backups
        run: pnpm test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker stop postgres-e2e || true
          docker rm postgres-e2e || true

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - change-classification
      - repo-policy
      - workspace-quality
      - api
      - web
      - db-infra
      - deploy-contract
      - container-runtime-rehearsal
      - client
      - pi4-agent-image-contract
      - release-build-contract
      - release-api-image
      - release-web-image
      - release-runtime-rehearsal
      - docker-security
      - e2e-smoke
      - e2e-tests
      - kiosk-sop
      - signage-artifact-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aggregate validator
        uses: actions/checkout@v6

      - name: Require every selected CI job to pass
        env:
          CHANGE_CLASSIFICATION: ${{ needs['change-classification'].result }}
          REPO_POLICY_SELECTED: ${{ needs['change-classification'].outputs.repo_policy }}
          REPO_POLICY_RESULT: ${{ needs['repo-policy'].result }}
          WORKSPACE_QUALITY_SELECTED: ${{ needs['change-classification'].outputs.workspace_quality }}
          WORKSPACE_QUALITY_RESULT: ${{ needs['workspace-quality'].result }}
          API_SELECTED: ${{ needs['change-classification'].outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          WEB_SELECTED: ${{ needs['change-classification'].outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          DB_INFRA_SELECTED: ${{ needs['change-classification'].outputs.db_infra }}
          DB_INFRA_RESULT: ${{ needs['db-infra'].result }}
          DEPLOY_CONTRACT_SELECTED: ${{ needs['change-classification'].outputs.deploy_contract }}
          DEPLOY_CONTRACT_RESULT: ${{ needs['deploy-contract'].result }}
          CONTAINER_RUNTIME_REHEARSAL_SELECTED: ${{ needs['change-classification'].outputs.runtime_rehearsal == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          CONTAINER_RUNTIME_REHEARSAL_RESULT: ${{ needs['container-runtime-rehearsal'].result }}
          CLIENT_SELECTED: ${{ needs['change-classification'].outputs.client }}
          CLIENT_RESULT: ${{ needs.client.result }}
          PI4_AGENT_IMAGE_RESULT: ${{ needs['pi4-agent-image-contract'].result }}
          RELEASE_PAIR_SELECTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs['change-classification'].outputs.release_pair == 'true' }}
          RELEASE_BUILD_CONTRACT_RESULT: ${{ needs['release-build-contract'].result }}
          RELEASE_API_RESULT: ${{ needs['release-api-image'].result }}
          RELEASE_WEB_RESULT: ${{ needs['release-web-image'].result }}
          RELEASE_RUNTIME_REHEARSAL_RESULT: ${{ needs['release-runtime-rehearsal'].result }}
          DOCKER_SECURITY_SELECTED: ${{ needs['change-classification'].outputs.docker_security == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && needs['change-classification'].outputs.release_pair == 'true') }}
          DOCKER_SECURITY_RESULT: ${{ needs['docker-security'].result }}
          E2E_SELECTED: ${{ needs['change-classification'].outputs.e2e }}
          E2E_SMOKE: ${{ needs['e2e-smoke'].result }}
          E2E_TESTS: ${{ needs['e2e-tests'].result }}
          KIOSK_SOP_SELECTED: ${{ needs['change-classification'].outputs.kiosk_sop }}
          KIOSK_SOP_RESULT: ${{ needs['kiosk-sop'].result }}
          SIGNAGE_ARTIFACT_SELECTED: ${{ needs['change-classification'].outputs.signage_artifact }}
          SIGNAGE_ARTIFACT_RESULT: ${{ needs['signage-artifact-contract'].result }}
        run: |
          python3 scripts/ci/validate_required_results.py \
            --classification-result "$CHANGE_CLASSIFICATION" \
            "repo-policy=$REPO_POLICY_SELECTED:$REPO_POLICY_RESULT" \
            "workspace-quality=$WORKSPACE_QUALITY_SELECTED:$WORKSPACE_QUALITY_RESULT" \
            "api=$API_SELECTED:$API_RESULT" \
            "web=$WEB_SELECTED:$WEB_RESULT" \
            "db-infra=$DB_INFRA_SELECTED:$DB_INFRA_RESULT" \
            "deploy-contract=$DEPLOY_CONTRACT_SELECTED:$DEPLOY_CONTRACT_RESULT" \
            "container-runtime-rehearsal=$CONTAINER_RUNTIME_REHEARSAL_SELECTED:$CONTAINER_RUNTIME_REHEARSAL_RESULT" \
            "client=$CLIENT_SELECTED:$CLIENT_RESULT" \
            "pi4-agent-image-contract=$CLIENT_SELECTED:$PI4_AGENT_IMAGE_RESULT" \
            "release-build-contract=$RELEASE_PAIR_SELECTED:$RELEASE_BUILD_CONTRACT_RESULT" \
            "release-api-image=$RELEASE_PAIR_SELECTED:$RELEASE_API_RESULT" \
            "release-web-image=$RELEASE_PAIR_SELECTED:$RELEASE_WEB_RESULT" \
            "release-runtime-rehearsal=$RELEASE_PAIR_SELECTED:$RELEASE_RUNTIME_REHEARSAL_RESULT" \
            "docker-security=$DOCKER_SECURITY_SELECTED:$DOCKER_SECURITY_RESULT" \
            "e2e-smoke=$E2E_SELECTED:$E2E_SMOKE" \
            "e2e-tests=$E2E_SELECTED:$E2E_TESTS" \
            "kiosk-sop=$KIOSK_SOP_SELECTED:$KIOSK_SOP_RESULT" \
            "signage-artifact-contract=$SIGNAGE_ARTIFACT_SELECTED:$SIGNAGE_ARTIFACT_RESULT"

  pi4-agent-images-publish:
    name: pi4-agent-images-publish (${{ matrix.service }})
    needs:
      - change-classification
      - ci-required
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs['ci-required'].result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: nfc-agent
            repository: ghcr.io/denkoushi/raspisys-nfc-agent
            dockerfile: infrastructure/docker/Dockerfile.nfc-agent
          - service: barcode-agent
            repository: ghcr.io/denkoushi/raspisys-barcode-agent
            dockerfile: infrastructure/docker/Dockerfile.barcode-agent
          - service: torque-agent
            repository: ghcr.io/denkoushi/raspisys-torque-agent
            dockerfile: infrastructure/docker/Dockerfile.torque-agent
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for Pi4 platforms
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish the exact-SHA multi-platform Pi4 agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64,linux/arm/v7
          push: true
          tags: ${{ matrix.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=pi4-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=pi4-${{ matrix.service }}
          provenance: mode=min
          sbom: true

  signage-artifact-gates:
    name: signage-artifact-gates
    needs:
      - change-classification
      - ci-required
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.change-classification.outputs.signage_artifact == 'true' &&
        needs['ci-required'].result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Checkout exact-main Signage publication gate
        uses: actions/checkout@v6

      - name: Require fixed external checks on the exact SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/wait_for_release_checks.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --required codeql \
            --required gitleaks \
            --timeout 1800 \
            --interval 10

  signage-artifact-publish:
    name: signage-artifact-publish
    needs:
      - change-classification
      - signage-artifact-contract
      - signage-artifact-gates
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.change-classification.outputs.signage_artifact == 'true' &&
        needs['signage-artifact-contract'].result == 'success' &&
        needs['signage-artifact-gates'].result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v6

      - name: Download the verified and scanned Signage artifact
        uses: actions/download-artifact@v7
        with:
          name: pi3-signage-release-${{ github.sha }}
          path: .

      - name: Install the exact Signage attestation verifier
        env:
          SIGNAGE_GH_VERSION: 2.96.0
          SIGNAGE_GH_ARCHIVE_SHA256: 83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_${SIGNAGE_GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/cli/cli/releases/download/v${SIGNAGE_GH_VERSION}/gh_${SIGNAGE_GH_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${SIGNAGE_GH_ARCHIVE_SHA256}  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          signage_gh="$RUNNER_TEMP/gh_${SIGNAGE_GH_VERSION}_linux_amd64/bin/gh"
          test "$("$signage_gh" --version | sed -n '1p')" = "gh version 2.96.0 (2026-07-02)"
          echo "SIGNAGE_GH=$signage_gh" >> "$GITHUB_ENV"

      - name: Verify exact-main Signage artifact identity
        id: identity
        run: |
          set -euo pipefail
          python3 scripts/deploy/signage-distribution-artifact.py verify \
            --artifact signage-release.tar \
            --descriptor signage-release-descriptor.json \
            --expected-source-sha "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          descriptor = json.loads(Path("signage-release-descriptor.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"artifact_sha256={descriptor['artifactSha256']}\n")
              output.write(f"manifest_sha256={descriptor['manifestSha256']}\n")
          predicate = {
              "artifactKind": descriptor["artifactKind"],
              "artifactSha256": descriptor["artifactSha256"],
              "manifestSha256": descriptor["manifestSha256"],
              "schemaVersion": descriptor["schemaVersion"],
              "sourceSha": descriptor["sourceSha"],
          }
          Path("signage-release-attestation.json").write_text(
              json.dumps(predicate, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Log in to GHCR for signed Signage publication
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish exact-main Signage artifact as immutable OCI image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/Dockerfile.signage-release
          platforms: linux/arm/v7
          push: true
          tags: ghcr.io/denkoushi/raspisys-pi3-signage:${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            ARTIFACT_SHA256=${{ steps.identity.outputs.artifact_sha256 }}
            MANIFEST_SHA256=${{ steps.identity.outputs.manifest_sha256 }}
          provenance: mode=max
          sbom: true

      - name: Verify the published exact OCI digest exists
        env:
          IMAGE_REFERENCE: ghcr.io/denkoushi/raspisys-pi3-signage@${{ steps.publish.outputs.digest }}
        run: docker buildx imagetools inspect "$IMAGE_REFERENCE"

      - name: Attest source, artifact, and manifest identities
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/denkoushi/raspisys-pi3-signage
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: https://github.com/denkoushi/RaspberryPiSystem_002/attestations/pi3-signage-release/v1
          predicate-path: signage-release-attestation.json
          push-to-registry: true

      - name: Production-equivalent verification of the published attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/deploy/rolling_release/signage_artifact_stage.py \
            --verify-published-attestation \
            --gh "$SIGNAGE_GH" \
            --exact-reference "ghcr.io/denkoushi/raspisys-pi3-signage@${{ steps.publish.outputs.digest }}" \
            --source-sha "$GITHUB_SHA" \
            --artifact-sha256 "${{ steps.identity.outputs.artifact_sha256 }}" \
            --manifest-sha256 "${{ steps.identity.outputs.manifest_sha256 }}"

  release-gates:
    name: release-gates
    needs:
      - change-classification
      - ci-required
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.change-classification.outputs.release_pair == 'true' &&
        needs['ci-required'].result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Checkout release gate
        uses: actions/checkout@v6

      - name: Require fixed external checks on the exact SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/wait_for_release_checks.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --required codeql \
            --required gitleaks \
            --timeout 1800 \
            --interval 10

  release-set:
    name: release-set
    needs:
      - change-classification
      - release-build-contract
      - release-api-image
      - release-web-image
      - release-runtime-rehearsal
      - release-gates
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.change-classification.outputs.release_pair == 'true' &&
        needs['release-build-contract'].result == 'success' &&
        needs['release-api-image'].result == 'success' &&
        needs['release-web-image'].result == 'success' &&
        needs['release-runtime-rehearsal'].result == 'success' &&
        needs['release-gates'].result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v6

      - name: Log in to GHCR for signed release publication
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create strict API/Web release set
        env:
          CONFIG_HASH: ${{ needs.release-build-contract.outputs.config_hash }}
          API_REPOSITORY: ${{ needs.release-api-image.outputs.repository }}
          API_DIGEST: ${{ needs.release-api-image.outputs.digest }}
          WEB_REPOSITORY: ${{ needs.release-web-image.outputs.repository }}
          WEB_DIGEST: ${{ needs.release-web-image.outputs.digest }}
        run: |
          python3 scripts/deploy/release_artifact_contract.py create \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --config-hash "$CONFIG_HASH" \
            --api-repository "$API_REPOSITORY" \
            --api-digest "$API_DIGEST" \
            --web-repository "$WEB_REPOSITORY" \
            --web-digest "$WEB_DIGEST" \
            --workflow .github/workflows/ci.yml \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > release-set.json

      - name: Publish release set as an immutable OCI image
        id: publish-release-set
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/Dockerfile.release-set
          platforms: linux/arm64
          push: true
          tags: ghcr.io/denkoushi/raspisys-release-set:${{ github.sha }}-${{ needs.release-build-contract.outputs.config_hash }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_CONFIG_HASH=${{ needs.release-build-contract.outputs.config_hash }}
          provenance: mode=min
          sbom: true

      - name: Attest exact ARM64 API image
        uses: actions/attest@v4
        with:
          subject-name: ${{ needs.release-api-image.outputs.repository }}
          subject-digest: ${{ needs.release-api-image.outputs.digest }}
          push-to-registry: true

      - name: Attest exact ARM64 Web image
        uses: actions/attest@v4
        with:
          subject-name: ${{ needs.release-web-image.outputs.repository }}
          subject-digest: ${{ needs.release-web-image.outputs.digest }}
          push-to-registry: true

      - name: Attest the release set after all fixed gates
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/denkoushi/raspisys-release-set
          subject-digest: ${{ steps.publish-release-set.outputs.digest }}
          push-to-registry: true
