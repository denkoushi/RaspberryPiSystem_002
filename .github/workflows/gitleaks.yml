name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    # 02:30 JST is 17:30 UTC on the previous calendar day.
    - cron: '30 17 * * *'

permissions:
  contents: read

concurrency:
  # Per-commit for non-PR runs: release-gates waits for this check on the exact SHA.
  group: gitleaks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: >-
      ${{ (github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch') &&
          'gitleaks-audit' || 'gitleaks' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ github.event_name != 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks (event-native range)
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'push'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Gitleaks (manual branch range)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            --workdir /repo \
            zricethezav/gitleaks:v8.24.3@sha256:5d0147dc25c78f8cc2b9861ff8f5c9b4a41419ed60a9ce2217de5a215270b42b \
            git --redact --verbose --exit-code 2 \
            --report-format sarif --report-path results.sarif \
            --log-opts=origin/main..HEAD .

      - name: Upload manual Gitleaks report on failure
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-results
          path: results.sarif
          if-no-files-found: error

      - name: Record exact-main publication skip
        if: github.event_name == 'push'
        run: echo "The reviewed commit range already passed gitleaks; exact main publication does not repeat it." >> "$GITHUB_STEP_SUMMARY"
