# Composite: checkout の後に呼ぶ。pnpm + Node + 依存インストールまでを共通化する。
name: Setup pnpm monorepo
description: Install pnpm, Node 24 with pnpm cache, and workspace dependencies
inputs:
  playwright-cache:
    description: If true, restore/save Playwright browser cache after install
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Cache Playwright browsers
      if: inputs.playwright-cache == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
