version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      pnpm-workspace:
        patterns: ["*"]
    ignore:
      # @a2ui/web_core is patched to import zod/v3 because the workspace overrides zod to v4.
      # The patch in pnpm-workspace.yaml is tied to an exact version, so any a2ui bump breaks
      # the whole group update. Bump @a2ui/* by hand together with a regenerated patch.
      - dependency-name: "@a2ui/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      production-images:
        patterns: ["*"]
    ignore:
      # Images stay on the Node major that CI and package.json engines use.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Browser binaries must match the playwright npm package; bump both together.
      - dependency-name: "mcr.microsoft.com/playwright"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: pip
    directory: /clients/torque-agent
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      torque-agent:
        patterns: ["*"]
