# Opt in only through scripts/server/pi5-replication.sh. No change to server.yml.
services:
  db:
    # db-start-guard.sh forwards these arguments to docker-entrypoint.sh.
    command:
      - postgres
      # server.yml と同じメモリ設定(KB-459)。command は上書きされるのでここにも書く。
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=16MB
      - -c
      - log_temp_files=10MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
      - -c
      - max_slot_wal_keep_size=1024MB
      - -c
      - synchronous_standby_names=
      - -c
      - hba_file=/var/lib/postgresql/18/docker/replication-primary-pg_hba.conf
    ports:
      - target: 5432
        published: "5432"
        host_ip: ${PI5_REPLICATION_PRIMARY_IP:?PI5_REPLICATION_PRIMARY_IP is required}
        protocol: tcp
