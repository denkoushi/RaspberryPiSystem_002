# Business Hermes is a single-purpose profile for the assembly guide.
# Credentials are injected through the Ansible-managed runtime env file.
model:
  provider: custom
  default: gpt-5.6-luna
  base_url: https://api.openai.com/v1
  api_mode: chat_completions

memory:
  memory_enabled: false
  user_profile_enabled: false

agent:
  reasoning_effort: xhigh
  disabled_toolsets:
    - skills
    - memory
    - session_search

terminal:
  backend: local
  cwd: /opt/data/home
  home_mode: profile
  env_passthrough: []

gateway:
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
    model_name: business-hermes
    max_concurrent_runs: 2
