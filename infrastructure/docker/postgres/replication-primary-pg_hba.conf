# Rendered inside existing PGDATA by pi5-replication.sh; original HBA is untouched.
host replication raspi_replicator @STANDBY_IP@/32 scram-sha-256
# Do not fall through to any older, broader replication permissions.
host replication all 0.0.0.0/0 reject
host replication all ::/0 reject
# This role is for physical replication, never for ordinary TCP SQL sessions.
host all raspi_replicator 0.0.0.0/0 reject
host all raspi_replicator ::/0 reject
local all raspi_replicator reject
local replication all reject
include pg_hba.conf
