# ネットワークモードを切り替えることで、Ansibleが参照するIPアドレスを変更できます。
# - tailscale: Tailscale経由のIPを使用（通常運用・標準）
# - local: ローカルネットワークのIPを使用（緊急時のみ）
network_mode: "tailscale"

# ローカルネットワークで使用するIPアドレス
local_network:
  raspberrypi5_ip: "192.168.10.230"
  raspberrypi4_ip: "192.168.10.224"
  raspi4_robodrill01_ip: "192.168.10.236"
  raspi4_fjv60_80_ip: "192.168.10.12"
  # Kensaku StoneBase01（Pi4 4台目）— LAN 到達確認用。通常運用は tailscale_network の 100.x を追記すること
  raspi4_kensaku_stonebase01_ip: "192.168.10.238"
  # Sessaku-01（Pi4 5台目）— 自宅セットアップ時の LAN 到達確認用
  raspi4_sessaku_01_ip: "192.168.128.187"
  # Assembly-01（Pi4 6台目）— 初期セットアップ時の LAN 到達確認用
  raspi4_assembly_01_ip: "192.168.10.177"
  # Kensaku-02（Pi4 7台目）— 初期セットアップ時の LAN 到達確認用
  raspi4_kensaku_02_ip: "192.168.10.180"
  # Assembly-02（Pi4 8台目）— 初期セットアップ時の LAN 到達確認用
  raspi4_assembly_02_ip: "192.168.10.217"
  raspberrypi3_ip: "192.168.128.152"

# 通常運用（Tailscale経由）に使用するIPアドレス
# Tailscaleで割り当てられるIPを確認して設定してください。
tailscale_network:
  raspberrypi5_ip: "100.106.158.2"
  raspberrypi4_ip: "100.74.144.79"
  raspi4_robodrill01_ip: "100.123.1.113"
  raspi4_fjv60_80_ip: "100.100.229.95"
  raspi4_kensaku_stonebase01_ip: "100.101.113.95"
  raspi4_sessaku_01_ip: "100.115.109.18"
  raspi4_assembly_01_ip: "100.68.35.46"
  raspi4_kensaku_02_ip: "100.93.139.16"
  raspi4_assembly_02_ip: "100.66.122.32"
  raspberrypi3_ip: "100.105.224.86"

# 現在有効なネットワーク設定（network_modeに応じて切り替え）
current_network: "{{ local_network if network_mode == 'local' else tailscale_network }}"

# サーバー（Pi5）およびクライアントのIPアドレスを共通変数として扱う
server_ip: "{{ current_network.raspberrypi5_ip | default(local_network.raspberrypi5_ip) }}"
kiosk_ip: "{{ current_network.raspberrypi4_ip | default(local_network.raspberrypi4_ip) }}"
signage_ip: "{{ current_network.raspberrypi3_ip | default(local_network.raspberrypi3_ip) }}"

# よく使うURLを共通変数として定義
server_base_url: "https://{{ server_ip }}"
kiosk_full_url: "{{ server_base_url }}/kiosk"
# ベストプラクティス: APIはDocker内部ネットワーク上でのみ8080を待ち受け、外部アクセスはCaddy(443)経由で行う
# クライアント（Pi3/Pi4）のエージェントは https://<Pi5>/api を使用する
api_base_url: "{{ server_base_url }}/api"
# haizen-agent は api_client 側で `/api/mobile-placement/...` を付与するため、ベースはサーバー**オリジン**（/api なし）
haizen_agent_api_base_url: "{{ server_base_url }}"
websocket_agent_url: "ws://{{ server_ip }}:7071/stream"

# APIヘルスチェックURL: Caddy経由（HTTPS 443）でアクセス
# 注意: APIはDocker内部ネットワークの8080のみで待ち受け、外部アクセスはCaddy経由のみ
# group_vars/all.ymlに配置することで、リポジトリ更新前に変数が読み込まれる（Ansibleの変数読み込みタイミング問題を回避）
api_healthcheck_url: "{{ api_base_url }}/system/health"

# 既存の変数名との互換性を保つためのエイリアス
status_agent_api_base_url: "{{ api_base_url }}"
nfc_agent_api_base_url: "{{ api_base_url }}"
docker_server_ip: "{{ server_ip }}"

# Ubuntu LocalLLM（Tailscale）。inventory の api_local_llm_* / オンデマンド制御 URL と一致させる
# （runbook: docs/runbooks/local-llm-tailscale-sidecar.md）
ubuntu_local_llm_host: "100.107.223.92"
ubuntu_local_llm_inference_nginx_port: "38081"

# Tailscale設定（通常運用で有効）
tailscale_enabled: true
tailscale_auth_key: "{{ vault_tailscale_auth_key | default('') }}"
tailscale_extra_args: "--ssh"
tailscale_install_script: "https://tailscale.com/install.sh"

# セキュリティ/ファイアウォール設定
ufw_enabled: true
ufw_default_incoming_policy: "deny"
ufw_default_outgoing_policy: "allow"
ufw_allowed_tcp_ports:
  - "80"
  - "443"
ufw_ssh_allowed_networks:
  - "192.168.10.0/24"
  - "100.64.0.0/10"
# Caddy管理画面は暗黙の既定値を持たない。初回だけ承認付きPlaybookで
# Docker .envへ反映し、以後は標準preflightが接続元を含むことを検証する。
admin_allow_nets:
  - "192.168.10.0/24"
  - "192.168.128.0/24"
  - "100.64.0.0/10"
  - "127.0.0.1/32"
# VNCポート（信頼ネットワークからのみ許可）
# 複数のローカルネットワークに対応（会社: 192.168.10.0/24、自宅: 192.168.128.0/24）
# Tailscale経由でのアクセスも許可（100.64.0.0/10）
ufw_vnc_allowed_networks:
  - "192.168.10.0/24"
  - "192.168.128.0/24"
  - "100.64.0.0/10"
ufw_logging_level: "medium"

# wayvnc設定（Pi5サーバー側のVNCサーバー）
wayvnc_use_relative_paths: true
wayvnc_address: "0.0.0.0"  # IPv4/IPv6両対応（IPv6のみの場合は "::"）
wayvnc_enable_auth: true
wayvnc_enable_pam: true
wayvnc_private_key_file: "tls_key.pem"
wayvnc_certificate_file: "tls_cert.pem"
wayvnc_rsa_private_key_file: "rsa_key.pem"

caddy_log_dir: "/var/log/caddy"
alert_script_path: "/opt/RaspberryPiSystem_002/scripts/generate-alert.sh"
alert_webhook_url: ""
alert_webhook_timeout_seconds: 5

fail2ban_enabled: true
fail2ban_defaults:
  # SSHブルートフォース抑止を強化（誤BANとのバランスを取りつつ厳格化）
  bantime: "4h"
  findtime: "10m"
  maxretry: 4
# HTTP認証失敗（caddy-http-auth）も一段厳格化
fail2ban_http_maxretry: 10
fail2ban_http_findtime: "15m"
fail2ban_http_bantime: "2h"

# SSHハードニング（server role）
# - 既存接続を維持するため、設定反映はreloadで行う
ssh_hardening_enabled: true
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_permit_root_login: "no"
ssh_kbd_interactive_authentication: "no"
ssh_log_level: "INFO"

# apt cacheの再取得を抑制（同一デプロイ内の重複apt updateを削減）
# - cache_valid_timeの単位は秒
# - update_cache: trueは維持し、判定不能時は安全側で更新
apt_cache_valid_time_seconds: 3600

# 不要サービス停止（ポート閉塞）
# VNCは残す運用だが、不要な常駐サービスは止めて攻撃面を減らす
server_disable_unused_services: true
server_unused_systemd_units_to_mask:
  - rpcbind.socket
  - rpcbind.service
  - avahi-daemon.service
  - exim4.service
  - cups.service

# マルウェア対策設定
clamav_server_enabled: true
clamav_server_scan_paths:
  - "/opt/RaspberryPiSystem_002"
  - "/opt/backups"
clamav_server_scan_cron: "0 3 * * *"
clamav_server_log_dir: "/var/log/clamav"
clamav_server_log_file: "clamav-scan.log"
clamav_kiosk_enabled: true
clamav_kiosk_scan_paths:
  - "/opt/RaspberryPiSystem_002/storage"
clamav_kiosk_scan_cron: "0 2 * * 0"
clamav_kiosk_log_dir: "/var/log/clamav"
clamav_kiosk_log_file: "clamav-kiosk-scan.log"

trivy_install_method: "apt"
trivy_repo_url: "https://get.trivy.dev/deb"
trivy_repo_distribution: "generic"
trivy_repo_component: "main"
trivy_repo_key_url: "https://get.trivy.dev/deb/public.key"
trivy_package_name: "trivy"
trivy_package_state: "latest"
trivy_enabled: true
trivy_scan_target: "/opt/RaspberryPiSystem_002"
trivy_scan_timeout: "30m"
trivy_scan_cron: "30 3 * * *"
trivy_image_scan_cron: "0 4 * * *"
trivy_log_dir: "/var/log/trivy"
trivy_log_file: "trivy-scan.log"
trivy_version: "0.54.1"
trivy_package_file: "trivy_{{ trivy_version }}_Linux-ARM64.deb"
trivy_download_url: "https://github.com/aquasecurity/trivy/releases/download/v{{ trivy_version }}/{{ trivy_package_file }}"
trivy_skip_dirs:
  - "/opt/RaspberryPiSystem_002/storage"
  - "/opt/RaspberryPiSystem_002/certs"
  - "/opt/RaspberryPiSystem_002/secrets"
trivy_alert_ignore_patterns:
  - "{{ security_review_data_dir }}"
  - "/certs/"
  - "/backups/"

# Private nightly review: enabled after the host preparation and a verified manual collector run.
security_review_collect_enabled: true
security_review_nightly_enabled: true
security_review_collect_on_calendar: "*-*-* 05:30:00 Asia/Tokyo"
security_review_nightly_cron: "0 6 * * *"
security_review_retry_until: "06:55"
security_review_data_dir: "{{ pi5_project_dir | default(repo_path | default('/opt/RaspberryPiSystem_002')) }}/storage/security-review"
security_review_state_dir: /var/lib/security-review
security_review_material_byte_cap: 192000
security_review_changes_context_lines: 1
# Last matching specific pattern wins; * is the fallback rank only.
security_review_changes_priority:
  - 'apps/api/src/routes/*'
  - 'apps/api/src/*auth*'
  - 'apps/api/src/middleware/*'
  - 'apps/api/src/config/*'
  - '*Dockerfile*'
  - 'infrastructure/ansible/templates/*'
  - 'infrastructure/ansible/roles/*/tasks/*'
  - 'clients/*'
  - '*'
  - '*.test.*'
  - '*.spec.*'
  - '__tests__/*'
  - '*/__tests__/*'
  - 'tests/*'
  - '*/tests/*'
  - 'fixtures/*'
  - '*/fixtures/*'
  - '__fixtures__/*'
  - '*/__fixtures__/*'
security_review_caddy_unusual_hours: [0, 1, 2, 3, 4, 5]
security_review_caddy_denied_statuses: [401, 403]
security_review_caddy_unknown_path_statuses: [404]
security_review_caddy_known_path_patterns: ['^/api/', '^/assets/', '^/icons/', '^/(manifest\.json|sw\.js|favicon\.ico)$', '^/(kiosk|admin|signage)(/|$)', '^/$']
security_review_caddy_oversized_bytes: 10485760
security_review_caddy_examples_per_rule: 10
security_review_changes_exclude:
  - 'pnpm-lock.yaml'
  - '*package-lock.json'
  - '*.lock'
  - 'docs/*'
  - '*.md'
  - '*/generated/*'
  - 'generated/*'
  - '*.generated.*'
  - '*.svg'
  - '*.png'
  - '*.jpg'
  - '*.jpeg'
  - '*.gif'
  - '*.webp'
  - '*.ico'
  - '*.pdf'
  - '*.env*'
  - '.env*'
  - '*/.env*'
  - '*.pem'
  - '*.key'
  - 'certs/*'
  - '*secret*'
  - '*credentials*'
security_review_collector_config:
  project_dir: "{{ pi5_project_dir | default(repo_path | default('/opt/RaspberryPiSystem_002')) }}"
  data_dir: "{{ security_review_data_dir }}"
  state_file: "{{ security_review_state_dir }}/last_reviewed_sha"
  api_uid: "{{ api_runtime_uid | default(1000) | int }}"
  api_gid: "{{ api_runtime_gid | default(1000) | int }}"
  timezone: Asia/Tokyo
  material_byte_cap: "{{ security_review_material_byte_cap }}"
  changes_exclude: "{{ security_review_changes_exclude }}"
  changes_context_lines: "{{ security_review_changes_context_lines }}"
  changes_priority: "{{ security_review_changes_priority }}"
  fail2ban_logs: ["{{ security_monitor_fail2ban_log }}*"]
  caddy_logs: ["{{ caddy_log_dir }}/access*.log", "{{ caddy_log_dir }}/access*.log.gz"]
  monitor_unit: security-monitor.service
  containers: [api-blue, api-green, web-blue, web-green]
  caddy_rules:
    unusual_hours: "{{ security_review_caddy_unusual_hours }}"
    denied_statuses: "{{ security_review_caddy_denied_statuses }}"
    unknown_path_statuses: "{{ security_review_caddy_unknown_path_statuses }}"
    known_path_patterns: "{{ security_review_caddy_known_path_patterns }}"
    oversized_bytes: "{{ security_review_caddy_oversized_bytes }}"
    examples_per_rule: "{{ security_review_caddy_examples_per_rule }}"
  scans:
    - name: clamav
      paths: ["{{ clamav_server_log_dir }}/{{ clamav_server_log_file }}*"]
      start: 'Starting ClamAV scan'
      end: 'Scan completed.'
    - name: trivy
      paths: ["{{ trivy_log_dir }}/{{ trivy_log_file }}*"]
      start: 'Starting Trivy filesystem scan'
      end: 'Trivy scan completed.'
    - name: trivy-images
      paths: ["{{ trivy_log_dir }}/trivy-image-scan.log*"]
      start: 'Starting Trivy image scan'
      end: 'Trivy image scan completed.'
    - name: package-integrity
      paths: ["{{ package_integrity_log_dir }}/{{ package_integrity_log_file }}*"]
      start: 'Starting package integrity check...'
      end: 'Package integrity check completed.'

# Nightly scans run in a systemd scope with this disk bandwidth cap (path resolves to its backing disk)
security_scan_io_device: "/"
security_scan_io_bandwidth_max: "30M"

package_integrity_enabled: true
package_integrity_cron: "0 4 * * *"
package_integrity_log_dir: "/var/log/package-integrity"
package_integrity_log_file: "package-integrity-scan.log"
package_integrity_allowed_paths:
  - "/etc/skel/.bashrc"
  - "/etc/chromium/master_preferences"
  - "/etc/plymouth/plymouthd.conf"
  - "/etc/login.defs"
  - "/etc/xdg/labwc-greeter/environment"
  - "/etc/xdg/pcmanfm/default/pcmanfm.conf"
  - "/usr/share/firefox/distribution/distribution.ini"
  - "/etc/default/useradd"
  - "/etc/avahi/avahi-daemon.conf"
  - "/usr/lib/modprobe.d/g_ether.conf"
  - "/etc/wayvnc/config"
  - "/etc/initramfs-tools/initramfs.conf"
  - "/etc/lightdm/lightdm.conf"

rkhunter_ignore_patterns:
  - "User 'clamav' has been added"
  - "Group 'clamav' has been added"
  - "PermitRootLogin"
  - "/dev/shm/lttng-ust-wait"
  - "/etc/.updated"

rkhunter_kiosk_enabled: true
rkhunter_kiosk_cron: "30 2 * * 0"
rkhunter_kiosk_log_dir: "/var/log/rkhunter"
rkhunter_kiosk_log_file: "rkhunter-kiosk.log"

# マルウェア対策設定
clamav:
  enabled: true
  log_dir: "/var/log/clamav"
  scan_paths:
    - "/opt/RaspberryPiSystem_002/apps/api"
    - "/opt/RaspberryPiSystem_002/apps/web"
    - "/opt/RaspberryPiSystem_002/storage"
  cron:
    minute: "0"
    hour: "3"
    weekday: "0" # Sunday

trivy:
  enabled: true
  log_dir: "/var/log/trivy"
  target_paths:
    - "/opt/RaspberryPiSystem_002"
  cron:
    minute: "0"
    hour: "4"
    weekday: "0"

rkhunter:
  enabled: true
  log_dir: "/var/log/rkhunter"
  cron:
    minute: "30"
    hour: "4"
    weekday: "0"

# Weekly OS security updates; stage 1 reports fleet-wide, with one apply canary.
os_security_update_enabled: true
os_security_update_mode: dry-run
os_security_update_package_blacklist:
  - '^docker-ce$'
  - '^docker-ce-cli$'
  - '^docker-ce-rootless-extras$'
  - '^containerd[.]io$'
  - '^docker-buildx-plugin$'
  - '^docker-compose-plugin$'
  - '^tailscale$'
  - '^linux-image'
  - '^linux-headers'
  - '^linux-kbuild'
  - '^raspi-firmware$'
  - '^raspberrypi-(kernel|bootloader)'
  - '^rpi-eeprom'
  - '^firmware-'
  - '^initramfs-tools'
os_security_update_package_allowlist:
  - '^chromium'
  - '^rpi-chromium-mods$'
os_security_update_oncalendar: "Sun *-*-* 02:00:00"
os_security_update_randomized_delay_sec: '0'
os_security_update_browser_unit: ''
os_security_update_state_dir: /var/lib/raspi-os-security-update
os_security_update_window_start_hour: 0
os_security_update_window_end_hour: 5
os_security_update_release_marker: /run/raspi-release/active
os_security_update_release_marker_max_age_seconds: 14400
os_security_update_lock_path: /run/lock/raspi-os-security-update.lock

# 監視・アラート設定（Phase6）
security_monitor_enabled: true
security_monitor_state_dir: "/var/lib/security-monitor"
security_monitor_fail2ban_log: "/var/log/fail2ban.log"
security_monitor_timer_oncalendar: "*:0/15"

# security-monitor（ports-unexpected）設定
# - systemd unitから環境変数として注入し、監視ロジックをホスト/環境ごとに調整可能にする
# - いずれも「空白区切り」を前提とする（bash側の扱いを単純化）
security_monitor_allowed_listen_ports: "22 80 443 5900"
security_monitor_ignore_processes: "tailscaled"
security_monitor_ignore_addr_prefixes: "127.0.0.1 ::1 100. fd7a: fe80:"

# バックアップ検証（自動化）
backup_verify_enabled: true
# 第1日曜。"Sun *-*-01" は「1日が日曜の日だけ」になり、年2〜3回しか動かない
backup_verify_monthly_oncalendar: "Sun *-*-01..07 03:30:00"
backup_verify_quarterly_oncalendar: "Sun *-01,04,07,10-01..07 04:00:00"
backup_verify_monthly_max_age_days: 35
backup_verify_quarterly_max_age_days: 110
backup_verify_max_download_mb: 50

# デバイスタイプごとのデフォルト設定（preflightチェック用）
# 新しいデバイスタイプを追加する場合は、この設定に追加してください
device_type_defaults:
  # Pi3: メモリ416MB、lightdm停止が必要
  # 100MB: 実測で preflight 時点が 105MB 前後になることがあり、110 では不足扱いになるため
  pi3:
    memory_required_mb: 100
    stop_lightdm: true
    services_to_stop:
      - signage-lite.service
      - signage-lite-update.timer
      - signage-lite-watchdog.timer
      - signage-daily-reboot.timer
      - status-agent.timer
  # Pi Zero 2W: メモリ512MB、lightdm停止が必要（Pi3と同様の設定）
  pi_zero_2w:
    memory_required_mb: 100
    stop_lightdm: true
    services_to_stop:
      - signage-lite.service
      - signage-lite-update.timer
      - signage-lite-watchdog.timer
      - signage-daily-reboot.timer
      - status-agent.timer
  # デフォルト設定（device_type未指定時）
  default:
    memory_required_mb: 120
    stop_lightdm: false
    services_to_stop:
      - signage-lite.service
      - signage-lite-update.timer
      - signage-lite-watchdog.timer
      - signage-daily-reboot.timer
      - status-agent.timer
