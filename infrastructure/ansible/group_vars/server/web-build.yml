---
# Pi5 server Web build inputs. Keep these values as explicit strings because
# Vite embeds them into the immutable Web image during the server release.
web_api_base_url: "/api"
web_api_timeout_ms: "120000"
web_ws_base_url: "/ws"
web_agent_ws_url: "ws://localhost:7071/stream"
web_agent_ws_mode: "local"
web_barcode_agent_ws_url: "ws://localhost:7072/stream"
web_enable_debug_logs: "false"
web_kiosk_target_location_selector_enabled: "true"
web_kiosk_due_mgmt_layout_v2_enabled: "true"
web_kiosk_sop_popup_enabled: "true"
web_kiosk_manual_order_device_scope_v2_enabled: "true"
web_kiosk_production_schedule_order_split_enabled: "false"
web_kiosk_leaderboard_defer_residual_summary_enabled: "false"
web_kiosk_leaderboard_terminal_cache_enabled: "true"
web_kiosk_leaderboard_terminal_cache_phase2_swr: "true"
web_kiosk_leaderboard_cache_write_on_mutation: "true"
web_kiosk_leaderboard_seiban_or_client_filter: "true"
web_kiosk_leaderboard_board_client_perf_log: "false"
