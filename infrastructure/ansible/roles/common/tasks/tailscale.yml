---
- name: Check if tailscaled is already installed
  ansible.builtin.command: tailscaled --version
  register: tailscaled_version
  failed_when: false
  changed_when: false

- name: Install Tailscale from its signed apt repository
  when: tailscaled_version.rc != 0
  block:
    - name: Gather distribution facts for the Tailscale repository
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - '!min'
          - distribution

    - name: Ensure HTTPS repository prerequisites are installed
      ansible.builtin.apt:
        name: ca-certificates
        state: present
        update_cache: true

    - name: Ensure the apt keyring directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download the Tailscale repository signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        checksum: "{{ ('sha256:' ~ tailscale_keyring_sha256) if tailscale_keyring_sha256 | length > 0 else omit }}"
        owner: root
        group: root
        mode: '0644'

    - name: Configure the signed Tailscale apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"
        filename: tailscale
        state: present

    - name: Install Tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

- name: Ensure tailscaled service is enabled and started
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started

- name: Check current Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  failed_when: false
  changed_when: false

- name: Parse current Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: "{{ ((tailscale_status.stdout | default('{}')) | from_json).BackendState | default('') }}"
  when: tailscale_status.rc == 0

- name: Determine if Tailscale is connected
  ansible.builtin.set_fact:
    tailscale_connected: "{{ tailscale_backend_state | default('') == 'Running' }}"
  when: tailscale_status.rc == 0

- name: Select the configured static auth key for a disconnected host
  ansible.builtin.set_fact:
    tailscale_effective_auth_key: "{{ tailscale_auth_key | default('') }}"
  when:
    - (tailscale_connected | default(false)) | bool == false
  no_log: true

- name: Authenticate Tailscale with a temporary auth key file
  become: true
  when:
    - (tailscale_connected | default(false)) | bool == false
    - tailscale_effective_auth_key | default('') | length > 0
  no_log: true
  block:
    - name: Create temporary Tailscale auth key file
      ansible.builtin.tempfile:
        state: file
        prefix: tailscale-auth-
      register: tailscale_auth_key_file

    - name: Write the selected Tailscale auth key
      ansible.builtin.copy:
        content: "{{ tailscale_effective_auth_key }}"
        dest: "{{ tailscale_auth_key_file.path }}"
        owner: root
        group: root
        mode: '0600'

    - name: Bring up Tailscale with the selected auth key
      ansible.builtin.command: >-
        tailscale up {{ tailscale_extra_args }}
        --auth-key=file:{{ tailscale_auth_key_file.path }}
  always:
    - name: Remove temporary Tailscale auth key file
      ansible.builtin.file:
        path: "{{ tailscale_auth_key_file.path }}"
        state: absent
      when: tailscale_auth_key_file.path is defined

- name: Fail when no auth provider supplied a key and Tailscale is not connected
  ansible.builtin.fail:
    msg: >-
      Tailscale認証情報が未設定のため、{{ inventory_hostname }} で
      Tailscaleを自動で有効化できません。選択した認証プロバイダーの
      Vault設定または既存接続状態を確認してください。
  when:
    - (tailscale_connected | default(false)) | bool == false
    - tailscale_effective_auth_key | default('') | length == 0

- name: Remove the in-memory auth key after Tailscale authentication
  ansible.builtin.set_fact:
    tailscale_effective_auth_key: ""
  when:
    - (tailscale_connected | default(false)) | bool == false
    - tailscale_effective_auth_key | default('') | length > 0
  no_log: true
