---
- name: Ensure kiosk malware log directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ clamav_kiosk_log_dir }}"
    - "{{ package_integrity_log_dir }}"
  when: terminal_release_mode | default('full') == 'full'

- name: Check kiosk malware log directories before release
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ clamav_kiosk_log_dir }}"
    - "{{ package_integrity_log_dir }}"
  register: kiosk_malware_log_directories
  when: terminal_release_mode | default('full') == 'release-only'

- name: Require kiosk malware log directories before release
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isdir | default(false)
      - item.stat.pw_name | default('') == 'root'
      - item.stat.gr_name | default('') == 'root'
      - item.stat.mode | default('') == '0755'
    fail_msg: Kiosk malware log directories are provisioning-only.
  loop: "{{ kiosk_malware_log_directories.results | default([]) }}"
  when: terminal_release_mode | default('full') == 'release-only'

- name: Check if ClamAV packages are already installed (kiosk)
  ansible.builtin.shell: |
    set -euo pipefail
    dpkg-query -W -f='${Status}\n' clamav clamav-freshclam 2>/dev/null \
      | grep -c '^install ok installed$' \
      | grep -qx '2'
  args:
    executable: /bin/bash
  register: clamav_kiosk_pkg_check
  changed_when: false
  failed_when: false
  when: clamav_kiosk_enabled | default(false)

- name: Determine if ClamAV install is needed (kiosk)
  ansible.builtin.set_fact:
    clamav_kiosk_not_installed: "{{ (clamav_kiosk_pkg_check.rc | default(1)) != 0 }}"
  when: clamav_kiosk_enabled | default(false)

- name: Install ClamAV on kiosk
  ansible.builtin.apt:
    name:
      - clamav
      - clamav-freshclam
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time_seconds | default(3600) }}"
  when:
    - terminal_release_mode | default('full') == 'full'
    - clamav_kiosk_enabled | default(false)
    - clamav_kiosk_not_installed | default(true)

- name: Require ClamAV packages before release
  ansible.builtin.assert:
    that:
      - clamav_kiosk_pkg_check.rc == 0
    fail_msg: ClamAV packages are missing; provision the kiosk before release.
  when:
    - terminal_release_mode | default('full') == 'release-only'
    - clamav_kiosk_enabled | default(false)

- name: Deploy kiosk ClamAV scan script
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/clamav-scan.sh.j2"
    dest: /usr/local/bin/clamav-kiosk-scan.sh
    owner: root
    group: root
    mode: "0755"
  vars:
    clamav_log_dir: "{{ clamav_kiosk_log_dir }}"
    clamav_log_file: "{{ clamav_kiosk_log_file }}"
    clamav_scan_paths: "{{ clamav_kiosk_scan_paths }}"
  register: clamav_kiosk_script_deployed
  when: clamav_kiosk_enabled | default(false)

- name: Schedule kiosk ClamAV scan
  ansible.builtin.cron:
    name: "Weekly ClamAV scan (kiosk)"
    user: root
    minute: "{{ clamav_kiosk_scan_cron.split()[0] }}"
    hour: "{{ clamav_kiosk_scan_cron.split()[1] }}"
    day: "{{ clamav_kiosk_scan_cron.split()[2] }}"
    month: "{{ clamav_kiosk_scan_cron.split()[3] }}"
    weekday: "{{ clamav_kiosk_scan_cron.split()[4] }}"
    job: "/usr/local/bin/clamav-kiosk-scan.sh >/dev/null 2>&1"
  when:
    - terminal_release_mode | default('full') == 'full'
    - clamav_kiosk_enabled | default(false)

- name: Verify kiosk ClamAV cron entry before release
  ansible.builtin.shell: |
    set -euo pipefail
    expected="{{ clamav_kiosk_scan_cron }} /usr/local/bin/clamav-kiosk-scan.sh >/dev/null 2>&1"
    cron="$(crontab -u root -l)"
    test "$(printf '%s\n' "${cron}" | grep -Fxc -- '#Ansible: Weekly ClamAV scan (kiosk)')" -eq 1
    test "$(printf '%s\n' "${cron}" | grep -Fxc -- "${expected}")" -eq 1
    test "$(printf '%s\n' "${cron}" | grep -Fc -- '/usr/local/bin/clamav-kiosk-scan.sh')" -eq 1
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - terminal_release_mode | default('full') == 'release-only'
    - clamav_kiosk_enabled | default(false)

- name: Remove kiosk rkhunter scan cron
  ansible.builtin.cron:
    name: "Weekly rkhunter scan (kiosk)"
    user: root
    state: absent

- name: Remove kiosk rkhunter scan script
  ansible.builtin.file:
    path: /usr/local/bin/rkhunter-kiosk-scan.sh
    state: absent

- name: Remove rkhunter package from kiosk
  ansible.builtin.apt:
    name: rkhunter
    state: absent
    # Purge drops the package's own cron.daily/cron.weekly entries
    purge: true

- name: Deploy kiosk package integrity scan script
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/package-integrity-scan.sh.j2"
    dest: /usr/local/bin/package-integrity-scan.sh
    owner: root
    group: root
    mode: "0755"
  vars:
    package_integrity_scan_allowed_paths: "{{ package_integrity_allowed_paths + package_integrity_kiosk_extra_allowed_paths }}"
    package_integrity_expected_contents:
      - path: /etc/sudoers.d/010_pi-nopasswd
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL\n"
  when: package_integrity_enabled | default(false)

- name: Schedule kiosk package integrity check
  ansible.builtin.cron:
    name: "Package integrity check (kiosk)"
    user: root
    minute: "{{ package_integrity_kiosk_cron.split()[0] }}"
    hour: "{{ package_integrity_kiosk_cron.split()[1] }}"
    day: "{{ package_integrity_kiosk_cron.split()[2] }}"
    month: "{{ package_integrity_kiosk_cron.split()[3] }}"
    weekday: "{{ package_integrity_kiosk_cron.split()[4] }}"
    job: "/usr/local/bin/package-integrity-scan.sh >/dev/null 2>&1"
  when:
    - terminal_release_mode | default('full') == 'full'
    - package_integrity_enabled | default(false)

- name: Verify kiosk package integrity cron entry before release
  ansible.builtin.shell: |
    set -euo pipefail
    expected="{{ package_integrity_kiosk_cron }} /usr/local/bin/package-integrity-scan.sh >/dev/null 2>&1"
    cron="$(crontab -u root -l)"
    test "$(printf '%s\n' "${cron}" | grep -Fxc -- '#Ansible: Package integrity check (kiosk)')" -eq 1
    test "$(printf '%s\n' "${cron}" | grep -Fxc -- "${expected}")" -eq 1
    test "$(printf '%s\n' "${cron}" | grep -Fc -- '/usr/local/bin/package-integrity-scan.sh')" -eq 1
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - terminal_release_mode | default('full') == 'release-only'
    - package_integrity_enabled | default(false)

- name: Deploy kiosk logrotate config for security logs
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/logrotate-security.conf.j2"
    dest: /etc/logrotate.d/raspisys-security
    owner: root
    group: root
    mode: "0644"
