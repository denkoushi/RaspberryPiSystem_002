# Prefer a capture-capable profile so USB headsets expose a microphone to the kiosk.
# Keep playback enabled when the device has a duplex profile.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card[.]usb-.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "output:analog-stereo+input:analog-stereo"
          "output:analog-stereo+input:mono-fallback"
          "output:analog-stereo+input:analog-mono"
          "output:mono-fallback+input:mono-fallback"
          "output:analog-mono+input:analog-mono"
          "input:analog-stereo"
          "input:analog-mono"
          "input:mono-fallback"
        ]
      }
    }
  }
]
