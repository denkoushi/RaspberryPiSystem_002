---
# The signage profile is the only production terminal profile that receives a
# coordinator-sealed source bundle. Keep this release-only repository boundary
# out of the shared common role so Pi4 retains its existing fetch contract.

- name: Validate sealed signage release mutation profile
  ansible.builtin.assert:
    that:
      - terminal_release_mode | default('full') == 'release-only'
      - "'signage' in group_names"
      - terminal_staged_source is defined
    fail_msg: >-
      The signage release executor requires release-only mode, signage inventory
      membership, and a coordinator-sealed local bundle. External Git fetch is
      not an allowed fallback.

- name: Check signage repository directory
  ansible.builtin.stat:
    path: "{{ repo_path }}"
  register: signage_repo_path_stat

- name: Check signage Git repository
  ansible.builtin.stat:
    path: "{{ repo_path }}/.git"
  register: signage_repo_git_stat

- name: Require an existing repository for a sealed signage release
  ansible.builtin.assert:
    that:
      - signage_repo_path_stat.stat.exists | default(false)
      - signage_repo_path_stat.stat.isdir | default(false)
      - signage_repo_git_stat.stat.exists | default(false)
      - signage_repo_git_stat.stat.isdir | default(false)
      - repo_version is match('^[0-9a-f]{40}$')
    fail_msg: >-
      A sealed signage release requires an existing Git repository and an
      immutable lowercase 40-hex repo_version. Provision the host separately
      before retrying.

- name: Verify signage repository is clean and capture current HEAD
  ansible.builtin.shell: |
    set -euo pipefail
    safe_home="$(/usr/bin/getent passwd {{ ansible_user | quote }} | /usr/bin/cut -d: -f6)"
    [[ "${safe_home}" == /* && -d "${safe_home}" ]]
    git() {
      /usr/bin/env -i \
        "PATH=/usr/bin:/bin" \
        "HOME=${safe_home}" \
        "LANG=C" \
        "LC_ALL=C" \
        "GIT_CONFIG_NOSYSTEM=1" \
        "GIT_CONFIG_GLOBAL=/dev/null" \
        "GIT_ATTR_NOSYSTEM=1" \
        "GIT_TERMINAL_PROMPT=0" \
        "GIT_OPTIONAL_LOCKS=0" \
        /usr/bin/git \
        -c core.fsmonitor=false \
        -c core.ignoreStat=false \
        -c core.trustctime=true \
        -c core.hooksPath=/dev/null \
        -c maintenance.auto=false \
        "$@"
    }
    verify_index_policy() {
      git ls-files -v -z | /usr/bin/python3 -c '
    import sys
    entries = sys.stdin.buffer.read().split(b"\0")
    bad = [entry for entry in entries if entry and (entry[:1] == b"S" or entry[:1].islower())]
    if bad:
        print("terminal repository contains skip-worktree or assume-unchanged entries", file=sys.stderr)
        raise SystemExit(1)
    '
      git ls-files -u -z | /usr/bin/python3 -c '
    import sys
    if sys.stdin.buffer.read(1):
        print("terminal repository contains unmerged index entries", file=sys.stderr)
        raise SystemExit(1)
    '
    }
    cd "{{ repo_path }}"
    verify_index_policy
    git diff --quiet
    git diff --cached --quiet
    test -z "$(git status --porcelain --untracked-files=all)"
    head="$(git rev-parse --verify HEAD)"
    [[ "${head}" =~ ^[0-9a-f]{40}$ ]]
    printf '%s\n' "${head}"
  args:
    executable: /bin/bash
  become_user: "{{ ansible_user }}"
  register: repo_prev_head_release_result
  changed_when: false

- name: Validate the coordinator-sealed Pi3 source reference
  ansible.builtin.assert:
    that:
      - terminal_staged_source.keys() | list | sort == ['candidateSha', 'finalPath', 'host', 'previousSha', 'runId', 'schemaVersion', 'sha256', 'size']
      - terminal_staged_source.schemaVersion == 1
      - terminal_staged_source.runId is match('^[A-Za-z0-9][A-Za-z0-9_-]{2,79}$')
      - terminal_staged_source.host == inventory_hostname
      - terminal_staged_source.previousSha == repo_prev_head_release_result.stdout
      - terminal_staged_source.candidateSha == repo_version
      - terminal_staged_source.sha256 is match('^[0-9a-f]{64}$')
      - terminal_staged_source.size | int > 0
      - terminal_staged_source.size | int <= 67108864
      - terminal_staged_source.finalPath == '/var/tmp/raspi-pi3-source-' ~ terminal_staged_source.runId ~ '.bundle'
    fail_msg: >-
      Pi3 staged source must bind the exact run, host, previous SHA, candidate
      SHA, fixed path, bounded size, and SHA-256 before local import.

- name: Import and reset Pi3 repository from the verified local bundle
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../../../scripts/deploy/terminal-source-bundle.py
      consume
      --repository {{ repo_path | quote }}
      --run-id {{ terminal_staged_source.runId | quote }}
      --host {{ terminal_staged_source.host | quote }}
      --previous-sha {{ terminal_staged_source.previousSha | quote }}
      --candidate-sha {{ terminal_staged_source.candidateSha | quote }}
      --sha256 {{ terminal_staged_source.sha256 | quote }}
      --size {{ terminal_staged_source.size | string | quote }}
      --ansible-marker
  become_user: "{{ ansible_user }}"
  register: git_staged_release_result
  changed_when: true

- name: Select sealed signage repository synchronization result
  ansible.builtin.set_fact:
    git_result: "{{ git_staged_release_result }}"
