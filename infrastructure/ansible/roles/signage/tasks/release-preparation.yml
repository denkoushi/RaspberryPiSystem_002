---
# The signage profile consumes one coordinator-sealed zipapp. It never mutates
# or derives success from the legacy full-monorepo checkout.

- name: Validate sealed signage release artifact profile
  ansible.builtin.assert:
    that:
      - terminal_release_mode | default('full') == 'release-only'
      - "'signage' in group_names"
      - terminal_staged_source is defined
      - terminal_staged_source.keys() | list | sort == ['artifactSha256', 'finalPath', 'host', 'installPath', 'pathCount', 'pathManifestSha256', 'previousSha', 'profile', 'runId', 'schemaVersion', 'size', 'sourceSha']
      - terminal_staged_source.schemaVersion == 1
      - terminal_staged_source.profile == 'signage'
      - terminal_staged_source.runId is match('^[A-Za-z0-9][A-Za-z0-9_-]{2,79}$')
      - terminal_staged_source.host == inventory_hostname
      - terminal_staged_source.previousSha is match('^[0-9a-f]{40}$')
      - terminal_staged_source.sourceSha == repo_version
      - terminal_staged_source.artifactSha256 is match('^[0-9a-f]{64}$')
      - terminal_staged_source.pathManifestSha256 is match('^[0-9a-f]{64}$')
      - terminal_staged_source.pathCount | int > 0
      - terminal_staged_source.pathCount | int <= 32
      - terminal_staged_source.size | int > 0
      - terminal_staged_source.size | int <= 1048576
      - terminal_staged_source.finalPath == '/var/tmp/raspi-pi3-signage-' ~ terminal_staged_source.runId ~ '.pyz'
      - terminal_staged_source.installPath == '/usr/local/bin/raspi-signage-status-agent.pyz'
    fail_msg: >-
      Pi3 signage source must be one exact run/host/profile/SHA/digest/path
      manifest bound artifact. The legacy repository is not a release apply
      or verification authority.

- name: Install the verified local signage artifact atomically
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../../../scripts/deploy/signage-release-artifact.py
      consume
      --run-id {{ terminal_staged_source.runId | quote }}
      --host {{ terminal_staged_source.host | quote }}
      --profile {{ terminal_staged_source.profile | quote }}
      --source-sha {{ terminal_staged_source.sourceSha | quote }}
      --artifact-sha256 {{ terminal_staged_source.artifactSha256 | quote }}
      --path-manifest-sha256 {{ terminal_staged_source.pathManifestSha256 | quote }}
      --path-count {{ terminal_staged_source.pathCount | string | quote }}
      --size {{ terminal_staged_source.size | string | quote }}
      --ansible-marker
  register: signage_artifact_install_result
  changed_when: true

- name: Select sealed signage artifact synchronization result
  ansible.builtin.set_fact:
    git_result:
      changed: true
      artifactSha256: "{{ terminal_staged_source.artifactSha256 }}"
      sourceSha: "{{ terminal_staged_source.sourceSha }}"
