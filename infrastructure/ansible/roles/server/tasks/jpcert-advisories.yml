---
- name: Create JPCERT configuration directory
  ansible.builtin.file:
    path: /etc/jpcert-advisories
    state: directory
    owner: root
    group: "{{ ansible_user }}"
    mode: '0750'

- name: Create JPCERT state and log directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ jpcert_advisories_state_dir }}", mode: '0700'}
    - {path: "{{ jpcert_advisories_log_dir }}", mode: '0750'}

# Private API storage requires the collector to run as the same uid (1000).
- name: Read the collector login user identity
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Require a shared uid for private advisory jobs
  ansible.builtin.assert:
    that:
      - (api_runtime_uid | default(1000) | int) == 1000
      - (getent_passwd[ansible_user][1] | int) == (api_runtime_uid | default(1000) | int)
    fail_msg: The JPCERT collector and API must share uid 1000 for private advisory storage.

- name: Prepare private advisory job directories
  ansible.builtin.file:
    path: "{{ security_review_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ api_runtime_uid | default(1000) }}"
    group: "{{ api_runtime_gid | default(1000) }}"
    mode: '0700'
  loop: ['', advisories, advisories/pending, advisories/claimed, advisories/done, advisories/invalid]

- name: Inspect the Pi5 alerts inbox
  ansible.builtin.stat:
    path: "{{ security_review_kiosk_output_alerts_dir }}"
  register: jpcert_advisories_inbox

- name: Create the existing Pi5 alerts inbox when absent
  ansible.builtin.file:
    path: "{{ security_review_kiosk_output_alerts_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when: not jpcert_advisories_inbox.stat.exists

- name: Install JPCERT fetch script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/server/jpcert-advisories/fetch.py"
    dest: /usr/local/bin/jpcert-advisories-fetch.py
    owner: root
    group: root
    mode: '0755'

- name: Install repository-evidenced product rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/server/jpcert-advisories/rules.json"
    dest: /etc/jpcert-advisories/rules.json
    owner: root
    group: "{{ ansible_user }}"
    mode: '0640'

- name: Deliver JPCERT configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/jpcert-advisories-fetch.json.j2"
    dest: /etc/jpcert-advisories/fetch.json
    owner: root
    group: "{{ ansible_user }}"
    mode: '0640'

- name: Deliver JPCERT units
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/jpcert-advisories-fetch.{{ item }}.j2"
    dest: "/etc/systemd/system/jpcert-advisories-fetch.{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [service, timer]
  register: jpcert_advisories_units

- name: Reload JPCERT units
  ansible.builtin.systemd:
    daemon_reload: true
  when: jpcert_advisories_units is changed

- name: Apply JPCERT enable flag
  ansible.builtin.systemd:
    name: jpcert-advisories-fetch.timer
    enabled: "{{ jpcert_advisories_enabled | bool }}"
    state: "{{ jpcert_advisories_enabled | bool | ternary('started', 'stopped') }}"
  when: not (ansible_check_mode and jpcert_advisories_units is changed)
