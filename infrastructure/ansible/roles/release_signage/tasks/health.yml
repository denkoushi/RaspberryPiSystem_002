---
- name: Run Pi3 Signage release health checks
  ansible.builtin.import_tasks: health_checks.yml

- name: Record verified Pi3 Signage health
  ansible.builtin.set_fact:
    release_signage_healthy: true

# Runs only after the release is verified healthy. It has its own rescue, so
# it can never send a healthy Signage release into rollback.
- name: Watch the Pi3 SD card
  ansible.builtin.import_tasks: host-status-agent-storage.yml

# Host policy is post-health and survives application rollback.
- name: Converge the Pi3 Signage weekly OS security update policy
  block:
    - name: Apply the shared weekly OS security update policy
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../tasks/os-security-update.yml"
  rescue:
    - name: Report the unapplied OS security update policy without failing the release
      ansible.builtin.debug:
        msg: "Weekly OS security update policy was not applied on {{ inventory_hostname }}; the release continues. Reason: {{ (ansible_failed_result.msg | default('unknown') | string)[:300] }}"
