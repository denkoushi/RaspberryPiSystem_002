---
- name: Remove only newly pulled unused Pi4 candidates before any switch
  ansible.builtin.command:
    argv: [docker, image, rm, "{{ item.item }}"]
  loop: "{{ release_kiosk_pull.results | default([]) }}"
  register: release_kiosk_candidate_cleanup
  changed_when: release_kiosk_candidate_cleanup.rc == 0
  failed_when: false
  when:
    - item.changed | default(false) | bool
    - not (release_kiosk_switch_attempted | default(false) | bool)

- name: Require every removable Pi4 candidate cleanup to succeed
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: "Unused Pi4 candidate cleanup failed: {{ item.item.item }}"
  loop: "{{ release_kiosk_candidate_cleanup.results | default([]) }}"
  when: not (item.skipped | default(false) | bool)

- name: Remove Pi4 rollback image tags after a verified outcome
  ansible.builtin.command:
    argv:
      - docker
      - image
      - rm
      - "{{ release_kiosk_rollback_images[item] }}"
  loop: "{{ release_kiosk_captured_services | default([]) }}"
  register: release_kiosk_rollback_tag_cleanup
  changed_when: release_kiosk_rollback_tag_cleanup.rc == 0
  failed_when: false
  when: >-
    release_kiosk_healthy | default(false) | bool
    or release_kiosk_rolled_back | default(false) | bool
    or not (release_kiosk_switch_attempted | default(false) | bool)

- name: Remove this run's Pi4 file backups after a verified outcome
  ansible.builtin.file:
    path: "{{ item.backup_file }}"
    state: absent
  loop: "{{ release_kiosk_install.results | default([]) }}"
  no_log: true
  when:
    - item.changed | default(false) | bool
    - item.backup_file is defined
    - >-
      release_kiosk_healthy | default(false) | bool
      or release_kiosk_rolled_back | default(false) | bool
      or not (release_kiosk_switch_attempted | default(false) | bool)

- name: Remove the Pi4 run-scoped staging directory
  ansible.builtin.file:
    path: "{{ release_kiosk_run_dir }}"
    state: absent
  when:
    - release_kiosk_run_dir is defined
    - >-
      release_kiosk_healthy | default(false) | bool
      or release_kiosk_rolled_back | default(false) | bool
      or not (release_kiosk_switch_attempted | default(false) | bool)
