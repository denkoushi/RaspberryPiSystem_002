---
- name: Remove the Web-only transient activation unit after a terminal outcome
  ansible.builtin.command:
    argv:
      - python3
      - "{{ release_kiosk_stage_dir }}/terminal-runtime-manifest.py"
      - cleanup-kiosk-web-activation
      - --root
      - "{{ release_kiosk_runtime_manifest_root }}"
      - --run-id
      - "{{ release_run_id }}"
      - --host
      - "{{ inventory_hostname }}"
      - --expected-manifest-sha256
      - "{{ release_kiosk_web_manifest_sha256 }}"
  register: release_kiosk_web_activation_cleanup_final
  changed_when: true
  when:
    - release_kiosk_services | length == 0
    - release_kiosk_web_manifest_sha256 is defined
    - >-
      release_kiosk_healthy | default(false) | bool
      or release_kiosk_rolled_back | default(false) | bool

- name: Finalize the Web-only runtime manifest without touching agent images
  ansible.builtin.command:
    argv:
      - python3
      - "{{ release_kiosk_stage_dir }}/terminal-runtime-manifest.py"
      - cleanup
      - --root
      - "{{ release_kiosk_runtime_manifest_root }}"
      - --run-id
      - "{{ release_run_id }}"
      - --host
      - "{{ inventory_hostname }}"
      - --expected-manifest-sha256
      - "{{ release_kiosk_web_manifest_sha256 }}"
      - --outcome
      - "{{ 'restored' if (release_kiosk_rolled_back | default(false) | bool) else 'committed' }}"
  register: release_kiosk_web_manifest_cleanup
  changed_when: true
  when:
    - release_kiosk_services | length == 0
    - release_kiosk_web_manifest_sha256 is defined
    - >-
      release_kiosk_healthy | default(false) | bool
      or release_kiosk_rolled_back | default(false) | bool

- name: Close the successful Web-only Pi5 deploy-status client entry
  ansible.builtin.command:
    argv:
      - python3
      - "{{ release_kiosk_pi5_status_state_helper }}"
      - --file
      - "{{ release_kiosk_pi5_status_file }}"
      - remove-client
      - --run-id
      - "{{ release_run_id }}"
      - --client
      - "{{ status_agent_client_id }}"
  delegate_to: "{{ groups['server'][0] }}"
  become: true
  register: release_kiosk_web_status_success_cleanup
  changed_when: true
  no_log: true
  when:
    - release_kiosk_services | length == 0
    - release_kiosk_healthy | default(false) | bool
    - not (release_kiosk_rolled_back | default(false) | bool)

- name: Remove only newly pulled unused Pi4 candidates before any switch
  ansible.builtin.command:
    argv: [docker, image, rm, "{{ item.item }}"]
  loop: "{{ release_kiosk_pull.results | default([]) }}"
  register: release_kiosk_candidate_cleanup
  changed_when: release_kiosk_candidate_cleanup.rc == 0
  failed_when: false
  when:
    - item.changed | default(false) | bool
    - not (release_kiosk_switch_attempted | default(false) | bool)

- name: Require every removable Pi4 candidate cleanup to succeed
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: "Unused Pi4 candidate cleanup failed: {{ item.item.item }}"
  loop: "{{ release_kiosk_candidate_cleanup.results | default([]) }}"
  when: not (item.skipped | default(false) | bool)

- name: Remove Pi4 rollback image tags after a verified outcome
  ansible.builtin.command:
    argv:
      - docker
      - image
      - rm
      - "{{ release_kiosk_rollback_images[item] }}"
  loop: "{{ release_kiosk_captured_services | default([]) }}"
  register: release_kiosk_rollback_tag_cleanup
  changed_when: release_kiosk_rollback_tag_cleanup.rc == 0
  failed_when: false
  when: >-
    release_kiosk_healthy | default(false) | bool
    or release_kiosk_rolled_back | default(false) | bool
    or not (release_kiosk_switch_attempted | default(false) | bool)

- name: Remove this run's Pi4 file backups after a verified outcome
  ansible.builtin.file:
    path: "{{ item.backup_file }}"
    state: absent
  loop: "{{ release_kiosk_install.results | default([]) }}"
  no_log: true
  when:
    - item.changed | default(false) | bool
    - item.backup_file is defined
    - >-
      release_kiosk_healthy | default(false) | bool
      or release_kiosk_rolled_back | default(false) | bool
      or not (release_kiosk_switch_attempted | default(false) | bool)

- name: Remove the Pi4 run-scoped staging directory
  ansible.builtin.file:
    path: "{{ release_kiosk_run_dir }}"
    state: absent
  when:
    - release_kiosk_run_dir is defined
    - >-
      release_kiosk_web_manifest_sha256 is not defined
      or release_kiosk_healthy | default(false) | bool
      or release_kiosk_rolled_back | default(false) | bool
