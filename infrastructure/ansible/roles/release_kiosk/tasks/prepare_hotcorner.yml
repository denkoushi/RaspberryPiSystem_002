---
- name: Read the kiosk user's runtime UID
  ansible.builtin.command:
    argv: [id, -u, '{{ ansible_user }}']
  register: release_kiosk_user_uid
  changed_when: false

- name: Read the kiosk user's primary group
  ansible.builtin.command:
    argv: [id, -g, '{{ ansible_user }}']
  register: release_kiosk_user_gid
  changed_when: false

- name: Capture the previous hotcorner service state
  ansible.builtin.service_facts:

- name: Remember the previous hotcorner service state
  ansible.builtin.set_fact:
    release_kiosk_hotcorner_previous: "{{ ansible_facts.services.get('kiosk-hotcorner.service', {}) }}"
    release_kiosk_hotcorner_start_attempted: false
    release_kiosk_labwc_edit_attempted: false
    release_kiosk_labwc_dir: "/home/{{ ansible_user }}/.config/labwc"

- name: Capture the original labwc directory metadata
  ansible.builtin.stat:
    path: "{{ release_kiosk_labwc_dir }}"
  register: release_kiosk_labwc_directory_original

- name: Capture the original labwc configuration metadata
  ansible.builtin.stat:
    path: "{{ release_kiosk_labwc_dir }}/rc.xml"
  register: release_kiosk_labwc_original

- name: Require an existing labwc configuration before staging
  ansible.builtin.assert:
    that:
      - release_kiosk_labwc_original.stat.isreg | default(false)
    fail_msg: An existing labwc rc.xml is required for the kiosk panel release.

- name: Back up the original labwc configuration before editing
  ansible.builtin.copy:
    src: "{{ release_kiosk_labwc_dir }}/rc.xml"
    dest: "{{ release_kiosk_stage_dir }}/rc.xml.original"
    remote_src: true
    owner: root
    group: root
    mode: '0600'

- name: Stage the hotcorner programs and labwc autostart
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ release_kiosk_stage_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - {src: kiosk-hotcorner.py, dest: kiosk-hotcorner.py}
    - {src: kiosk-labwc-config.py, dest: kiosk-labwc-config.py}
    - {src: labwc-autostart, dest: labwc-autostart}

- name: Stage the hotcorner service
  ansible.builtin.template:
    src: kiosk-hotcorner.service.j2
    dest: "{{ release_kiosk_stage_dir }}/kiosk-hotcorner.service"
    owner: root
    group: root
    mode: '0644'

- name: Stage the shared panel shortcut
  ansible.builtin.template:
    src: "{{ role_path }}/../kiosk/templates/show-kiosk-panel.sh.j2"
    dest: "{{ release_kiosk_stage_dir }}/show-kiosk-panel.sh"
    owner: root
    group: root
    mode: '0755'
