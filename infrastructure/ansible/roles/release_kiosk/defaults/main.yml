---
release_sha: ""
release_run_id: ""
release_kiosk_project_dir: "{{ project_root | default(repo_path | default('/opt/RaspberryPiSystem_002')) }}"
release_kiosk_run_root: /var/lib/raspi-release/standard
release_kiosk_runtime_manifest_root: /var/lib/raspi-release/rollback-runtime
release_kiosk_deploy_status_url: "{{ status_agent_api_base_url | default(api_base_url) }}/system/deploy-status"
release_kiosk_pi5_project_dir: "{{ hostvars[groups['server'][0]].release_pi5_project_dir | default(project_root | default('/opt/RaspberryPiSystem_002')) }}"
release_kiosk_pi5_status_state_helper: "{{ release_kiosk_pi5_project_dir }}/scripts/deploy/deploy-status-state.py"
release_kiosk_pi5_status_file: "{{ release_kiosk_pi5_project_dir }}/config/deploy-status.json"
release_kiosk_compose_project: docker
release_kiosk_existing_compose: "{{ release_kiosk_project_dir }}/infrastructure/docker/docker-compose.client.yml"
release_kiosk_nfc_image: "ghcr.io/denkoushi/raspisys-nfc-agent:{{ release_sha }}"
release_kiosk_barcode_image: "ghcr.io/denkoushi/raspisys-barcode-agent:{{ release_sha }}"
release_kiosk_torque_image: "ghcr.io/denkoushi/raspisys-torque-agent:{{ release_sha }}"
release_kiosk_agent_services:
  - nfc-agent
  - barcode-agent
  - torque-agent
release_kiosk_services: []
release_kiosk_min_disk_gb: 1
