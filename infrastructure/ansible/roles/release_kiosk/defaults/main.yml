---
release_sha: ""
release_run_id: ""
release_kiosk_project_dir: "{{ project_root | default(repo_path | default('/opt/RaspberryPiSystem_002')) }}"
release_kiosk_run_root: /var/lib/raspi-release/standard
release_kiosk_compose_project: docker
release_kiosk_existing_compose: "{{ release_kiosk_project_dir }}/infrastructure/docker/docker-compose.client.yml"
release_kiosk_nfc_image: "ghcr.io/denkoushi/raspisys-nfc-agent:{{ release_sha }}"
release_kiosk_barcode_image: "ghcr.io/denkoushi/raspisys-barcode-agent:{{ release_sha }}"
release_kiosk_torque_image: "ghcr.io/denkoushi/raspisys-torque-agent:{{ release_sha }}"
release_kiosk_min_disk_gb: 1
