---
# Agents enabled on this Pi4. This lives in role vars (not defaults) so an
# inventory value of the same name cannot override it; both the release and the
# agent coverage check read it, so they cannot drift apart.
# Inputs (nfc_agent_client_id, barcode_agent_enabled, torque_agent_enabled) must be literals; scripts/ci/tests/test_agent_guard_inputs_literal.py enforces it.
release_kiosk_enabled_agent_services: >-
  {{
    (['nfc-agent'] if (nfc_agent_client_id | default('') | string | length > 0) else [])
    + (['barcode-agent'] if (barcode_agent_enabled | default(false) | bool) else [])
    + (['torque-agent'] if (torque_agent_enabled | default(false) | bool) else [])
  }}

# The Pi4 agent services this role knows (same as PI4_AGENT_SERVICES in scripts/deploy/release_artifact_contract.py).
release_kiosk_known_agent_services:
  - nfc-agent
  - barcode-agent
  - torque-agent
release_kiosk_agent_images:
  nfc-agent: "{{ release_kiosk_nfc_image }}"
  barcode-agent: "{{ release_kiosk_barcode_image }}"
  torque-agent: "{{ release_kiosk_torque_image }}"
