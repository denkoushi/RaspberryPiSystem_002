---
- name: Require the recovery-scoped OAuth credential
  ansible.builtin.assert:
    that:
      - tailscale_recovery_oauth_client_id | default('') | string | trim | length > 0
      - tailscale_recovery_oauth_client_secret | default('') | string | trim | length > 0
      - tailscale_recovery_oauth_tag == 'tag:kiosk'
      - tailscale_recovery_oauth_auth_key_expiry_seconds | int == 600
    fail_msg: >-
      Pi5 recovery OAuth credentials are missing or the recovery tag/key
      lifetime differs from the approved recovery contract.
  no_log: true
- name: Request a scoped Tailscale OAuth access token on Pi5
  ansible.builtin.uri:
    url: "{{ tailscale_recovery_oauth_base_url }}/api/v2/oauth/token"
    method: POST
    body_format: form-urlencoded
    body:
      client_id: "{{ tailscale_recovery_oauth_client_id }}"
      client_secret: "{{ tailscale_recovery_oauth_client_secret }}"
      grant_type: client_credentials
      scope: auth_keys
      tags: "{{ tailscale_recovery_oauth_tag }}"
    return_content: true
    status_code: [200]
    timeout: 15
  register: tailscale_recovery_oauth_token_response
  delegate_to: localhost
  become: false
  failed_when: false
  until: >-
    (tailscale_recovery_oauth_token_response.status | default(0) | int)
    not in tailscale_recovery_oauth_transient_statuses
  retries: "{{ tailscale_recovery_oauth_retry_attempts }}"
  delay: "{{ tailscale_recovery_oauth_retry_delay_seconds }}"
  no_log: true

- name: Require a valid scoped OAuth access token response
  ansible.builtin.assert:
    that:
      - tailscale_recovery_oauth_token_response.status | default(0) | int == 200
      - tailscale_recovery_oauth_token_response.json is mapping
      - tailscale_recovery_oauth_token_response.json.access_token is defined
      - tailscale_recovery_oauth_token_response.json.access_token | string | length > 0
      - tailscale_recovery_oauth_token_response.json.token_type | default('') | lower == 'bearer'
    fail_msg: Pi5 could not obtain a valid Tailscale recovery OAuth access token.
  no_log: true

- name: Create a one-use non-ephemeral preauthorized kiosk auth key on Pi5
  ansible.builtin.uri:
    url: "{{ tailscale_recovery_oauth_base_url }}/api/v2/tailnet/-/keys"
    method: POST
    headers:
      Authorization: "Bearer {{ tailscale_recovery_oauth_token_response.json.access_token }}"
      Content-Type: application/json
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: false
            ephemeral: false
            preauthorized: true
            tags:
              - "{{ tailscale_recovery_oauth_tag }}"
      expirySeconds: "{{ tailscale_recovery_oauth_auth_key_expiry_seconds | int }}"
    return_content: true
    status_code: [200]
    timeout: 15
  register: tailscale_recovery_oauth_key_response
  delegate_to: localhost
  become: false
  failed_when: false
  until: >-
    (tailscale_recovery_oauth_key_response.status | default(0) | int)
    not in tailscale_recovery_oauth_transient_statuses
  retries: "{{ tailscale_recovery_oauth_retry_attempts }}"
  delay: "{{ tailscale_recovery_oauth_retry_delay_seconds }}"
  no_log: true

- name: Require the exact one-use kiosk auth key contract
  ansible.builtin.assert:
    that:
      - tailscale_recovery_oauth_key_response.status | default(0) | int == 200
      - tailscale_recovery_oauth_key_response.json is mapping
      - tailscale_recovery_oauth_key_response.json.key is defined
      - tailscale_recovery_oauth_key_response.json.key | string | length > 0
      - tailscale_recovery_oauth_key_response.json.capabilities.devices.create.reusable | bool == false
      - tailscale_recovery_oauth_key_response.json.capabilities.devices.create.ephemeral | bool == false
      - tailscale_recovery_oauth_key_response.json.capabilities.devices.create.preauthorized | bool
      - tailscale_recovery_oauth_key_response.json.capabilities.devices.create.tags | list == [tailscale_recovery_oauth_tag]
    fail_msg: Tailscale returned an auth key outside the approved recovery capabilities.
  no_log: true

- name: Supply only the one-use auth key to the disconnected recovery host
  ansible.builtin.set_fact:
    tailscale_effective_auth_key: "{{ tailscale_recovery_oauth_key_response.json.key }}"
  no_log: true
