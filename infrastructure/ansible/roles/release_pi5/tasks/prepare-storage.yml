---
- name: Inspect the opt-in primary replication marker before standard deployment
  ansible.builtin.stat:
    path: "{{ release_pi5_project_dir }}/config/pi5-replication-primary"
  register: release_pi5_replication_marker

# This route does not carry the replication overlay. Fail before Compose or
# storage mutation rather than risk silently recreating db without the overlay.
- name: Stop standard deployment when primary replication requires its overlay
  ansible.builtin.assert:
    that:
      - not release_pi5_replication_marker.stat.exists
    fail_msg: >-
      Primary replication is marked applied or incomplete. Standard deployment
      does not carry docker-compose.replication-primary.yml. Stop here; an
      operator must explicitly remove replication with pi5-replication.sh
      remove --yes before using this deployment route.

- name: Prepare the shared Pi5 durable storage directories before any Compose command
  ansible.builtin.include_role:
    name: pi5_storage
  vars:
    pi5_storage_root: "{{ release_pi5_project_dir }}/storage"
    pi5_storage_manage_existing: false

# The haizen app directory holds only APKs published from the Mac, so a
# root-owned copy left by an earlier Docker bind mount is safe to correct.
- name: Prepare the haizen app publish directory before any Compose command
  ansible.builtin.file:
    path: "{{ release_pi5_project_dir }}/storage/haizen-app"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Materialize and validate all phase3 external durable volumes
  ansible.builtin.command:
    argv:
      - python3
      - "{{ release_pi5_volume_materializer_script }}"
      - --server-compose
      - "{{ release_pi5_server_compose_file }}"
      - --phase3-compose
      - "{{ release_pi5_compose_file }}"
      - --env-file
      - "{{ release_pi5_env_file }}"
  environment: "{{ release_pi5_compose_environment }}"
  register: release_pi5_volume_materialization
  changed_when: "'created volume ' in release_pi5_volume_materialization.stdout"

- name: Record Pi5 storage as prepared for this release
  ansible.builtin.set_fact:
    release_pi5_storage_prepared_run_id: "{{ release_run_id }}"
