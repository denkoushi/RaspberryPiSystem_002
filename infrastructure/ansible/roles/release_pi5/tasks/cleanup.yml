---
- name: Remove an incomplete fresh Pi5 candidate before traffic switch
  ansible.builtin.command:
    argv: "{{ (release_pi5_compose_argv | default([])) + ['rm', '-f', '-s', 'api-' + (release_pi5_slot | default('')), 'web-' + (release_pi5_slot | default(''))] }}"
  environment: "{{ release_pi5_compose_environment | default({}) }}"
  changed_when: true
  when:
    - release_pi5_start_attempted | default(false) | bool
    - not (release_pi5_switch_attempted | default(false) | bool)
    - not (release_pi5_healthy | default(false) | bool)
    - not (release_pi5_rolled_back | default(false) | bool)
    - release_pi5_route | default('') == 'fresh'
    - release_pi5_slot | default('') in ['blue', 'green']

- name: Find the business Hermes container after a failed fresh release
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --filter
      - "label=com.docker.compose.project={{ release_pi5_compose_project }}"
      - --filter
      - label=com.docker.compose.service=business-hermes
      - --format
      - "{{ '{{.ID}}' }}"
  register: release_pi5_business_hermes_after_failure
  changed_when: false
  when:
    - release_pi5_business_hermes_start_attempted | default(false) | bool
    - not (release_pi5_healthy | default(false) | bool)
    - release_pi5_route | default('') == 'fresh'

- name: Inspect business Hermes running state after a failed fresh release
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{.State.Running}}' }}"
      - "{{ release_pi5_business_hermes_after_failure.stdout | trim }}"
  register: release_pi5_business_hermes_after_failure_state
  changed_when: false
  when:
    - release_pi5_business_hermes_start_attempted | default(false) | bool
    - not (release_pi5_healthy | default(false) | bool)
    - release_pi5_route | default('') == 'fresh'
    - release_pi5_business_hermes_after_failure.stdout | trim | length > 0

- name: Stop a business Hermes runtime that was previously stopped
  ansible.builtin.command:
    argv: [docker, stop, "{{ release_pi5_business_hermes_after_failure.stdout | trim }}"]
  changed_when: true
  when:
    - release_pi5_business_hermes_start_attempted | default(false) | bool
    - not (release_pi5_healthy | default(false) | bool)
    - release_pi5_route | default('') == 'fresh'
    - release_pi5_business_hermes_existing_id | default('') | trim | length > 0
    - not (release_pi5_business_hermes_existing_running | default(false) | bool)
    - release_pi5_business_hermes_after_failure_state.stdout | default('false') | trim == 'true'

- name: Remove a business Hermes runtime created by a failed fresh release
  ansible.builtin.command:
    argv: [docker, rm, --force, "{{ release_pi5_business_hermes_after_failure.stdout | trim }}"]
  changed_when: true
  when:
    - release_pi5_business_hermes_start_attempted | default(false) | bool
    - not (release_pi5_healthy | default(false) | bool)
    - release_pi5_route | default('') == 'fresh'
    - release_pi5_business_hermes_existing_id | default('') | trim | length == 0
    - release_pi5_business_hermes_after_failure.stdout | trim | length > 0

- name: Remove previous Pi5 slot only after committed healthy handoff
  ansible.builtin.command:
    argv: "{{ (release_pi5_compose_argv | default([])) + ['rm', '-f', '-s', 'api-' + (release_pi5_previous_slot | default('')), 'web-' + (release_pi5_previous_slot | default(''))] }}"
  environment: "{{ release_pi5_compose_environment | default({}) }}"
  changed_when: true
  when:
    - release_pi5_healthy | default(false) | bool
    - >-
      release_pi5_route | default('') in ['fresh', 'interrupted']
      or (release_pi5_route | default('') == 'settled'
          and (release_pi5_opposite_api_id | default('') | length > 0
               or release_pi5_opposite_web_id | default('') | length > 0))

- name: Remove failed Pi5 candidate only after verified rollback
  ansible.builtin.command:
    argv: "{{ (release_pi5_compose_argv | default([])) + ['rm', '-f', '-s', 'api-' + (release_pi5_slot | default('')), 'web-' + (release_pi5_slot | default(''))] }}"
  environment: "{{ release_pi5_compose_environment | default({}) }}"
  changed_when: true
  when: release_pi5_rolled_back | default(false) | bool

- name: Remove staged Pi5 route after a verified outcome
  ansible.builtin.file:
    path: "{{ release_pi5_staged_config }}"
    state: absent
  when: >-
    release_pi5_healthy | default(false) | bool
    or release_pi5_rolled_back | default(false) | bool

- name: Remove private Pi5 candidate run files after a verified outcome
  ansible.builtin.file:
    path: "{{ release_pi5_run_dir }}"
    state: absent
  when: >-
    release_pi5_healthy | default(false) | bool
    or release_pi5_rolled_back | default(false) | bool
