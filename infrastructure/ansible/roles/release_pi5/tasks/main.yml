---
- name: Evaluate the standard Pi5 release lifecycle
  block:
    - name: Prepare the inactive Pi5 candidate
      ansible.builtin.import_tasks: prepare.yml

    - name: Apply the explicitly requested settled Hermes search trial maintenance
      ansible.builtin.import_tasks: hermes-search-trial-maintenance-run.yml
      when: release_pi5_trial_maintenance | default('') in ['on', 'off']

    - name: Switch Pi5 traffic from a fresh release
      ansible.builtin.import_tasks: switch.yml
      when: release_pi5_route == 'fresh'

    - name: Start consultation Hermes against the newly activated API
      ansible.builtin.import_tasks: business-hermes-chat-start.yml
      when:
        - release_pi5_route == 'fresh'
        - business_hermes_chat_enabled | default(false) | bool

    - name: Verify isolated egress mounts before committing Pi5 traffic
      ansible.builtin.import_tasks: business-hermes-egress-health.yml
      when: release_pi5_egress_artifacts is defined

    - name: Verify the bounded Pi5 stability samples
      ansible.builtin.import_tasks: health.yml

    - name: Commit the Pi5 scheduler handoff
      ansible.builtin.import_tasks: commit.yml
  rescue:
    - name: Attempt consultation restoration without bypassing API rollback
      when: release_pi5_chat_prepared | default(false) | bool
      block:
        - name: Restore the consultation runtime before the previous API
          ansible.builtin.include_tasks: business-hermes-chat-rollback.yml
      rescue:
        - name: Record consultation restoration failure for operator recovery
          ansible.builtin.set_fact:
            release_pi5_chat_rollback_failed: true
        - name: Report consultation restoration failure while continuing API rollback
          ansible.builtin.debug:
            msg: Consultation runtime restoration failed; preserve backups and inspect the failed task. Continuing standard API rollback.

    - name: Restore the previous answer cache without bypassing API rollback
      when: release_pi5_answer_cache_started | default(false) | bool
      block:
        - name: Restore the previous answer cache service
          ansible.builtin.include_tasks: business-hermes-answer-cache-rollback.yml
      rescue:
        - name: Record answer cache restoration failure
          ansible.builtin.set_fact:
            release_pi5_answer_cache_rollback_failed: true
        - name: Report cache restoration failure and continue API rollback
          ansible.builtin.debug:
            msg: Answer cache restoration failed. Preserve previous image and data; continuing standard API rollback.

    - name: Restore the previous Pi5 route and scheduler
      ansible.builtin.import_tasks: rollback.yml
  always:
    - name: Remove only safely retired Pi5 containers and run files
      ansible.builtin.import_tasks: cleanup.yml
