---
- name: Validate the Pi5 release contract
  ansible.builtin.assert:
    that:
      - release_sha is match('^[0-9a-f]{40}$')
      - release_run_id is match('^[A-Za-z0-9][A-Za-z0-9_-]{2,79}$')
      - release_sha in release_pi5_api_image
      - release_sha in release_pi5_web_image
      - release_pi5_api_image != release_pi5_web_image
    fail_msg: >-
      Pi5 requires one full release SHA, a safe run ID, and distinct immutable
      API/Web image references containing that SHA.

- name: Define the Pi5 run-scoped paths
  ansible.builtin.set_fact:
    release_pi5_run_dir: "{{ release_pi5_run_root }}/{{ release_run_id }}"
    release_pi5_switch_attempted: false
    release_pi5_switched: false
    release_pi5_healthy: false

- name: Create the private Pi5 run directory
  ansible.builtin.file:
    path: "{{ release_pi5_run_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Pull immutable Pi5 candidate images while the active slot is live
  ansible.builtin.command:
    argv:
      - docker
      - image
      - pull
      - "{{ item }}"
  loop:
    - "{{ release_pi5_api_image }}"
    - "{{ release_pi5_web_image }}"
  register: release_pi5_pull
  changed_when: >-
    'Downloaded newer image' in release_pi5_pull.stdout
    or 'Pull complete' in release_pi5_pull.stdout

- name: Read immutable Pi5 candidate image IDs
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - --format
      - "{{ '{{.Id}}' }}"
      - "{{ item }}"
  loop:
    - "{{ release_pi5_api_image }}"
    - "{{ release_pi5_web_image }}"
  register: release_pi5_image_ids
  changed_when: false

- name: Require valid Pi5 image IDs
  ansible.builtin.assert:
    that:
      - release_pi5_image_ids.results | length == 2
      - release_pi5_image_ids.results[0].stdout is match('^sha256:[0-9a-f]{64}$')
      - release_pi5_image_ids.results[1].stdout is match('^sha256:[0-9a-f]{64}$')
    fail_msg: Pi5 candidate images did not resolve to immutable Docker image IDs.

- name: Read current Pi5 memory and disk while traffic stays live
  ansible.builtin.shell: |
    set -euo pipefail
    memory_mb="$(awk '/MemAvailable:/ {print int($2 / 1024)}' /proc/meminfo)"
    disk_gb="$(df -Pk "{{ release_pi5_project_dir }}" | awk 'NR == 2 {print int($4 / 1024 / 1024)}')"
    printf '{"memoryMb":%s,"diskGb":%s}\n' "${memory_mb}" "${disk_gb}"
  args:
    executable: /bin/bash
  register: release_pi5_capacity_sample
  changed_when: false

- name: Parse the current Pi5 memory and disk values
  ansible.builtin.set_fact:
    release_pi5_capacity: "{{ release_pi5_capacity_sample.stdout | from_json }}"

- name: Require enough Pi5 memory and disk for inactive-slot preparation
  ansible.builtin.assert:
    that:
      - release_pi5_capacity.memoryMb | int >= release_pi5_min_memory_mb | int
      - release_pi5_capacity.diskGb | int >= release_pi5_min_disk_gb | int
    fail_msg: >-
      Pi5 lacks the current memory or disk headroom required to prepare an
      inactive candidate while the active slot remains live.

- name: Wait for Pi5 load to settle after image preparation
  ansible.builtin.shell: |
    set -euo pipefail
    cpu_count="$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc)"
    max_load="$(awk "BEGIN {printf \"%.2f\", ${cpu_count} * 0.75}")"
    load="$(cut -d' ' -f1 /proc/loadavg)"
    printf '{"load":%s,"maxLoad":%s}\n' "${load}" "${max_load}"
  args:
    executable: /bin/bash
  register: release_pi5_load_sample
  changed_when: false
  retries: 30
  delay: 10
  until: >-
    (release_pi5_load_sample.stdout | from_json).load | float
    < (release_pi5_load_sample.stdout | from_json).maxLoad | float

- name: Check the live Prisma ledger against the candidate source directly
  ansible.builtin.shell: |
    set -euo pipefail
    project={{ release_pi5_project_dir | quote }}
    state="${project}/logs/deploy/pi5-blue-green-state.json"
    ledger="$(mktemp "${TMPDIR:-/tmp}/pi5-standard-ledger.XXXXXX")"
    trap 'rm -f "${ledger}"' EXIT
    active="$(python3 - "${state}" <<'PY'
    import json, sys
    with open(sys.argv[1], encoding="utf-8") as stream:
        slot = json.load(stream).get("activeSlot")
    if slot not in {"blue", "green"}:
        raise SystemExit("Blue/Green state has no active slot")
    print(slot)
    PY
    )"
    container="$(docker ps -q \
      --filter "label=com.docker.compose.project=bluegreen" \
      --filter "label=com.docker.compose.service=api-${active}")"
    [[ -n "${container}" ]]
    base_image="$(docker inspect -f '{{ '{{.Config.Image}}' }}' "${container}")"
    base_sha="$(python3 - "${base_image}" <<'PY'
    import re, sys
    matches = re.findall(r"(?<![0-9a-f])([0-9a-f]{40})(?![0-9a-f])", sys.argv[1].lower())
    if len(matches) != 1:
        raise SystemExit("active image has no unique source SHA")
    print(matches[0])
    PY
    )"
    docker exec "${container}" sh -lc \
      'PGCONNECT_TIMEOUT=10 psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -AtF "|" -c "SELECT migration_name, checksum FROM \"_prisma_migrations\" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name"' \
      >"${ledger}"
    python3 "${project}/scripts/deploy/validate-expand-only-migrations.py" \
      --applied-checksums "${ledger}" \
      --repository "${project}" \
      --base-ref "${base_sha}" \
      --candidate-ref {{ release_sha | quote }} \
      --migration-root apps/api/prisma/migrations
  args:
    executable: /bin/bash
  changed_when: false

- name: Prepare and validate the inactive Pi5 slot
  ansible.builtin.command:
    argv:
      - "{{ release_pi5_project_dir }}/scripts/deploy/pi5-blue-green.sh"
      - prepare
      - --api-image
      - "{{ release_pi5_api_image }}"
      - --web-image
      - "{{ release_pi5_web_image }}"
  changed_when: true
