---
release_sha: ""
release_run_id: ""
release_pi5_api_image: ""
release_pi5_web_image: ""
release_pi5_project_dir: "{{ pi5_project_dir | default(repo_path | default('/opt/RaspberryPiSystem_002')) }}"
release_pi5_run_root: /var/lib/raspi-release/standard
release_pi5_retention_state_dir: /var/lib/raspi-release
release_pi5_retention_state_path: "{{ release_pi5_retention_state_dir }}/image-retention.json"
release_pi5_retention_state_tmp: "{{ release_pi5_retention_state_path }}.{{ release_run_id }}.tmp"
release_pi5_compose_project: bluegreen
release_pi5_env_file: "{{ release_pi5_project_dir }}/infrastructure/docker/.env"
release_pi5_server_compose_file: "{{ release_pi5_project_dir }}/infrastructure/docker/docker-compose.server.yml"
release_pi5_volume_materializer_script: "{{ release_pi5_project_dir }}/scripts/deploy/pi5_volume_materializer.py"
release_pi5_compose_file: "{{ release_pi5_project_dir }}/infrastructure/docker/docker-compose.phase3.yml"
release_pi5_migration_compose_file: "{{ release_pi5_project_dir }}/infrastructure/docker/docker-compose.phase3.migration.yml"
release_pi5_compose_argv:
  - docker
  - compose
  - -p
  - "{{ release_pi5_compose_project }}"
  - --env-file
  - "{{ release_pi5_env_file }}"
  - -f
  - "{{ release_pi5_compose_file }}"
release_pi5_migration_argv:
  - docker
  - compose
  - -p
  - "{{ release_pi5_compose_project }}"
  - --env-file
  - "{{ release_pi5_env_file }}"
  - -f
  - "{{ release_pi5_compose_file }}"
  - -f
  - "{{ release_pi5_migration_compose_file }}"
release_pi5_gateway_config_dir: "{{ release_pi5_project_dir }}/logs/deploy/bluegreen"
# Reuse the established explicit TLS source. Tests may pass the existing HTTP
# template explicitly; the role never infers a mode from Caddyfile contents.
release_pi5_gateway_template: "{{ release_pi5_project_dir }}/infrastructure/docker/Caddyfile.gateway.template"
# The gateway imports this file as /srv/bluegreen/admin-allow-nets.caddy.
release_pi5_admin_allow_file: "{{ release_pi5_gateway_config_dir }}/admin-allow-nets.caddy"
release_pi5_api_health_url: https://127.0.0.1/api/system/health
release_pi5_web_health_url: https://127.0.0.1/
release_pi5_validate_certs: false
release_pi5_min_memory_mb: 768
release_pi5_min_disk_gb: 10
release_pi5_health_sample_count: 5
release_pi5_health_interval_seconds: 10
release_pi5_compose_wait_seconds: 180
release_pi5_load_retries: 30
release_pi5_load_delay: 10
release_pi5_business_hermes_enabled: "{{ business_hermes_enabled | default(false) }}"
release_pi5_business_hermes_image: "{{ business_hermes_image | default('nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d') }}"
release_pi5_business_hermes_egress_image: "{{ business_hermes_egress_image | default('node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53') }}"

# Both Hermes services may replace approved predecessor images with the release pin;
# any other differing image is still refused.
release_pi5_business_hermes_replaceable_images:
  - "nousresearch/hermes-agent:latest@sha256:23d7fdefc42ef4f874938835dcc9543468b45c3fe082415095ab48056c56c32a"

# Both egress services may replace approved predecessor images with the release pin;
# any other differing image is still refused.
release_pi5_business_hermes_egress_replaceable_images:
  - "node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293"

release_pi5_chat_env_file: "{{ business_hermes_chat_runtime_env_file | default('/etc/raspi-business-hermes-chat/runtime.env') | dirname }}/compose.env"
release_pi5_answer_cache_image: ""
release_pi5_answer_cache_dir: "{{ release_pi5_project_dir }}/storage/hermes-search/answer-cache"
