all:
  children:
    # 独立配備。clients 配下に入れず、zero-edge.yml --limit で更新する。
    zero_edge:
      hosts: {}
      # hosts に追加する例:
      #   zero-edge-1:
      #     ansible_host: 192.0.2.10
      #     ansible_user: pi
      #     status_agent_client_id: zero-edge-1
      #     zero_edge_client_key: "{{ vault_zero_edge_client_key }}"
      vars:
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
        ansible_python_interpreter: /usr/bin/python3
        zero_edge_api_base_url: "{{ api_base_url | regex_replace('/api/?$', '') }}"
        zero_edge_tls_skip_verify: "1"
        status_agent_api_base_url: "{{ api_base_url }}"
        status_agent_tls_skip_verify: "{{ zero_edge_tls_skip_verify }}"

