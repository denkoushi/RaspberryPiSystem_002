---
# The Pi-side keep-warm timer was retired in favour of the Control Plane's
# central Lease-aware keep-warm. This directory still ships the DGX runtime
# client and env that the tools/research/novel profiles and the interest
# editorial read. The installed timer unit is left on the host (disabled) so
# the Control Plane rollback can re-enable it.
- name: Ensure Hermes DGX runtime client directory exists
  ansible.builtin.file:
    path: "{{ private_pi5_hermes_dgx_keep_warm_dir }}"
    state: directory
    owner: "{{ private_pi5_hermes_user }}"
    group: "{{ private_pi5_hermes_group }}"
    mode: "0750"

- name: Deploy Hermes DGX runtime client
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ private_pi5_hermes_user }}"
    group: "{{ private_pi5_hermes_group }}"
    mode: "{{ item.mode }}"
  loop:
    - src: "{{ private_pi5_repo_root }}/scripts/private-pi5-stackchan-bridge/dgx_runtime_client.py"
      dest: "{{ private_pi5_hermes_dgx_keep_warm_dir }}/dgx_runtime_client.py"
      mode: "0644"

- name: Deploy Hermes DGX runtime environment
  ansible.builtin.template:
    src: "../templates/private-pi5-hermes-dgx-keep-warm.env.j2"
    dest: "{{ private_pi5_hermes_dgx_keep_warm_env_path }}"
    owner: "{{ private_pi5_hermes_user }}"
    group: "{{ private_pi5_hermes_group }}"
    mode: "0600"
