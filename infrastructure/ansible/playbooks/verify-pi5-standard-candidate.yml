---
# Evaluation-only one-host canary boundary. No production launcher or canonical
# playbook references this playbook; the candidate name disappears at cutover.
- name: Verify the standard Pi5 release candidate on one Pi5 executor
  hosts: server
  connection: local
  gather_facts: false
  become: true
  serial: 1
  order: inventory
  roles:
    - role: release_pi5_standard_candidate
