---
# Read-only: report the agent containers of each selected Pi4 and write one
# result file per host into release_agent_guard_out_dir. Changes nothing.
# The guard forces ansible_ssh_args (no multiplexing), but Ansible appends ansible_ssh_common_args and
# ansible_ssh_extra_args after it, and OpenSSH lets "-S path" or an earlier ControlPath/ControlMaster/ControlPersist
# win. Refuse such arguments before any host is contacted (every task here is controller-local). Quotes and
# backslashes are refused too, so the arguments can be checked token by token.
- name: Refuse SSH multiplexing options in the connection arguments
  hosts: kiosk
  gather_facts: false
  any_errors_fatal: true
  # Never free: a refused host must stop every host before any other task runs.
  strategy: linear
  tasks:
    - name: No -S, ControlPath, ControlMaster or ControlPersist in the SSH arguments of this host
      ansible.builtin.assert:
        that:
          - agent_guard_ssh_flagged | length == 0
        fail_msg: >-
          Pi4 {{ inventory_hostname }} has SSH multiplexing options in {{ agent_guard_ssh_flagged | join(', ') }};
          the agent guard cannot run with them. Remove them from the inventory
          (ansible_ssh_common_args / ansible_ssh_extra_args).
        quiet: true
      tags:
        - always
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        agent_guard_ssh_sources:
          ansible_ssh_common_args: "{{ hostvars[inventory_hostname].ansible_ssh_common_args | default('') | string }}"
          ansible_ssh_extra_args: "{{ hostvars[inventory_hostname].ansible_ssh_extra_args | default('') | string }}"
        # Quotes, backslashes and line breaks (CR, LF, VT, FF) are refused outright: Ansible splits the value with shlex,
        # where they are whitespace too, but the -S check below only knows space and tab.
        # \x5c is written twice: the class stays valid whether or not the string escapes are decoded.
        agent_guard_ssh_flagged: >-
          {{ (agent_guard_ssh_sources | dict2items
                | selectattr('value', 'search', '[\x22\x27\x5c\x5c\x0a\x0b\x0c\x0d]')
                | map(attribute='key') | map('regex_replace', '$', ' (quote, backslash or line break)') | list)
             + (agent_guard_ssh_sources | dict2items
                | selectattr('value', 'search', '(^|[ \t])-[^- \toiplFEeBbcDIJLOQRWwm]*S')
                | map(attribute='key') | map('regex_replace', '$', ' (-S)') | list)
             + (agent_guard_ssh_sources | dict2items
                | selectattr('value', 'search', '(?i)control(path|master|persist)')
                | map(attribute='key') | map('regex_replace', '$', ' (ControlPath/ControlMaster/ControlPersist)') | list) }}

- name: Read the agent containers of the selected Pi4 kiosks
  hosts: kiosk
  gather_facts: false
  any_errors_fatal: false
  # docker ps/inspect run as root on the Pi4; not left to ansible.cfg.
  become: true
  tasks:
    # The Pi5 checkout inventory may expand a named group; read nothing unless the hosts are exactly the named ones.
    - name: The selected hosts must be exactly the named kiosks
      ansible.builtin.assert:
        that:
          - (ansible_play_hosts_all | sort) == (release_agent_images_expected_hosts_json | from_json | sort)
        fail_msg: the selected hosts differ from the named kiosks
      run_once: true
      tags:
        - always
    - name: Read agent images for this Pi4
      ansible.builtin.import_role:
        name: release_kiosk
        tasks_from: agent_images
