---
# Registry-selected Pi3/signage release executor. The coordinator supplies one
# exact host through --limit and a sealed source reference. Source application
# remains inside Ansible and the existing rollback authority.
- name: Deploy one sealed Raspberry Pi 3 signage release
  hosts: signage
  gather_facts: false
  become: true
  serial: 1
  order: inventory
  vars:
    repo_path: /opt/RaspberryPiSystem_002
    repo_version: >-
      {{ lookup('env', 'ANSIBLE_REPO_VERSION') | default('main', true) }}

  pre_tasks:
    - name: Require canonical rolling release context
      ansible.builtin.import_tasks: "../tasks/assert-release-orchestration.yml"

    - name: Require terminal release-only mode before signage preparation
      ansible.builtin.import_tasks: "../tasks/assert-terminal-release-mode.yml"

    - name: Require an active display manager before signage release
      ansible.builtin.import_tasks: "../tasks/preflight-terminal-display.yml"

    - name: Apply coordinator-sealed signage repository source
      ansible.builtin.import_role:
        name: signage
        tasks_from: release-preparation
        allow_duplicates: true

  tasks:
    - name: Run Tailscale preflight checks
      ansible.builtin.include_tasks: "../tasks/preflight-tailscale.yml"
      when:
        - network_mode | default('tailscale') == 'tailscale'
        - tailscale_enabled | default(false) | bool

    - name: Run signage preflight checks
      ansible.builtin.include_tasks: "../tasks/preflight-signage.yml"
      when:
        - manage_signage_lite | default(false) | bool

    - name: Run resource guard checks
      ansible.builtin.include_tasks: "../tasks/resource-guard.yml"

    - name: Apply client-specific deployment tasks
      ansible.builtin.import_role:
        name: client

    - name: Apply signage-specific deployment tasks
      ansible.builtin.import_role:
        name: signage
        allow_duplicates: true
      when: manage_signage_lite | default(false) | bool

    - name: Apply kiosk-specific deployment tasks (if enabled)
      ansible.builtin.import_role:
        name: kiosk
      when: manage_kiosk_browser | default(false) | bool

    - ansible.builtin.include_tasks: "../tasks/update-clients-core.yml"

  handlers:
    - name: restart pcscd
      ansible.builtin.systemd:
        name: pcscd
        state: restarted

  post_tasks:
    - name: Start lightdm after deployment to restore GUI
      ansible.builtin.systemd:
        name: lightdm
        state: started
      when:
        - manage_signage_lite | default(false) | bool
        - lightdm_stopped is defined
        - lightdm_stopped is changed

    - name: Wait for lightdm to become active
      ansible.builtin.shell: |
        for i in {1..30}; do
          if systemctl is-active lightdm.service >/dev/null 2>&1; then
            echo "lightdm.service is active"
            exit 0
          fi
          sleep 2
        done
        echo "lightdm.service did not become active within 60 seconds"
        exit 1
      register: lightdm_check
      changed_when: false
      when:
        - manage_signage_lite | default(false) | bool
        - lightdm_stopped is defined
        - lightdm_stopped is changed

    - name: Reload systemd before restoring constrained signage services
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - manage_signage_lite | default(false) | bool
        - lightdm_stopped is defined
        - lightdm_stopped is changed

    - name: Wait for constrained signage units to be registered
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=LoadState
          - --value
          - "{{ item }}"
      loop:
        - signage-lite-update.timer
        - signage-lite-watchdog.timer
        - signage-daily-reboot.timer
        - signage-lite.service
      register: signage_restore_unit
      changed_when: false
      retries: 5
      delay: 3
      until:
        - signage_restore_unit.rc == 0
        - signage_restore_unit.stdout | trim == 'loaded'
      when:
        - manage_signage_lite | default(false) | bool
        - lightdm_stopped is defined
        - lightdm_stopped is changed

    - name: Start signage services after lightdm restore
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
      loop:
        - signage-lite-update.timer
        - signage-lite-watchdog.timer
        - signage-daily-reboot.timer
        - signage-lite.service
      register: signage_restore_service
      retries: 3
      delay: 5
      until: signage_restore_service is succeeded
      when:
        - manage_signage_lite | default(false) | bool
        - lightdm_stopped is defined
        - lightdm_stopped is changed

    - name: Wait for signage-lite service to become active after restore
      ansible.builtin.shell: |
        for i in {1..30}; do
          if systemctl is-active signage-lite.service >/dev/null 2>&1; then
            echo "signage-lite.service is active"
            exit 0
          fi
          sleep 2
        done
        echo "signage-lite.service did not become active within 60 seconds"
        exit 1
      register: signage_check
      changed_when: false
      when:
        - manage_signage_lite | default(false) | bool
        - lightdm_stopped is defined
        - lightdm_stopped is changed

    - name: Capture lightdm status after restore attempt
      ansible.builtin.shell: systemctl status lightdm --no-pager
      register: lightdm_status
      changed_when: false
      failed_when: false
      when:
        - lightdm_check is defined
        - lightdm_check.rc is defined
        - lightdm_check.rc != 0

    - name: Capture signage-lite status after restore attempt
      ansible.builtin.shell: systemctl status signage-lite --no-pager
      register: signage_status
      changed_when: false
      failed_when: false
      when:
        - signage_check is defined
        - signage_check.rc is defined
        - signage_check.rc != 0

    - name: Report signage service status after restore
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: {{ signage_check.stdout | default('signage check skipped') }}"
          - "{{ lightdm_status.stdout | default('lightdm status skipped') }}"
          - "{{ signage_status.stdout | default('signage status skipped') }}"
      when:
        - signage_check is defined
