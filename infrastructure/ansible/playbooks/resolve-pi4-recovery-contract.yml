---
- name: Resolve one secret-free Pi4 recovery inventory contract on the controller
  hosts: all
  connection: local
  gather_facts: false
  become: false
  vars:
    recovery_server_hosts: "{{ groups['server'] | default([]) }}"
  pre_tasks:
    - name: Require a safe controller output path and supported inventory host
      ansible.builtin.assert:
        that:
          - recovery_contract_output_path is defined
          - recovery_contract_output_path | string | length > 0
          - inventory_hostname in (groups['kiosk'] | default([]))
          - inventory_hostname is match('^[a-z0-9][a-z0-9-]{0,79}$')
          - recovery_server_hosts | length == 1
        fail_msg: >-
          Recovery contract resolution requires one selected kiosk host and
          exactly one inventory server.

    - name: Require complete recovery values without displaying their contents
      ansible.builtin.assert:
        that:
          - ansible_host is defined
          - ansible_host | string | trim | length > 0
          - ansible_user is defined
          - ansible_user | string | trim | length > 0
          - status_agent_client_id is defined
          - status_agent_client_id | string | trim | length > 0
          - status_agent_client_key is defined
          - status_agent_client_key | string | trim | length > 0
          - nfc_agent_client_id is defined
          - nfc_agent_client_id | string | trim | length > 0
          - nfc_agent_client_secret is defined
          - nfc_agent_client_secret | string | trim | length > 0
          - kiosk_url is defined
          - kiosk_url | string | trim | length > 0
          - hostvars[recovery_server_hosts[0]].status_agent_client_id is defined
          - hostvars[recovery_server_hosts[0]].status_agent_client_id | string | trim | length > 0
        fail_msg: The selected host is missing required recovery inventory values.
      no_log: true
  tasks:
    - name: Write the evaluated secret-free recovery contract
      ansible.builtin.copy:
        dest: "{{ recovery_contract_output_path }}"
        mode: "0600"
        content: >-
          {{
            {
              'schemaVersion': 2,
              'target': {
                'host': inventory_hostname,
                'inventoryEndpoint': ansible_host | string,
                'user': ansible_user | string,
                'statusAgentClientId': status_agent_client_id | string,
                'recoveryEnabled': pi4_recovery_enabled | default(false) | bool,
                'kioskManaged': manage_kiosk_browser | default(false) | bool,
                'nfcEnabled': (
                  nfc_agent_client_id is defined
                  and nfc_agent_client_id | string | trim | length > 0
                ),
                'barcodeEnabled': barcode_agent_enabled | default(false) | bool,
                'requiredSecretsConfigured': (
                  status_agent_client_key is defined
                  and status_agent_client_key | string | trim | length > 0
                  and nfc_agent_client_secret is defined
                  and nfc_agent_client_secret | string | trim | length > 0
                  and kiosk_url is defined
                  and kiosk_url | string | trim | length > 0
                )
              },
              'server': {
                'host': recovery_server_hosts[0],
                'statusAgentClientId': (
                  hostvars[recovery_server_hosts[0]].status_agent_client_id | string
                )
              },
              'recoveryNetwork': {
                'mode': 'lan',
                'configured': (
                  pi4_recovery_lan_endpoint is defined
                  and pi4_recovery_lan_endpoint | string | trim | length > 0
                  and local_network is defined
                  and (local_network | default({})).raspberrypi5_ip is defined
                  and (local_network | default({})).raspberrypi5_ip | string | trim | length > 0
                ),
                'targetEndpoint': pi4_recovery_lan_endpoint | default('') | string,
                'serverEndpoint': (local_network | default({})).raspberrypi5_ip | default('') | string
              }
            } | to_nice_json
          }}
      no_log: true
