---
# This playbook is intentionally separate from the standard fleet deployment.
# It has one explicit inventory target so a recovery backup cannot be enabled on
# a kiosk, signage device, or another server by accident.
# Timer state follows inventory (disabled when undefined); use
# -e google_drive_dr_timer_enabled=false during initial provisioning.
- name: Configure Business Pi5 Google Drive disaster-recovery backup
  hosts: raspberrypi5
  gather_facts: false
  become: true
  serial: 1
  vars:
    google_drive_dr_project_root: /opt/RaspberryPiSystem_002
    google_drive_dr_install_root: /opt/raspi-google-drive-dr
    google_drive_dr_credential_root: /etc/raspi-google-drive-dr
    google_drive_dr_staging_root: /var/backups/raspi-google-drive-dr-staging
    google_drive_dr_env_file: /etc/raspi-google-drive-dr/backup.env
    google_drive_dr_rclone_config: /etc/raspi-google-drive-dr/rclone.conf
    google_drive_dr_restic_password_file: /etc/raspi-google-drive-dr/restic-password
    google_drive_dr_repository: rclone:google-drive:RaspberryPiSystem_002/business-pi5
    google_drive_dr_service_name: raspi-google-drive-dr.service
    google_drive_dr_timer_name: raspi-google-drive-dr.timer
    oracle_dr_rclone_root: "{{ google_drive_dr_install_root }}/bin/rclone-v1.76.0"

  pre_tasks:
    - name: Refuse any host other than the Business Pi5
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'raspberrypi5'
        fail_msg: >-
          This playbook is a dedicated Business Pi5 DR boundary. It must only
          run against the exact inventory host raspberrypi5.
        quiet: true

    - name: Refuse a non-server inventory group
      ansible.builtin.assert:
        that:
          - "'server' in group_names"
        fail_msg: >-
          raspberrypi5 must remain a member of the server inventory group before
          the dedicated DR playbook can run.
        quiet: true

    - name: Check that the encrypted backup credentials were pre-provisioned
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ google_drive_dr_rclone_config }}"
        - "{{ google_drive_dr_restic_password_file }}"
      register: google_drive_dr_credential_stats

    - name: Require regular root-owned 0600 credential files
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isreg | default(false)
          - item.stat.pw_name | default('') == 'root'
          - item.stat.gr_name | default('') == 'root'
          - item.stat.mode | default('') == '0600'
        fail_msg: >-
          Each DR credential must be pre-provisioned as a root-owned regular
          file with mode 0600. Secret contents are never created or rendered by
          this playbook.
      loop: "{{ google_drive_dr_credential_stats.results }}"
      no_log: true

  tasks:
    - name: Install host tools required by the dedicated DR runner
      ansible.builtin.package:
        name:
          - python3
          - restic
          - rclone
        state: present

    - name: Create the dedicated DR install directory
      ansible.builtin.file:
        path: "{{ google_drive_dr_install_root }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create the dedicated DR staging directory
      ansible.builtin.file:
        path: "{{ google_drive_dr_staging_root }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create the dedicated credential directory without changing secrets
      ansible.builtin.file:
        path: "{{ google_drive_dr_credential_root }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Re-assert credential ownership and mode after directory creation
      ansible.builtin.file:
        path: "{{ item }}"
        state: file
        owner: root
        group: root
        mode: '0600'
      loop:
        - "{{ google_drive_dr_rclone_config }}"
        - "{{ google_drive_dr_restic_password_file }}"
      no_log: true

    - name: Install the isolated DR Python package
      ansible.builtin.file:
        path: "{{ google_drive_dr_install_root }}/google_drive_dr"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy only the isolated DR runtime Python files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../scripts/google_drive_dr/{{ item }}"
        dest: "{{ google_drive_dr_install_root }}/google_drive_dr/{{ item }}"
        owner: root
        group: root
        mode: '0755'
        directory_mode: '0755'
      loop:
        - __init__.py
        - command_port.py
        - source_policy.py
        - snapshot_builder.py
        - restic_repository.py
        - restore_validator.py
        - runner.py

    - name: Install the offline DR copy and check scripts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../scripts/google_drive_dr/{{ item }}.sh"
        dest: "{{ google_drive_dr_install_root }}/{{ item }}.sh"
        owner: root
        group: root
        mode: '0755'
      loop:
        - offline-dr-copy
        - offline-dr-copy-check
        - oracle-dr-copy

    - name: Check for the dedicated Oracle DR rclone binary
      ansible.builtin.stat:
        path: "{{ oracle_dr_rclone_root }}/rclone"
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: oracle_dr_rclone_binary

    - name: Install the dedicated Oracle DR rclone when absent
      when: not oracle_dr_rclone_binary.stat.exists
      block:
        - name: Create the dedicated rclone directory
          ansible.builtin.file:
            path: "{{ oracle_dr_rclone_root }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Download the pinned Linux ARM64 rclone archive
          ansible.builtin.get_url:
            url: https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-arm64.zip
            dest: "{{ oracle_dr_rclone_root }}/rclone.zip"
            checksum: sha256:ee169016675e23a69d77240565133ff7dbc9b33d16fa8f7053d4af39f1eaeb78
            owner: root
            group: root
            mode: '0600'

        - name: Extract only the rclone binary with Python
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - |
                import shutil
                import sys
                import tempfile
                from pathlib import Path
                from zipfile import ZipFile

                destination = Path(sys.argv[2])
                with tempfile.TemporaryDirectory(dir=destination.parent) as directory:
                    binary = Path(directory) / destination.name
                    with ZipFile(sys.argv[1]) as archive:
                        with archive.open("rclone-v1.76.0-linux-arm64/rclone") as source, binary.open("wb") as output:
                            shutil.copyfileobj(source, output)
                    binary.chmod(0o755)
                    binary.replace(destination)
              - "{{ oracle_dr_rclone_root }}/rclone.zip"
              - "{{ oracle_dr_rclone_root }}/rclone"
            creates: "{{ oracle_dr_rclone_root }}/rclone"

        - name: Remove the downloaded rclone archive
          ansible.builtin.file:
            path: "{{ oracle_dr_rclone_root }}/rclone.zip"
            state: absent

    - name: Inspect metadata of the pre-provisioned OCI files
      ansible.builtin.stat:
        path: "{{ google_drive_dr_credential_root }}/oci/{{ item }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop:
        - pi5-dr-writer.pem
        - config
        - oracle.env
      register: oracle_dr_credential_stats
      no_log: true

    - name: Determine whether all OCI files are regular root-owned 0600 files
      ansible.builtin.set_fact:
        oracle_dr_credentials_ready: >-
          {{ oracle_dr_credential_stats.results
             | selectattr('stat.isreg', 'defined')
             | selectattr('stat.isreg', 'equalto', true)
             | selectattr('stat.uid', 'equalto', 0)
             | selectattr('stat.mode', 'equalto', '0600')
             | list | length == oracle_dr_credential_stats.results | length }}
      no_log: true

    - name: Install the non-secret DR environment contract
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/raspi-google-drive-dr.env.j2"
        dest: "{{ google_drive_dr_env_file }}"
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd units

    - name: Install the DR failure alert unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/raspi-google-drive-dr-alert.service.j2"
        dest: /etc/systemd/system/raspi-google-drive-dr-alert.service
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd units

    - name: Install the DR service unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/raspi-google-drive-dr.service.j2"
        dest: "/etc/systemd/system/{{ google_drive_dr_service_name }}"
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd units

    - name: Install the DR timer unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/raspi-google-drive-dr.timer.j2"
        dest: "/etc/systemd/system/{{ google_drive_dr_timer_name }}"
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd units

    - name: Install the offline DR copy check service and timer
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/offline-dr-copy-check.{{ item }}.j2"
        dest: "/etc/systemd/system/offline-dr-copy-check.{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - service
        - timer
      notify: Reload systemd units

    - name: Install the Oracle DR copy units
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/oracle-dr-copy{{ item }}.j2"
        dest: "/etc/systemd/system/oracle-dr-copy{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - .service
        - .timer
        - -alert.service
      notify: Reload systemd units

    - name: Flush unit installation handlers before managing the timers
      ansible.builtin.meta: flush_handlers

    - name: Apply the configured DR timer state (disabled when undefined)
      ansible.builtin.systemd:
        name: "{{ google_drive_dr_timer_name }}"
        enabled: "{{ google_drive_dr_timer_enabled | default(false) | bool }}"
        state: "{{ 'started' if (google_drive_dr_timer_enabled | default(false) | bool) else 'stopped' }}"
        daemon_reload: true

    - name: Enable and start the offline DR copy check timer
      ansible.builtin.systemd:
        name: offline-dr-copy-check.timer
        enabled: true
        state: started

    - name: Apply the Oracle DR copy timer state based on OCI file readiness
      ansible.builtin.systemd:
        name: oracle-dr-copy.timer
        enabled: "{{ oracle_dr_credentials_ready | bool }}"
        state: "{{ 'started' if (oracle_dr_credentials_ready | bool) else 'stopped' }}"

    - name: Explain why the Oracle DR copy timer was stopped
      ansible.builtin.debug:
        msg: "必要な OCI の事前ファイル（root 所有、0600 の通常ファイル）が揃っていないため、oracle-dr-copy.timer を停止しました。"
      when: not (oracle_dr_credentials_ready | bool)

  handlers:
    - name: Reload systemd units
      ansible.builtin.systemd:
        daemon_reload: true
