---
# The artifact is host-neutral and immutable. Host settings are managed outside
# the release tree by the Signage role, so this compatibility entrypoint only
# validates the old coordinator hand-off and never creates rendered payloads.
- name: Prepare one verified Pi3 Signage artifact candidate
  hosts: signage
  gather_facts: false
  become: true
  serial: 1
  order: inventory

  pre_tasks:
    - name: Require canonical rolling release context
      ansible.builtin.import_tasks: "../tasks/assert-release-orchestration.yml"

    - name: Require terminal release-only mode before candidate rendering
      ansible.builtin.import_tasks: "../tasks/assert-terminal-release-mode.yml"

    - name: Validate sealed Signage artifact stage authority
      ansible.builtin.assert:
        that:
          - terminal_signage_artifact_stage is mapping
          - terminal_signage_artifact_stage.keys() | sort == signage_stage_keys | sort
          - terminal_signage_artifact_stage.schemaVersion == 1
          - terminal_signage_artifact_stage.host == inventory_hostname
          - terminal_signage_artifact_stage.runId is match('^[0-9]{8}-[0-9]{6}-[0-9a-f]{6}$')
          - terminal_signage_artifact_stage.sourceSha is match('^[0-9a-f]{40}$')
          - terminal_signage_artifact_stage.artifactSha256 is match('^[0-9a-f]{64}$')
          - terminal_signage_artifact_stage.manifestSha256 is match('^[0-9a-f]{64}$')
          - terminal_signage_artifact_stage.payloadDigest is match('^[0-9a-f]{64}$')
          - terminal_signage_artifact_stage.ociDigest is match('^sha256:[0-9a-f]{64}$')
          - terminal_signage_artifact_stage.readyPath == '/var/tmp/raspisystem-signage-stage/' ~ terminal_signage_artifact_stage.runId ~ '/ready'
          - terminal_signage_artifact_stage.renderedRoot == '/var/tmp/raspisystem-signage-stage/' ~ terminal_signage_artifact_stage.runId ~ '/rendered'
        fail_msg: Signage artifact stage authority is malformed
      vars:
        signage_stage_keys:
          - artifactSha256
          - host
          - manifestSha256
          - ociDigest
          - payloadDigest
          - readyPath
          - renderedRoot
          - runId
          - schemaVersion
          - sourceSha

    - name: Prove the rendered candidate path is initially absent
      ansible.builtin.stat:
        path: "{{ terminal_signage_artifact_stage.renderedRoot }}"
        follow: false
      register: signage_rendered_root

    - name: Refuse a colliding rendered candidate path
      ansible.builtin.assert:
        that:
          - not signage_rendered_root.stat.exists
        fail_msg: Signage rendered candidate path already exists

  tasks:
    - name: Confirm the immutable artifact requires no host-bound rendering
      ansible.builtin.debug:
        msg: Host-specific Signage settings are external to the immutable artifact.
