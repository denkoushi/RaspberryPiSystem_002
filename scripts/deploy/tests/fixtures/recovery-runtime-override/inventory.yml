all:
  vars:
    network_mode: tailscale
    local_network:
      raspberrypi5_ip: 192.168.10.230
    tailscale_network:
      raspberrypi5_ip: 100.100.100.100
    current_network: "{{ local_network if network_mode == 'local' else tailscale_network }}"
    server_ip: "{{ current_network.raspberrypi5_ip }}"
    server_base_url: "https://{{ server_ip }}"
  hosts:
    raspi4-recovery-precedence:
      ansible_connection: local
      ansible_host: 100.80.10.20
      ansible_user: recovery-user
