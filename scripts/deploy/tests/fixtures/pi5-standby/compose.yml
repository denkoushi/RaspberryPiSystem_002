# Used only by test-pi5-standby-integration.sh; never loads repository .env.
x-db: &db
  image: pgvector/pgvector:pg18
  environment:
    POSTGRES_PASSWORD: ${STANDBY_TEST_PASSWORD:?generated by test script}
    POSTGRES_DB: standby_test
    PGDATA: /var/lib/postgresql/18/docker
  networks: [replication]
  labels:
    com.raspi-system.temporary: 'true'
services:
  primary:
    <<: *db
    command: [postgres, -c, wal_level=replica, -c, max_wal_senders=5, -c, max_replication_slots=3, -c, wal_keep_size=0, -c, max_slot_wal_keep_size=32MB]
    volumes: [primary-data:/var/lib/postgresql]
  standby:
    <<: *db
    volumes: [standby-data:/var/lib/postgresql]
    # Keep the container available for the guarded, explicit basebackup.
    entrypoint: [sleep, infinity]
  wal-probe:
    <<: *db
    volumes: [wal-probe-data:/var/lib/postgresql]
    entrypoint: [sleep, infinity]
volumes:
  primary-data:
  standby-data:
  wal-probe-data:
networks:
  replication:
    internal: true
