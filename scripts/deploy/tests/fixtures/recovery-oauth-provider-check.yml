---
- name: Exercise the recovery OAuth provider without contacting a managed host
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    tailscale_recovery_oauth_client_id: fake-oauth-client-id
    tailscale_recovery_oauth_client_secret: sentinel-long-lived-oauth-secret
    tailscale_recovery_oauth_tag: tag:kiosk
    tailscale_recovery_oauth_retry_attempts: 3
    tailscale_recovery_oauth_retry_delay_seconds: 0
  tasks:
    - name: Obtain the isolated test auth key
      ansible.builtin.include_role:
        name: tailscale_recovery_auth

    - name: Write only a non-secret success result
      ansible.builtin.copy:
        dest: "{{ recovery_oauth_test_result_path }}"
        mode: "0600"
        content: >-
          {{
            {
              'configured': tailscale_effective_auth_key | default('') | length > 0,
              'tag': tailscale_recovery_oauth_tag
            } | to_nice_json
          }}
      no_log: true
    - name: Clear the isolated test auth key
      ansible.builtin.set_fact:
        tailscale_effective_auth_key: ""
      no_log: true
